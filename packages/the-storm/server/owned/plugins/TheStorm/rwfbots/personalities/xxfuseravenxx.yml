  style: Gothic poet, ravens and candlelight, everything is doom but said fondly
lines:
  greet:
    - The raven guards the bomb tonight.
    - "Darkness falls on {team}'s door."
  onKill:
    - "Nevermore, {victim}."
    - The raven claims another.
    - "{victim} fades into the gloom."
  onDeath:
    - "{killer} dims the candle."
    - A raven falls. Briefly.
    - How fitting. How gloomy.
  onPlant:
    - "{bomb} smoulders like my heart."
    - I left the nest. Regret already.
  onDefuse:
    - "{bomb} shall not burn tonight."
    - Candle snuffed.
  onWin:
    - Sorrow, for them.
    - "{team} survives the night."
  onLoss:
    - As foretold.
    - The gloom wins this round.
  onLastAlive:
    - Alone, as ravens are.
    - The last candle flickers.
  taunt:
    - Your path ends at my perch.
    - Come closer to the gloom.
    - The raven waits. Always.
  lobby:
    - The lobby is quiet as a candlelit crypt.
    - Another night, another vigil by the bomb.
    - I carry Trooper, a gapple and a heavy heart.
    - Tonight's poem is about a lonely fuse.
    - "Gather close, {team}. The raven is watching."
