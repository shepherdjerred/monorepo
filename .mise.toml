# Mise configuration for monorepo development AND CI.
# `mise install` provides every toolchain: dev machines, git hooks, and the
# CI toolchain image (.buildkite/ci-image) are all baked from this one file,
# so laptop and CI can never disagree about tool versions.

[tools]
# renovate: datasource=github-releases depName=oven-sh/bun
bun = "1.4.0"
# Temporal's real workflow-worker tests need Node runtime primitives that Bun
# 1.4 does not implement. Keep the sole exception on the current LTS line.
node = "24.19.0"
rust = "1.98.0"
# renovate: datasource=dotnet-sdk depName=dotnet-sdk
dotnet = "10.0.302"
# C# is a third-party UniFFI binding. Keep the generator outside Cargo.toml:
# it is a developer/CI tool, not part of the shipped Rust dependency graph.
# renovate: datasource=github-tags depName=NordSecurity/uniffi-bindgen-cs
"cargo:https://github.com/NordSecurity/uniffi-bindgen-cs" = { version = "tag:v0.11.0+v0.31.0", bin = "uniffi-bindgen-cs" }
# Explicit deep-quality tools. These are scheduled/operator gates, not ordinary
# PR-lane work, but they stay pinned with the rest of the repository toolchain.
# renovate: datasource=crate depName=cargo-mutants
"cargo:cargo-mutants" = "27.1.0"
# renovate: datasource=crate depName=cargo-llvm-cov
"cargo:cargo-llvm-cov" = "0.9.0"
# tasknotes-core's `deny` script (supply-chain + license + build-script bans).
# No mise registry entry exists, so this names the backend explicitly; `github:`
# fetches the release binary and verifies its artifact attestation and SLSA
# provenance, where `cargo:` would build it from source on every CI image bake.
# renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
"github:EmbarkStudios/cargo-deny" = "0.20.2"
# renovate: datasource=github-releases depName=corretto/corretto-25 versioning=loose
java = "corretto-25.0.4.8.1"
# Repo-wide checks + git hooks (verify/pre-commit call these directly)
gitleaks = "8"
shellcheck = "0.11"
# Native-family shims
go = "1.27.0"
golangci-lint = "2"
# Release automation (cooklang publish, release commit-backs) shells out to gh
gh = "2"
# CI scripts (bake-images.ts affected-scoping + digest collection) use jq
jq = "1"
# Semantic YAML/JSON comparison in the Minecraft config-drift check test
# (misc/minecraft-drift-check.test.ts shells out to yq, matching the yq the
# init container runs at deploy time)
yq = "4"
# Shared local/CI Postgres for scout-for-lol dev + tests. Prebuilt binaries
# (initdb/pg_ctl/psql/createdb/dropdb); major 16 matches the homelab clusters
# (resources/postgres/*.ts, PostgresqlSpecPostgresqlVersion.VALUE_16).
# renovate: datasource=github-releases depName=theseus-rs/postgresql-binaries
"ubi:theseus-rs/postgresql-binaries" = { version = "16.15.0", extract_all = "true", bin_path = "bin" }
# Homelab automation (helm push, tofu wrappers, ArgoCD sync, site deploys)
helm = "4"
opentofu = "1.12.6"
argocd = "3"
awscli = "2"
