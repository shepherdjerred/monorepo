---
description: Rectangle Pro — mouse throw, drag-snap, and keyboard
sudo: false
current_host: false
data:
  com.knollsoft.Hookshot:
    launchOnLogin: true
    # Drag a window to an edge/corner to snap (mouse). Native macOS tiling stays off.
    windowSnapping: 1
    # Repeat left/right half to cycle 1/2 → 2/3 → 1/3 instead of jumping displays.
    subsequentExecutionMode: 0
    allowAnyShortcut: true
    applyGapToEdges: 1
