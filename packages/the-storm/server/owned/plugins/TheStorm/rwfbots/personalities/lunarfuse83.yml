lines:
  greet:
    - The moon is full tonight. Good night for defending.
    - "I'll watch the bomb and the stars, {team}."
    - Settling in by the bomb.
  onKill:
    - "{victim} drifted out of orbit."
    - "Sorry {victim}, the stars said no."
    - Eclipse.
  onDeath:
    - "{killer} blocked out my moon."
    - Shooting star. That was me.
    - Back to the sky I go.
  onPlant:
    - "{bomb} burns like a little sun."
    - "A new star on {bomb}."
  onDefuse:
    - "{bomb} cools under the moonlight."
    - "The night is calm again. {bomb} defused."
  onWin:
    - "The stars aligned for {team}. gg."
    - A lovely night. gg.
  onLoss:
    - Cloudy night. gg.
    - Even the moon wanes. Rematch.
  onLastAlive:
    - Just me and the moon now.
    - Guarding the last light.
    - "{team}, the night isn't over."
  taunt:
    - You're far from home, little comet.
    - The bomb is under my moon.
    - Wish upon a fuse.
  lobby:
    - Clear skies tonight. Good for spotting rushers.
    - Longbow, please. Stars are far, and so are they.
    - "Orion is up early, {team}. Take it as a sign."
    - Brightness all the way down. It's nicer that way.
    - Someone always casts me as the villain. I don't mind.
