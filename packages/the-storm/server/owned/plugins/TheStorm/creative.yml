# Recovered 2016 creative plot world. The plugin never writes this file.
# CoreProtect history is not configured here. plugins/CoreProtect/creative.yml
# can turn logging off for this world; the module then refuses to start.
# Grid numbers are the measurement of TheStorm_creative_snapshot-2016-01-10
# (plot 82 including the stone wall, road 10, surface at y=64). The grass
# floor inside the wall is 80 by 80. A mismatch with that template refuses
# to boot. The playable circle is centered at 0,0 with radius 1500. Terrain
# and recovered claims outside it remain saved. borderSize is a diameter and
# matches the creative circle in world.yml.
#
# plots is the 10 Jan 2016 catalog. A row is a claim sign (ID / Owner / name /
# Claimed, on the road at the plot's north-west corner) or an interior that is
# not the repeated grass, tree, and flower paste. owner is a UUID from that
# snapshot's playerdata when the sign name matched one player. A blank owner is
# staff-held: the name is not in the snapshot, or the build has no claim sign.
# Those signs have no plot name, description, or trust list. Empty cells are
# not listed.
world: creative
plotWidth: 82
roadWidth: 10
roadOffsetX: 0
roadOffsetZ: 0
surfaceY: 64
borderCenterX: 0
borderCenterZ: 0
borderSize: 3000
claimCap: 2
entityCap: 200
brushRadius: 8
commentLength: 140
commentCap: 20
