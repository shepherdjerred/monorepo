# Mechanics: the Mechanic track's sign mechanisms (replaces CraftBook).
# Owned by the repository; the plugin never writes it. Every key is required.
#
# Each feature has an on/off switch and the Mechanic track level (1-5) it
# needs. Sign mechanisms also set useLevel: the level needed to use one
# (0 lets everyone use it). Creating a mechanism also needs land protection's
# build permission there; using one needs its interact permission.
#
# Tags go on a sign's second line and are matched ignoring case and spaces.
# Redstone power opens bridges, doors and gates; losing it closes them.

# Level I
hiddenSwitch: # [X] on a wall sign: right-click the block from the other side
