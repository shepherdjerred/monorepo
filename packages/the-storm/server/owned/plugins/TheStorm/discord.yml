# The Discord bridge (replaces DiscordSRV). Owned by the repository; the
# plugin never writes it. Every key is required.
#
# Secrets never live here. The token and channel id come from the environment
# variables named below (1Password item minecraft-tsmc-discord). Without them
# the module refuses to start, so keep it switched off in config.yml until the
# deployment provides both.
tokenEnv: DISCORD_BOT_TOKEN
channelEnv: DISCORD_CHANNEL_ID

# The bot's custom status. The bot is online only while the server is awake,
# so Discord messages sent while it sleeps are not relayed.
status: "Relaying chat while The Storm is awake"

# The label Discord messages carry in game, as in [D][author]: message.
source: D

# Longest Discord message relayed into the game; longer ones are cut.
maxInboundLength: 200

# Minigame lobby posts may ping these Discord role ids (create the role by
# hand in the server and paste its id). One game pings at most once per
# cooldown; its other lobby posts stay silent. An empty list pings nobody.
lobbyPing:
  roles: []
  cooldownMinutes: 30

# Progress worth a post: a town reaching one of these claim counts (once per
# town while the server is up), and a skill crossing each multiple of
# skillLevelEvery (skills cap at 1000).
milestones:
  townClaims: [25, 50, 100, 200]
  skillLevelEvery: 100

# What the bot posts, in Discord markdown. {placeholders} are filled with
# escaped text; mentions and push/desktop notifications are disabled except
# for lobbyPing. Discord still shows unread activity; mute the linked channel
# to hide that too.
messages:
  chat: "**{player}**: {message}"
  join: "**{player}** joined the server"
  leave: "**{player}** left the server"
  death: "{message}"
  advancement: "**{player}** has made the advancement **{advancement}**"
  start: "The Storm has woken up"
  stop: "The Storm sleeps. Join ts-mc.net to wake it."
  list: "Online ({count}): {players}"
  listEmpty: "Nobody is online. Join ts-mc.net!"
  ticketOpened: "Ticket #{id} [{server}/{priority}] {category} from **{reporter}**: {summary}"
  ticketClaimed: "Ticket #{id} [{server}] claimed by **{staff}**"
  ticketResolved: "Ticket #{id} [{server}] resolved by **{staff}**"
  ticketEscalated: "Ticket #{id} [{server}/{priority}] needs a human: {summary}"
  ticketReopened: "Ticket #{id} [{server}] reopened"
  ticketTriaged: "Ticket #{id} [{server}] triaged [{priority}]: {evidence}"
  rwfLobbyOpened: "**{player}** opened a Search and Destroy lobby. Join with `/rwf join` on ts-mc.net"
  rwfWon: "Search and Destroy on **{map}**: **{team}** won in {duration}. GG {winners}"
  rwfDraw: "Search and Destroy on **{map}** ended in a draw after {duration}: {players}"
  arenaLobbyOpened: "**{player}** opened the **{arena}** Mob Arena. Join with `/arena join` on ts-mc.net"
  arenaBossWave: "**{arena}** reached boss wave {wave}: {boss}"
  arenaRunEnded: "**{arena}** ({tier}) run over at wave {wave}: {players}"
  arenaRecord: "New **{arena}** ({tier}) record: wave {wave}! {players}"
  townFounded: "**{player}** founded the town of **{town}**"
  townGrew: "**{town}** now claims {claims} chunks"
  questMilestone: "**{player}** completed **{quest}**"
  skillMilestone: "**{player}** reached {skill} level {level}"
  seasonalActive: "**{event}** is on until {until}. Join ts-mc.net to take part"
