# BlueMap map for Skylands. Owned by the repository: plugins/BlueMap/maps is an
# owned root, so the image replaces this file on every boot and removes maps
# it does not ship. Keys and defaults follow BlueMap's generated map.conf.
world: "world"
dimension: "minecraft:skylands"
name: "Skylands"
sorting: 3
start-pos: { x: 0, z: 0 }
sky-color: "#7dabff"
void-color: "#7dabff"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: 55
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
# Matches the native border in plugins/TheStorm/world.yml.
render-mask: [
  { min-x: -5000, max-x: 4999, min-z: -5000, max-z: 4999 }
]
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: false
marker-sets: {}
