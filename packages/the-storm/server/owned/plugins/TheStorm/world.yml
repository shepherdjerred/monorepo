# Worlds the world module requires to be loaded before enable. Paper owns world,
# world_nether and world_the_end; Multiverse loads the other provisioned worlds
# and the skylands module generates skylands. Owned by the repository; the
# plugin never writes it.
# sleepPercentage is the share of awake players who must be in a bed to skip
# the night, on every overworld. Entering a bed is the only vote.

sleepPercentage: 50
# Border diameters. Every listed world has a circle centered at 0,0. The
# native square uses the same diameter; the world module enforces the disc.
# Existing saved terrain outside a circle is retained, including creative.
borders:
  - { world: world, centerX: 0.0, centerZ: 0.0, size: 14000.0, shape: circle }
  - { world: map2, centerX: 0.0, centerZ: 0.0, size: 24000.0, shape: circle }
  - {
      world: world_nether,
      centerX: 0.0,
      centerZ: 0.0,
      size: 10000.0,
      shape: circle,
    }
  - {
      world: world_the_end,
      centerX: 0.0,
      centerZ: 0.0,
      size: 3500.0,
      shape: circle,
    }
  - {
      world: frontier,
      centerX: 0.0,
      centerZ: 0.0,
      size: 14000.0,
      shape: circle,
    }
  - { world: skylands, centerX: 0.0, centerZ: 0.0, size: 6000.0, shape: circle }
  - { world: creative, centerX: 0.0, centerZ: 0.0, size: 3000.0, shape: circle }
# The crier reads current main-world weather and time only when asked.
crier:
  enabled: true
  world: world
# One weather-grounded archive bark on arrival near the windmill spawn per
# Pacific date. Event-driven; no repeating task or automatic server broadcast.
ambient:
  enabled: true
  world: world
  # Same measured windmill entrance as essentials.yml.
  spawnX: 68
  spawnY: 69
  spawnZ: 66
  spawnRadius: 24
  verticalRadius: 8
  timeZone: America/Los_Angeles
# Records only observed arrivals and deaths after activation. The command is
# read-only, on demand, and requires crier.enabled above.
digest:
  enabled: true
  world: world
  timeZone: America/Los_Angeles
# Clear cobblestone outside the windmill, away from its door and altar.
# A nearby arrival can begin one finite, item-barter visit per Pacific date.
merchant:
  enabled: true
  world: world
  anchors:
    - { x: 65, y: 69, z: 66 }
  arrivalRadius: 12
  visitMinutes: 20
  timeZone: America/Los_Angeles
# Every survival world allows random teleport. The first entry is the default
# landing for /rtp, the arrival dialog and the starter compass: frontier is
# where players spend most of their survival time.
worlds:
  - name: frontier
    preset: normal
    rtp: true
  - name: world
    preset: normal
    rtp: true
  - name: map2
    preset: normal
    rtp: true
  - name: skylands
    preset: skylands
    rtp: true
