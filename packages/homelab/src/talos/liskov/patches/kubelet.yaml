# Kubelet node-resource reservations for liskov (CI-only worker, 128 GiB).
#
# Adapted from torvalds' ../patches/kubelet.yaml — read its comments for the
# full mechanism (extraConfig not extraArgs; *ReservedCgroup fields REQUIRED
# alongside enforceNodeAllocatable or kubelet crash-loops) and incident
# history. The CI fork-storm armor ports unchanged because the CI storm is
# exactly the workload moving to this node; only the sizes differ:
#
# - systemReserved.memory 32Gi (torvalds: 40Gi) = 16 ARC + ~16 kernel/OS/slab
#   burst. torvalds measured ZFS dnode/dbuf slab alone peaking at 30.3Gi under
#   a full CI storm + dagger cache rebuild; liskov's pool holds a handful of
#   large cache volumes (not 77 PVCs + snapshots), so its metadata slab should
#   run far smaller. Right-size after a week of Prometheus data — if
#   ZfsArcHitRateLow fires sustained, raise zfs_arc_max and this in lockstep.
# - kubeReserved.memory 4Gi (torvalds: 8Gi): no etcd on a worker; torvalds'
#   /podruntime usage settled ~2.2Gi WITH etcd. Measure
#   /sys/fs/cgroup/podruntime/memory.peak before resizing.
machine:
  kubelet:
    extraConfig:
      systemReserved:
        cpu: "2"
        memory: "32Gi"
      systemReservedCgroup: /system
      kubeReserved:
        cpu: "1"
        memory: "4Gi"
      kubeReservedCgroup: /podruntime
      evictionHard:
        memory.available: "4Gi"
        nodefs.available: "10%"
      evictionSoft:
        memory.available: "8Gi"
        nodefs.available: "15%"
      evictionSoftGracePeriod:
        memory.available: "2m"
        nodefs.available: "2m"
      # CI is the fork-storm workload this cap was designed against (Dagger
      # goroutines 24 -> 1164 in <60s during the 2026-07 freeze investigation).
      # Watch for PIDPressure under real heavy-concurrency load.
      podPidsLimit: 4096
      enforceNodeAllocatable:
        - pods
        - system-reserved
        - kube-reserved
