# Canonical Buildkite pipeline. PR lanes use Buildkite's native `if_changed`;
# main builds start from `.buildkite/main-bootstrap.yml`, whose selector emits
# only the dependency-closed main graph needed for the current changes.
#
# Invariant (scope-creep guard): verify is the only full-root install. Other
# lanes use filtered installs or no install, and validate-pipeline.ts enforces
# that boundary together with step-key pod attribution. Runtime commands use
# `bun --no-install` so a fresh pod cannot trigger Bun's implicit auto-install.

agents:
  queue: default

# Every step runs in the toolchain image baked from .mise.toml
# (.buildkite/ci-image) — same tool versions as every laptop.
# Steps that run repo tasks start with `. .buildkite/scripts/toolchain.sh`
# — a fast no-op on a current image, a runtime mise bootstrap on a stale one.
common:
  - checkout_container: &checkout_container
      name: checkout
      resources:
        # The checkout writes the tracked tree into the memory-backed workspace.
        requests: { cpu: "50m", memory: "1Gi" }
        limits: { cpu: "400m", memory: "2Gi" }
  # Credential entries are anchored individually so each step's command
  # container can declare its exact grant set. The checkout, agent, init, and
  # sidecar containers never reference these anchors.
  - grant_github_download: &grant_github_download
      name: GITHUB_DOWNLOAD_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-github-credentials
          key: GITHUB_DOWNLOAD_TOKEN
  - grant_github_review: &grant_github_review
      name: GITHUB_REVIEW_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-github-credentials
          key: GITHUB_REVIEW_TOKEN
  - grant_github_packages: &grant_github_packages
      name: GITHUB_PACKAGES_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-github-credentials
          key: GITHUB_PACKAGES_TOKEN
  - grant_github_app_id: &grant_github_app_id
      name: GITHUB_APP_ID
      valueFrom:
        secretKeyRef:
          name: buildkite-github-credentials
          key: GITHUB_APP_ID
  - grant_github_app_installation_id: &grant_github_app_installation_id
      name: GITHUB_APP_INSTALLATION_ID
      valueFrom:
        secretKeyRef:
          name: buildkite-github-credentials
          key: GITHUB_APP_INSTALLATION_ID
  - grant_github_app_private_key: &grant_github_app_private_key
      name: GITHUB_APP_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          name: buildkite-github-credentials
          key: GITHUB_APP_PRIVATE_KEY
  - grant_tofu_github: &grant_tofu_github
      name: TOFU_GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-github-credentials
          key: TOFU_GITHUB_TOKEN
  - grant_buildkite_read: &grant_buildkite_read
      name: BUILDKITE_READ_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-api-credentials
          key: BUILDKITE_READ_TOKEN
  - grant_buildkite_admin: &grant_buildkite_admin
      name: BUILDKITE_ADMIN_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-api-credentials
          key: BUILDKITE_ADMIN_TOKEN
  - grant_buildkite_analytics: &grant_buildkite_analytics
      name: BUILDKITE_ANALYTICS_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-analytics-credentials
          key: BUILDKITE_ANALYTICS_TOKEN
  - grant_turbo: &grant_turbo
      name: TURBO_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-turbo-cache-credentials
          key: TURBO_TOKEN
  - grant_npm: &grant_npm
      name: NPM_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-npm-credentials
          key: NPM_TOKEN
  - grant_claude: &grant_claude
      name: CLAUDE_CODE_OAUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-claude-credentials
          key: CLAUDE_CODE_OAUTH_TOKEN
  - grant_chartmuseum_username: &grant_chartmuseum_username
      name: CHARTMUSEUM_USERNAME
      valueFrom:
        secretKeyRef:
          name: buildkite-chartmuseum-credentials
          key: CHARTMUSEUM_USERNAME
  - grant_chartmuseum_password: &grant_chartmuseum_password
      name: CHARTMUSEUM_PASSWORD
      valueFrom:
        secretKeyRef:
          name: buildkite-chartmuseum-credentials
          key: CHARTMUSEUM_PASSWORD
  - grant_argocd: &grant_argocd
      name: ARGOCD_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-argocd-credentials
          key: ARGOCD_AUTH_TOKEN
  - grant_seaweedfs_state_access: &grant_seaweedfs_state_access
      name: SEAWEEDFS_STATE_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: buildkite-seaweedfs-credentials
          key: SEAWEEDFS_STATE_ACCESS_KEY_ID
  - grant_seaweedfs_state_secret: &grant_seaweedfs_state_secret
      name: SEAWEEDFS_STATE_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: buildkite-seaweedfs-credentials
          key: SEAWEEDFS_STATE_SECRET_ACCESS_KEY
  - grant_seaweedfs_deploy_access: &grant_seaweedfs_deploy_access
      name: SEAWEEDFS_DEPLOY_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: buildkite-seaweedfs-credentials
          key: SEAWEEDFS_DEPLOY_ACCESS_KEY_ID
  - grant_seaweedfs_deploy_secret: &grant_seaweedfs_deploy_secret
      name: SEAWEEDFS_DEPLOY_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: buildkite-seaweedfs-credentials
          key: SEAWEEDFS_DEPLOY_SECRET_ACCESS_KEY
  - grant_cloudflare_account: &grant_cloudflare_account
      name: CLOUDFLARE_ACCOUNT_ID
      valueFrom:
        secretKeyRef:
          name: buildkite-cloudflare-credentials
          key: CLOUDFLARE_ACCOUNT_ID
  - grant_cloudflare_token: &grant_cloudflare_token
      name: CLOUDFLARE_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: buildkite-cloudflare-credentials
          key: CLOUDFLARE_API_TOKEN
  - grant_tailscale_client_id: &grant_tailscale_client_id
      name: TAILSCALE_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: buildkite-tailscale-credentials
          key: TAILSCALE_OAUTH_CLIENT_ID
  - grant_tailscale_client_secret: &grant_tailscale_client_secret
      name: TAILSCALE_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: buildkite-tailscale-credentials
          key: TAILSCALE_OAUTH_CLIENT_SECRET
  - grant_arr_radarr: &grant_arr_radarr
      name: RADARR_API_KEY
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: RADARR_API_KEY
  - grant_arr_sonarr: &grant_arr_sonarr
      name: SONARR_API_KEY
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: SONARR_API_KEY
  - grant_arr_prowlarr: &grant_arr_prowlarr
      name: PROWLARR_API_KEY
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: PROWLARR_API_KEY
  - grant_arr_qbittorrent: &grant_arr_qbittorrent
      name: QBITTORRENT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: QBITTORRENT_PASSWORD
  - grant_arr_privatehd_password: &grant_arr_privatehd_password
      name: PRIVATEHD_PASSWORD
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: PRIVATEHD_PASSWORD
  - grant_arr_privatehd_pid: &grant_arr_privatehd_pid
      name: PRIVATEHD_PID
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: PRIVATEHD_PID
  - grant_arr_avistaz_password: &grant_arr_avistaz_password
      name: AVISTAZ_PASSWORD
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: AVISTAZ_PASSWORD
  - grant_arr_avistaz_pid: &grant_arr_avistaz_pid
      name: AVISTAZ_PID
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: AVISTAZ_PID
  - grant_arr_animez_password: &grant_arr_animez_password
      name: ANIMEZ_PASSWORD
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: ANIMEZ_PASSWORD
  - grant_arr_animez_pid: &grant_arr_animez_pid
      name: ANIMEZ_PID
      valueFrom:
        secretKeyRef:
          name: buildkite-arr-credentials
          key: ANIMEZ_PID
  - pod: &pod
      kubernetes: &pod_kubernetes
        checkout:
          # Full clone: turbo --affected needs the merge-base with main.
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_pod_spec
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          containers:
            - *checkout_container
            - &pod_container
              name: container-0
              image: "${CI_BASE_IMAGE}"
              # upload-pipeline.sh expands the validated committed digest.
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                # kubernetes-bootstrap runs step commands via /bin/sh by
                # default — dash on the debian ci-base, which rejects
                # toolchain.sh's `set -o pipefail` (build 5651).
                - &env_buildkite_shell
                  name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                # Requests sized to measured p90 usage plus the post-checkout
                # memory-backed workspace. The checkout's ~1Gi tmpfs charge now
                # has an explicit request on the generated checkout container.
                # Limits stay high so a cold-cache burst still gets real CPU.
                # ephemeral-storage limit caps the pod's writable layer +
                # non-workspace emptyDirs on the Talos xfs /var so a runaway
                # build is evicted rather than filling the system disk and
                # wedging the node (the 2026-07 freeze failure mode).
                requests: { cpu: "1", memory: "2Gi", ephemeral-storage: "2Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "40Gi" }
              volumeMounts:
                # Checkouts are mirror-backed (default-checkout-params.gitMirrors):
                # .git/objects/info/alternates points into this volume, so every
                # container that runs git (turbo hashing, go VCS stamping —
                # build 5694) needs the mirror mounted, not just the checkout
                # container. The agent stack adds the pod-level volume.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
  - pod_buildkit: &pod_buildkit
      # Image solves use the remote BuildKit service. This remains a separate
      # anchor because it has a larger memory limit than ordinary CI steps, but
      # it has no privileged Docker daemon sidecar.
      kubernetes: &pod_buildkit_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_buildkit_pod_spec
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          containers:
            - *checkout_container
            - &pod_buildkit_container
              name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                # Same dash-vs-bash guard as the base pod above (build 5651).
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                # Measured p90 plus the post-checkout tmpfs workspace (filtered
                # install ~1Gi for the image and native-sidecar E2E lanes.
                requests: { cpu: "1", memory: "1Gi", ephemeral-storage: "2Gi" }
                limits: { cpu: "7", memory: "14Gi", ephemeral-storage: "40Gi" }
              volumeMounts:
                # Checkouts are mirror-backed (default-checkout-params.gitMirrors):
                # .git/objects/info/alternates points into this volume, so every
                # container that runs git (turbo hashing, go VCS stamping —
                # build 5694) needs the mirror mounted, not just the checkout
                # container. The agent stack adds the pod-level volume.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
  # Verify's pod uses the larger memory request needed by its full install.
  # Build 8944 measured 9.42Gi of tmpfs plus 11.59Gi of anonymous memory while
  # six cold tasks overlapped and hit the old 20Gi limit. Four-way graph
  # concurrency plus an 18Gi reservation and 24Gi burst limit preserves every
  # check without allowing several cold verify pods to overcommit the 80Gi
  # Buildkite quota. It has no DinD sidecar; image work uses remote BuildKit.
  # Only verify pays this; other lanes use their measured complete-pod sizing.
  - pod_verify: &pod_verify
      kubernetes: &pod_verify_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_verify_pod_spec
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          containers:
            - *checkout_container
            - &pod_verify_container
              name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                # Same dash-vs-bash guard as the base pod above (build 5651).
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                requests: { cpu: "1", memory: "18Gi", ephemeral-storage: "2Gi" }
                limits: { cpu: "7", memory: "24Gi", ephemeral-storage: "40Gi" }
              volumeMounts:
                # Mirror-backed checkouts: see the base pod anchor above.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
  # Light steps: thin deploy/publish/annotate scripts whose work is seconds
  # even on a cold cache. Small REQUESTS so the scheduler places them
  # alongside the long images job (build 5644: light steps sat runnable
  # 3-66 min behind it under the old quota); limits stay high so a cold-cache burst
  # still gets real CPU. Steps that do heavy work when cold (verify, e2e,
  # images, site builds' turbo graph) keep the full-size pod.
  - pod_light: &pod_light
      kubernetes: &pod_light_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_light_pod_spec
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          containers:
            - *checkout_container
            - &pod_light_container
              name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                # The checkout container requests its own 1Gi tmpfs charge;
                # 512Mi covers these thin command containers.
                requests:
                  { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                # Checkouts are mirror-backed (default-checkout-params.gitMirrors):
                # .git/objects/info/alternates points into this volume, so every
                # container that runs git (turbo hashing, go VCS stamping —
                # build 5694) needs the mirror mounted, not just the checkout
                # container. The agent stack adds the pod-level volume.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
  # The Codex fallback authenticates with its refreshable ChatGPT auth bundle,
  # never an extracted access token. This private claim is absent from the
  # default agent-stack pod volumes and appears only in this main-only lane.
  - pod_release_codex_auth: &pod_release_codex_auth
      kubernetes: &pod_release_codex_auth_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_release_codex_auth_pod_spec
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          volumes:
            - name: buildkite-codex-auth
              persistentVolumeClaim:
                claimName: buildkite-codex-auth
          containers:
            - *checkout_container
            - &pod_release_codex_auth_container
              name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
                - name: CODEX_HOME
                  value: /buildkite/codex-auth
              resources:
                requests:
                  { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
                - name: buildkite-codex-auth
                  mountPath: /buildkite/codex-auth
  # OpenTofu's provider cache is shared across the selected CI jobs on Liskov.
  # Those commands use `flock` around Terraform itself: OpenTofu explicitly
  # does not guarantee concurrent writes to TF_PLUGIN_CACHE_DIR are safe.
  - pod_tofu: &pod_tofu
      kubernetes: &pod_tofu_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_tofu_pod_spec
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          volumes:
            - name: buildkite-tofu-plugin-cache
              persistentVolumeClaim:
                claimName: buildkite-tofu-plugin-cache
          containers:
            - *checkout_container
            - &pod_tofu_container
              name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                requests:
                  { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
                - name: buildkite-tofu-plugin-cache
                  mountPath: /buildkite/tofu-plugin-cache
  # Untrusted PR validation must not receive PostHog credentials or the shared
  # CI secret. It only runs backend-free OpenTofu validation with a
  # non-sensitive encryption placeholder.
  - pod_posthog_tofu: &pod_posthog_tofu
      kubernetes: &pod_posthog_tofu_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch:
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          volumes:
            - name: buildkite-tofu-plugin-cache
              persistentVolumeClaim:
                claimName: buildkite-tofu-plugin-cache
          containers:
            - *checkout_container
            - name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
                - *grant_github_download
              resources:
                requests:
                  { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
                - name: buildkite-tofu-plugin-cache
                  mountPath: /buildkite/tofu-plugin-cache
  # Main-only PostHog plan/apply runs trusted code after release admission.
  # Keep every credential explicit so unrelated fields cannot enter the pod.
  - pod_posthog_tofu_apply: &pod_posthog_tofu_apply
      kubernetes: &pod_posthog_tofu_apply_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch:
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          volumes:
            - name: buildkite-tofu-plugin-cache
              persistentVolumeClaim:
                claimName: buildkite-tofu-plugin-cache
          containers:
            - *checkout_container
            - name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
                - *grant_github_download
                - name: SEAWEEDFS_STATE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: buildkite-seaweedfs-credentials
                      key: SEAWEEDFS_STATE_ACCESS_KEY_ID
                - name: SEAWEEDFS_STATE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: buildkite-seaweedfs-credentials
                      key: SEAWEEDFS_STATE_SECRET_ACCESS_KEY
                - name: POSTHOG_CLI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: posthog-tofu-credentials
                      key: POSTHOG_API_KEY
                - name: POSTHOG_TOFU_STATE_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: posthog-tofu-credentials
                      key: POSTHOG_TOFU_STATE_PASSPHRASE
              resources:
                requests:
                  { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
                - name: buildkite-tofu-plugin-cache
                  mountPath: /buildkite/tofu-plugin-cache
  # The combined PR deploy rehearsal needs the OpenTofu provider cache but its
  # measured command-container working set is higher than the light Tofu lanes.
  # The combined PR deploy rehearsal has a larger measured command-container
  # working set than the light lanes.
  - pod_pr_dryrun: &pod_pr_dryrun
      kubernetes: &pod_pr_dryrun_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_pr_dryrun_pod_spec
          serviceAccountName: buildkite-job
          automountServiceAccountToken: false
          containers:
            - *checkout_container
            - &pod_pr_dryrun_container
              name: container-0
              image: "${CI_BASE_IMAGE}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                requests:
                  { cpu: "250m", memory: "768Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
  - retry: &retry
      automatic:
        # Transient infra failures only; logical failures (1, 3) never retry.
        # 34 is the script-declared transient code: CI scripts that talk to
        # external services classify failures via scripts/lib/transient.ts and
        # exit 34 when the error matches a known transient signature
        # (5xx, network, GitHub GraphQL 500), so only retryable failures retry.
        - exit_status: 255
          limit: 2
        - exit_status: 34
          limit: 2
        - exit_status: -1
          limit: 2

env:
  # New pipelines use a coordinated subdirectory. Once the matching agent-stack
  # change removes its legacy PodSpec-level cache override, older branch
  # pipelines fall back to per-pod ephemeral caching instead of writing to the
  # shared cache without taking its lock.
  BUN_INSTALL_CACHE_DIR: /buildkite/bun-cache/data
  BUN_CACHE_LOCK_FILE: /buildkite/bun-cache-control/.gc.lock
  TURBO_SCM_BASE: "origin/main"
  TURBO_TELEMETRY_DISABLED: "1"
  # Remote cache (ducktors/turborepo-remote-cache on its local ZFS PVC). CI pods run
  # in-cluster, so they hit the Service directly instead of the Tailscale
  # ingress developer machines use. Steps that run Turbo receive TURBO_TOKEN
  # through an explicit grant on their command container.
  TURBO_API: "http://turbo-cache-turbo-cache-service.turbo-cache.svc.cluster.local:3000"
  TURBO_TEAM: "monorepo"

steps:
  # ── Release-please PR auto-skip ──────────────────────────────────────────
  # Webhook builds of release-please's own PR (branch
  # release-please--branches--main) are no-op version bumps; every step
  # carries the guard below so the build uploads zero jobs instead of burning
  # the full pipeline (the old generator's shouldSkipReleasePleasePrBuild,
  # restored). Deliberately narrow: only build.source == "webhook" skips — a
  # manual New Build (ui/api/schedule/trigger_job) runs full CI, and
  # RUN_RELEASE_CI=true forces a run regardless. The empty build still passes
  # (the pipeline-upload step always runs), so the aggregate
  # buildkite/monorepo/pr required status goes green and the release PR stays
  # mergeable. The guard is AND-ed with each step's own condition:
  #   build.branch != "release-please--branches--main"
  #     || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true"

  # ── Verify: the whole task graph + every repo check ──────────────────────
  # PRs and main both run the exhaustive root graph. Local hooks are
  # changed-file-only; CI is the full-repository correctness backstop, with
  # sjer.red and resume covered by their dedicated lanes below.
  # The turbo run summary is annotated onto the build either way, without
  # masking verify's exit code.
  - label: ":turborepo: verify"
    key: verify
    timeout_in_minutes: 30
    if: (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun --no-install .buildkite/scripts/validate-pipeline.ts
      .buildkite/scripts/bun-install.sh --frozen-lockfile
      # CI is the cross-machine cache producer/consumer. Developer shells use
      # local-only caching by default to avoid large transfers on weak Wi-Fi.
      export TURBO_CACHE="local:rw,remote:rw"
      set +e
      bun --no-install run verify -- --filter='!sjer.red' --filter='!@shepherdjerred/resume' --concurrency=4 --output-logs=errors-only --summarize
      verify_status=$?
      set -e
      set +e
      bun --no-install scripts/annotate-turbo-summary.ts
      annotation_status=$?
      bun --no-install scripts/write-ci-report-index.ts
      reporting_status=$?
      bun --no-install scripts/write-coverage-summary.ts --allow-partial
      coverage_status=$?
      set -e
      if [ "$$verify_status" -eq 0 ]; then
        bun --no-install packages/homelab/src/cdk8s/scripts/generate-caddyfile.ts caddyfile.generated
      fi
      if [ "$$verify_status" -eq 0 ] && [ "$$annotation_status" -ne 0 ]; then
        exit "$$annotation_status"
      fi
      if [ "$$verify_status" -eq 0 ] && [ "$$reporting_status" -ne 0 ]; then
        exit "$$reporting_status"
      fi
      if [ "$$verify_status" -eq 0 ] && [ "$$coverage_status" -ne 0 ]; then
        exit "$$coverage_status"
      fi
      exit "$$verify_status"
    artifact_paths:
      - ".ci-reports/**/*"
      - "caddyfile.generated"
      - "packages/homelab/src/cdk8s/dist/**/*"
      - "packages/homelab/src/cdk8s/dist/*"
    retry: *retry
    plugins:
      - test-collector#v1.11.0:
          files: ".ci-reports/junit/**/*.xml"
          format: junit
          missing-error: 0 # selector skips are reportless; executed runs validate above
          upload-concurrency: 8
          tags:
            - "scope=partial"
            - "pipeline=monorepo"
      - kubernetes:
          <<: *pod_verify_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: verify
          podSpecPatch:
            <<: *pod_verify_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_verify_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_turbo
                  - *grant_buildkite_analytics

