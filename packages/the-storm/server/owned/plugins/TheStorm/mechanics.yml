# Level III
signCopier: # punch a sign with the tool to copy it, right-click one to paste
  unlock: { enabled: true, level: 3 }
  tool: minecraft:feather

mapChanger: # [Map] with a map id range such as 12-15 on the third line
  access: { enabled: true, level: 3, useLevel: 3 }
  maxRange: 64

paintingSwitcher: # right-click a painting for the next picture of its size
  unlock: { enabled: true, level: 3 }

# Levels IV and V: signs touching a piston
pistons:
  crush: { enabled: true, level: 4 } # [Crush]: breaks the block in front
  bounce: { enabled: true, level: 4 } # [Bounce]: launches entities
  superSticky: { enabled: true, level: 5 } # [SuperSticky]: pulls a line in
  superPush: { enabled: true, level: 5 } # [SuperPush]: pushes further
  bounceForce: 1.5
  stickyReach: 8
  pushDistance: 4
  maxBlocks: 12
  # Never crushed or moved. Block entities (chests, spawners, vaults, signs)
  # and unbreakable blocks are always refused as well.
  blacklist:
    - minecraft:bedrock
    - minecraft:obsidian
    - minecraft:crying_obsidian
    - minecraft:reinforced_deepslate
    - minecraft:end_portal_frame
    - minecraft:end_portal
    - minecraft:end_gateway
    - minecraft:nether_portal
    - minecraft:respawn_anchor
    - minecraft:barrier
    - minecraft:spawner
    - minecraft:trial_spawner
    - minecraft:vault
    - minecraft:budding_amethyst
