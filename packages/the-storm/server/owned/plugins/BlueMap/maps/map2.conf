# BlueMap map for Main Map 2. Owned by the repository: plugins/BlueMap/maps is an
# owned root, so the image replaces this file on every boot and removes maps
# it does not ship. Keys and defaults follow BlueMap's generated map.conf.
# Converted 1.8 chunks carry present but zeroed light data: render them
# without waiting for light, fully ambient-lit.
world: "world"
dimension: "minecraft:map2"
name: "Main Map 2"
sorting: 2
start-pos: { x: 0, z: 0 }
sky-color: "#7dabff"
void-color: "#000000"
sky-light: 1
ambient-light: 1
remove-caves-below-y: 55
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
# Matches the circular border in plugins/TheStorm/world.yml. BlueMap deletes
# tiles outside a changed mask.
render-mask: [
  { type: circle, center-x: 0, center-z: 0, radius: 12000 }
]
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: true
marker-sets: {}
