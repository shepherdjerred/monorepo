<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glitter Graph</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #chart {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .link {
        stroke: #999;
        stroke-opacity: 0.55;
      }
      .link.bi {
        stroke: #5a6dba;
        stroke-opacity: 0.7;
      }
      .link-label {
        font-size: 10px;
        fill: #555;
        pointer-events: none;
        paint-order: stroke;
        stroke: #fafafa;
        stroke-width: 3px;
      }
      .node circle {
        stroke: #fff;
        stroke-width: 1.5px;
        cursor: grab;
      }
      .node.group circle {
        stroke: #333;
        stroke-width: 2px;
      }
      .node text {
        font-size: 12px;
        pointer-events: none;
        paint-order: stroke;
        stroke: #fafafa;
        stroke-width: 3px;
        fill: #222;
      }
      .node.group text {
        font-weight: 600;
      }
      .controls {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        z-index: 10;
        max-width: 280px;
      }
      .controls label {
        display: block;
        margin: 4px 0;
      }
      .controls input[type="range"] {
        width: 140px;
        vertical-align: middle;
      }
      .legend-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <strong>Glitter</strong>
      <div style="margin-top: 6px">
        <span
          class="legend-dot"
          style="background: #f4c542; border: 2px solid #333"
        ></span
        >group
        <span
          class="legend-dot"
          style="background: #4a90e2; margin-left: 10px"
        ></span
        >person
      </div>
      <label
        >charge
        <input id="charge" type="range" min="-1200" max="-50" value="-350"
      /></label>
      <label
        >link distance
        <input id="dist" type="range" min="20" max="200" value="70"
      /></label>
      <label><input id="labels" type="checkbox" checked /> edge labels</label>
      <div style="color: #888; font-size: 11px; margin-top: 6px">
        drag nodes • scroll to zoom
      </div>
    </div>
    <svg id="chart"></svg>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="./context-data.js"></script>
    <script>
      const context = globalThis.GLITTER_CONTEXT;
      if (context === undefined) {
        throw new Error("Glitter context data did not load");
      }

      const nodes = context.people.map((person) => ({
        id: person.id,
        label: person.displayName,
        group: person.kind === "group",
      }));
      const links = context.relationships.map((relationship) => ({
        source: relationship.sourceId,
        target: relationship.targetId,
        label: relationship.label,
        bidir: relationship.direction === "undirected",
      }));

      const svg = d3.select("#chart");
      const width = window.innerWidth;
      const height = window.innerHeight;
      svg.attr("viewBox", [0, 0, width, height]);

      const container = svg.append("g");

      svg.call(
        d3
          .zoom()
          .scaleExtent([0.2, 4])
          .on("zoom", (e) => container.attr("transform", e.transform)),
      );

      svg
        .append("defs")
        .append("marker")
        .attr("id", "arrow")
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 18)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", "#999");

      const sim = d3
        .forceSimulation(nodes)
        .force(
          "link",
          d3
            .forceLink(links)
            .id((d) => d.id)
            .distance(70)
            .strength(0.7),
        )
        .force("charge", d3.forceManyBody().strength(-350))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force(
          "collide",
          d3.forceCollide().radius((d) => (d.group ? 38 : 22)),
        );

      const link = container
        .append("g")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("class", (d) => "link" + (d.bidir ? " bi" : ""))
        .attr("stroke-width", 1.4)
        .attr("marker-end", (d) => (d.bidir ? null : "url(#arrow)"));

      const linkLabel = container
        .append("g")
        .selectAll("text")
        .data(links.filter((d) => d.label))
        .join("text")
        .attr("class", "link-label")
        .attr("text-anchor", "middle")
        .text((d) => d.label);

      const node = container
        .append("g")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", (d) => "node" + (d.group ? " group" : ""))
        .call(
          d3
            .drag()
            .on("start", (e, d) => {
              if (!e.active) sim.alphaTarget(0.3).restart();
              d.fx = d.x;
              d.fy = d.y;
            })
            .on("drag", (e, d) => {
              d.fx = e.x;
              d.fy = e.y;
            })
            .on("end", (e, d) => {
              if (!e.active) sim.alphaTarget(0);
              d.fx = null;
              d.fy = null;
            }),
        );

      node
        .append("circle")
        .attr("r", (d) => (d.group ? 14 : 7))
        .attr("fill", (d) => (d.group ? "#f4c542" : "#4a90e2"));

      node
        .append("text")
        .attr("x", (d) => (d.group ? 18 : 10))
        .attr("y", 4)
        .text((d) => d.label);

      sim.on("tick", () => {
        link
          .attr("x1", (d) => d.source.x)
          .attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x)
          .attr("y2", (d) => d.target.y);
        linkLabel
          .attr("x", (d) => (d.source.x + d.target.x) / 2)
          .attr("y", (d) => (d.source.y + d.target.y) / 2);
        node.attr("transform", (d) => `translate(${d.x},${d.y})`);
      });

      d3.select("#charge").on("input", function () {
        sim.force("charge").strength(+this.value);
        sim.alpha(0.6).restart();
      });
      d3.select("#dist").on("input", function () {
        sim.force("link").distance(+this.value);
        sim.alpha(0.6).restart();
      });
      d3.select("#labels").on("change", function () {
        linkLabel.style("display", this.checked ? null : "none");
      });

      window.addEventListener("resize", () => {
        const w = window.innerWidth,
          h = window.innerHeight;
        svg.attr("viewBox", [0, 0, w, h]);
        sim
          .force("center", d3.forceCenter(w / 2, h / 2))
          .alpha(0.3)
          .restart();
      });
    </script>
  </body>
</html>
