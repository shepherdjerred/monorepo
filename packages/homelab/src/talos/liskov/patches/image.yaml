# liskov machine identity: install target, hostname, CI-only taint, ZFS tuning.
machine:
  install:
    # https://factory.talos.dev/ — schematic source: ../image.yaml (SecureBoot,
    # amd-ucode). The schematic hash + digest are kept in sync by
    # src/talos/update-image-id.ts (`bun run check:talos` fails on drift);
    # Renovate tracks the trailing :vX.Y.Z (regex manager in renovate.json).
    image: factory.talos.dev/metal-installer-secureboot/d953d04c966642907c1061252288cdc30189c2973f083de93355faac1e9d54cb:v1.14.2@sha256:92ab950ac3166567f3600cc2f56ac3b758c2649c4d8a8100248c7e31ad000bb2
    # Select the install disk by serial, never by /dev path (torvalds lesson:
    # identical NVMes get nvme0n1/nvme1n1 assigned randomly per boot, and with
    # wipe:true a path selector can destroy the data disk). liskov: the 990 Pro
    # 1TB is the OS disk; the 990 Pro 2TB holds the zfspv-pool-nvme CI cache
    # pool and must NEVER match this selector.
    #
    # Placeholder until first boot — read the real serial in maintenance mode:
    #   talosctl -n <maintenance-ip> disks --insecure
    # An unmatched selector fails the install; it cannot wipe the wrong disk.
    diskSelector:
      serial: S7LANL0L414099Z
    wipe: true
  sysfs:
    # ZFS ARC for the CI cache pool (2TB 990 Pro, zfspv-pool-nvme): same
    # 16 GiB cap / 8 GiB floor as torvalds — must stay BELOW the kubelet
    # systemReserved.memory (patches/kubelet.yaml) so ARC + pod allocatable
    # can never oversubscribe physical RAM (the torvalds CI-freeze lesson).
    module.zfs.parameters.zfs_arc_max: "17179869184"
    module.zfs.parameters.zfs_arc_min: "8589934592"
    # Compressed ARC: effectively more cache per reserved byte.
    module.zfs.parameters.zfs_compressed_arc_enabled: "1"
  kernel:
    modules:
      - name: zfs
        # Module-load parameters: zfs_dirty_data_max_max is read only when the
        # module loads, so it cannot be set through sysfs like the ARC caps.
        #
        # The CI pool (sync=disabled, every dataset disposable) takes ~5 TB/day
        # of writes while workspace peaks sum to ~3 TB/day: the rest is
        # scratch that is written, then deleted seconds later. The defaults
        # (4 GiB dirty budget, 20% sync trigger, 5 s txg timeout) flush it
        # anyway. An 8 GiB budget and a 30 s timeout let that scratch die in
        # RAM; a crash loses only the last seconds of disposable CI writes,
        # which sync=disabled already accepts. Dirty data is counted inside
        # the ARC, so this stays under the 16 GiB zfs_arc_max below and adds
        # nothing to the kubelet's 24Gi systemReserved budget; the trade is
        # less cached data (ARC hit ratio was 98.8% before the change, and
        # ZfsArcHitRateLow is the canary). Per-workflow dataset create/destroy
        # still forces early txg commits, so the timeout is a ceiling, not a
        # guarantee. Changing these needs a node reboot (CI-only outage).
        parameters:
          - zfs_dirty_data_max_max=8589934592 # 8 GiB; enforced only at load
          - zfs_dirty_data_max=8589934592 # 8 GiB (default: RAM/10 capped at 4 GiB)
          - zfs_txg_timeout=30 # seconds (default 5)

---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: liskov
auto: off
