# Static Buildkite pipeline — no generator. PR lanes use Buildkite's native
# `if_changed`; main lanes use the fail-open, dependency-free ci-changed.ts
# selector against the last green main commit before installing dependencies.
#
# Invariant (scope-creep guard): verify is the only full-root install. Other
# lanes use filtered installs or no install, and validate-pipeline.ts enforces
# that boundary together with step-key pod attribution. Runtime commands use
# `bun --no-install` so a fresh pod cannot trigger Bun's implicit auto-install.

agents:
  queue: default

# Every step runs in the toolchain image baked from .mise.toml
# (.buildkite/ci-image) — same tool versions as every laptop.
# Steps that run repo tasks start with `. .buildkite/scripts/toolchain.sh`
# — a fast no-op on a current image, a runtime mise bootstrap on a stale one.
common:
  - checkout_container: &checkout_container
      name: checkout
      resources:
        # The checkout writes the tracked tree into the memory-backed workspace.
        requests: { cpu: "50m", memory: "1Gi" }
        limits: { cpu: "400m", memory: "2Gi" }
  - pod: &pod
      kubernetes: &pod_kubernetes
        checkout:
          # Full clone: turbo --affected needs the merge-base with main.
          cloneFlags: "--no-tags"
        podSpecPatch:
          serviceAccountName: buildkite-agent-stack-k8s-controller
          containers:
            - *checkout_container
            - name: container-0
              image: "ghcr.io/shepherdjerred/ci-base:latest"
              # :latest is mutable and the ci-image refresh step repushes it;
              # the k8s default IfNotPresent pinned pods to a stale node-cached
              # image (build 5648: release step lacked the claude CLI baked
              # into the current image).
              imagePullPolicy: Always
              env:
                # kubernetes-bootstrap runs step commands via /bin/sh by
                # default — dash on the debian ci-base, which rejects
                # toolchain.sh's `set -o pipefail` (build 5651).
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                # Requests sized to measured p90 usage plus the post-checkout
                # memory-backed workspace. The checkout's ~1Gi tmpfs charge now
                # has an explicit request on the generated checkout container.
                # Limits stay high so a cold-cache burst still gets real CPU.
                # ephemeral-storage limit caps the pod's writable layer +
                # non-workspace emptyDirs on the Talos xfs /var so a runaway
                # build is evicted rather than filling the system disk and
                # wedging the node (the 2026-07 freeze failure mode).
                requests: { cpu: "1", memory: "2Gi", ephemeral-storage: "2Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "40Gi" }
              volumeMounts:
                # Checkouts are mirror-backed (default-checkout-params.gitMirrors):
                # .git/objects/info/alternates points into this volume, so every
                # container that runs git (turbo hashing, go VCS stamping —
                # build 5694) needs the mirror mounted, not just the checkout
                # container. The agent stack adds the pod-level volume.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
              envFrom:
                - secretRef: { name: buildkite-ci-secrets }
  - pod_buildkit: &pod_buildkit
      # Image solves use the remote BuildKit service. This remains a separate
      # anchor because it has a larger memory limit than ordinary CI steps, but
      # it has no privileged Docker daemon sidecar.
      kubernetes: &pod_buildkit_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch: &pod_buildkit_pod_spec
          serviceAccountName: buildkite-agent-stack-k8s-controller
          containers:
            - *checkout_container
            - name: container-0
              image: "ghcr.io/shepherdjerred/ci-base:latest"
              # Same stale-:latest guard as the base pod above.
              imagePullPolicy: Always
              env:
                # Same dash-vs-bash guard as the base pod above (build 5651).
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                # Measured p90 plus the post-checkout tmpfs workspace (filtered
                # install ~1Gi for the image and native-sidecar E2E lanes.
                requests: { cpu: "1", memory: "2Gi", ephemeral-storage: "2Gi" }
                limits: { cpu: "7", memory: "14Gi", ephemeral-storage: "40Gi" }
              volumeMounts:
                # Checkouts are mirror-backed (default-checkout-params.gitMirrors):
                # .git/objects/info/alternates points into this volume, so every
                # container that runs git (turbo hashing, go VCS stamping —
                # build 5694) needs the mirror mounted, not just the checkout
                # container. The agent stack adds the pod-level volume.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
              envFrom:
                - secretRef: { name: buildkite-ci-secrets }
  # Verify's pod uses the larger memory request needed by its full install.
  # full-root install + turbo scratch put ~6Gi into the memory-backed workspace
  # (node_modules 3.75Gi alone). Recent main builds reached the old 14Gi limit,
  # so retain the measured request and burst margin from main. It has no DinD
  # sidecar; image work uses remote BuildKit instead.
  # Only verify pays this; the other privileged lanes stay at 2Gi.
  - pod_verify: &pod_verify
      kubernetes: &pod_verify_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch:
          serviceAccountName: buildkite-agent-stack-k8s-controller
          containers:
            - *checkout_container
            - name: container-0
              image: "ghcr.io/shepherdjerred/ci-base:latest"
              # Same stale-:latest guard as the base pod above.
              imagePullPolicy: Always
              env:
                # Same dash-vs-bash guard as the base pod above (build 5651).
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                requests: { cpu: "1", memory: "14Gi", ephemeral-storage: "2Gi" }
                limits: { cpu: "7", memory: "20Gi", ephemeral-storage: "40Gi" }
              volumeMounts:
                # Mirror-backed checkouts: see the base pod anchor above.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
              envFrom:
                - secretRef: { name: buildkite-ci-secrets }
  # Light steps: thin deploy/publish/annotate scripts whose work is seconds
  # even on a cold cache. Small REQUESTS so the scheduler places them
  # alongside the long images job (build 5644: light steps sat runnable
  # 3-66 min behind it under the old quota); limits stay high so a cold-cache burst
  # still gets real CPU. Steps that do heavy work when cold (verify, e2e,
  # images, site builds' turbo graph) keep the full-size pod.
  - pod_light: &pod_light
      kubernetes: &pod_light_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch:
          serviceAccountName: buildkite-agent-stack-k8s-controller
          containers:
            - *checkout_container
            - name: container-0
              image: "ghcr.io/shepherdjerred/ci-base:latest"
              imagePullPolicy: Always
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                # The checkout container requests its own 1Gi tmpfs charge;
                # 512Mi covers these thin command containers.
                requests:
                  { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                # Checkouts are mirror-backed (default-checkout-params.gitMirrors):
                # .git/objects/info/alternates points into this volume, so every
                # container that runs git (turbo hashing, go VCS stamping —
                # build 5694) needs the mirror mounted, not just the checkout
                # container. The agent stack adds the pod-level volume.
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
              envFrom:
                - secretRef: { name: buildkite-ci-secrets }
  # OpenTofu's provider cache is shared across the selected CI jobs on Liskov.
  # Those commands use `flock` around Terraform itself: OpenTofu explicitly
  # does not guarantee concurrent writes to TF_PLUGIN_CACHE_DIR are safe.
  - pod_tofu: &pod_tofu
      kubernetes: &pod_tofu_kubernetes
        checkout:
          cloneFlags: "--no-tags"
        podSpecPatch:
          serviceAccountName: buildkite-agent-stack-k8s-controller
          volumes:
            - name: buildkite-tofu-plugin-cache
              persistentVolumeClaim:
                claimName: buildkite-tofu-plugin-cache
          containers:
            - *checkout_container
            - name: container-0
              image: "ghcr.io/shepherdjerred/ci-base:latest"
              imagePullPolicy: Always
              env:
                - name: BUILDKITE_SHELL
                  value: "/bin/bash -e -c"
              resources:
                requests:
                  { cpu: "250m", memory: "512Mi", ephemeral-storage: "1Gi" }
                limits: { cpu: "7", memory: "12Gi", ephemeral-storage: "20Gi" }
              volumeMounts:
                - name: buildkite-git-mirrors
                  mountPath: /buildkite/git-mirrors
                  readOnly: true
                - name: buildkite-tofu-plugin-cache
                  mountPath: /buildkite/tofu-plugin-cache
              envFrom:
                - secretRef: { name: buildkite-ci-secrets }
  - retry: &retry
      automatic:
        # Transient infra failures only; logical failures (1, 3) never retry.
        # 34 is the script-declared transient code: CI scripts that talk to
        # external services classify failures via scripts/lib/transient.ts and
        # exit 34 when the error matches a known transient signature
        # (5xx, network, GitHub GraphQL 500), so only retryable failures retry.
        - exit_status: 255
          limit: 2
        - exit_status: 34
          limit: 2
        - exit_status: -1
          limit: 2

env:
  TURBO_SCM_BASE: "origin/main"
  TURBO_TELEMETRY_DISABLED: "1"
  # Remote cache (ducktors/turborepo-remote-cache, R2-backed). CI pods run
  # in-cluster, so they hit the Service directly instead of the Tailscale
  # ingress developer machines use. TURBO_TOKEN comes from the
  # buildkite-ci-secrets envFrom; turbo leaves remote caching disabled until
  # all three of API/TEAM/TOKEN are present, so a missing token degrades to
  # local-cache-only rather than failing the build.
  TURBO_API: "http://turbo-cache-turbo-cache-service.turbo-cache.svc.cluster.local:3000"
  TURBO_TEAM: "monorepo"

steps:
  # ── Release-please PR auto-skip ──────────────────────────────────────────
  # Webhook builds of release-please's own PR (branch
  # release-please--branches--main) are no-op version bumps; every step
  # carries the guard below so the build uploads zero jobs instead of burning
  # the full pipeline (the old generator's shouldSkipReleasePleasePrBuild,
  # restored). Deliberately narrow: only build.source == "webhook" skips — a
  # manual New Build (ui/api/schedule/trigger_job) runs full CI, and
  # RUN_RELEASE_CI=true forces a run regardless. The empty build still passes
  # (the pipeline-upload step always runs), so the aggregate
  # buildkite/monorepo/pr required status goes green and the release PR stays
  # mergeable. The guard is AND-ed with each step's own condition:
  #   build.branch != "release-please--branches--main"
  #     || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true"

  # Resolve the last green main commit once in a small toolchain pod. Main
  # lanes consume the result through Buildkite metadata before they start any
  # install or heavyweight runtime image. A lookup failure is intentionally a
  # soft failure: the consumers then fail open and run instead of skipping.
  - label: ":mag_right: select main CI work"
    key: ci-selector-base
    if: build.branch == pipeline.default_branch
    soft_fail: true
    timeout_in_minutes: 2
    command: bun --no-install .buildkite/scripts/prepare-ci-changed-base.ts
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: ci-selector-base

  # ── Verify: the whole task graph + every repo check ──────────────────────
  # PRs run affected-scoped; main re-verifies EVERYTHING (cheap via cache).
  # The turbo run summary is annotated onto the build either way, without
  # masking verify's exit code.
  - label: ":turborepo: verify"
    key: verify
    if: (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    depends_on: ci-selector-base
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun --no-install .buildkite/scripts/validate-pipeline.ts
      bun install --frozen-lockfile
      # CI is the cross-machine cache producer/consumer. Developer shells use
      # local-only caching by default to avoid large transfers on weak Wi-Fi.
      export TURBO_CACHE="local:rw,remote:rw"
      if [ "$BUILDKITE_BRANCH" = "main" ]; then SCOPE=""; else SCOPE="--affected"; fi
      set +e
      bun --no-install run verify -- $$SCOPE --filter='!sjer.red' --filter='!@shepherdjerred/resume' --concurrency=6 --output-logs=errors-only --summarize
      verify_status=$?
      set -e
      bun --no-install scripts/annotate-turbo-summary.ts
      if [ "$$verify_status" -eq 0 ]; then
        bun --no-install packages/homelab/src/cdk8s/scripts/generate-caddyfile.ts caddyfile.generated
      fi
      exit "$$verify_status"
    artifact_paths:
      - "caddyfile.generated"
      - "packages/homelab/src/cdk8s/dist/**/*"
      - "packages/homelab/src/cdk8s/dist/*"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_verify_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: verify

  # PR change filters include the global CI/toolchain closure. A selector
  # mistake can therefore only run extra work; it cannot hide changes to the
  # machinery that decides or executes a lane.
  - label: ":performing_arts: playwright e2e (PR)"
    key: playwright-e2e-pr
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/**"
        - ".mise.toml"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
        - "patches/**"
        - "turbo.json"
        - "packages/sjer.red/**"
        - "packages/astro-opengraph-images/**"
        - "packages/webring/**"
        - "packages/eslint-config/**"
        # Main's playwright lane also gates on the deploy consumers of its
        # artifact — mirror them (lane↔if_changed coverage test).
        - "scripts/deploy-site.ts"
        - "scripts/lib/s3-static-site.ts"
        - "scripts/lib/run.ts"
    cancel_on_build_failing: true
    command: |
      rm -f /etc/apt/sources.list.d/nodesource.list /etc/apt/sources.list.d/nodesource.sources
      curl -fsSL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip
      echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  /tmp/bun.zip" | sha256sum --check -
      python3 -m zipfile -e /tmp/bun.zip /usr/local/lib
      chmod +x /usr/local/lib/bun-linux-x64/bun; export PATH="/usr/local/lib/bun-linux-x64:$$PATH"
      bun install --frozen-lockfile --filter sjer.red --filter '@shepherdjerred/monorepo'
      cd packages/sjer.red && bun x --no-install playwright install && cd ../..
      bun x --no-install turbo run build lint test test:e2e --filter=sjer.red --concurrency=2
    retry: *retry
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: playwright-e2e-pr
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            serviceAccountName: buildkite-agent-stack-k8s-controller
            containers:
              - *checkout_container
              - name: container-0
                # renovate: datasource=docker depName=mcr.microsoft.com/playwright
                image: "mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07"
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "2", memory: "5Gi" }
                  limits: { cpu: "4", memory: "8Gi" }
                volumeMounts:
                  # Mirror-backed checkouts: see the container-0 mounts in the
                  # shared pod anchors (turbo runs git in these containers).
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true
                envFrom:
                  - secretRef: { name: buildkite-ci-secrets }

  - label: ":performing_arts: playwright e2e (main)"
    key: playwright-e2e-main
    if: build.branch == pipeline.default_branch
    depends_on: ci-selector-base
    cancel_on_build_failing: true
    command: |
      if [ "$(buildkite-agent meta-data get ci-lane-run-playwright --default true)" != true ]; then exit 0; fi
      rm -f /etc/apt/sources.list.d/nodesource.list /etc/apt/sources.list.d/nodesource.sources
      curl -fsSL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip
      echo "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  /tmp/bun.zip" | sha256sum --check -
      python3 -m zipfile -e /tmp/bun.zip /usr/local/lib
      chmod +x /usr/local/lib/bun-linux-x64/bun; export PATH="/usr/local/lib/bun-linux-x64:$$PATH"
      bun install --frozen-lockfile --filter sjer.red --filter '@shepherdjerred/monorepo'
      cd packages/sjer.red && bun x --no-install playwright install && cd ../..
      bun x --no-install turbo run build lint test test:e2e --filter=sjer.red --concurrency=2
    artifact_paths:
      - "packages/sjer.red/dist/**/*"
      - "packages/sjer.red/dist/*"
    retry: *retry
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: playwright-e2e-main
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            serviceAccountName: buildkite-agent-stack-k8s-controller
            containers:
              - *checkout_container
              - name: container-0
                # renovate: datasource=docker depName=mcr.microsoft.com/playwright
                image: "mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07"
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "2", memory: "5Gi" }
                  limits: { cpu: "4", memory: "8Gi" }
                volumeMounts:
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true
                envFrom:
                  - secretRef: { name: buildkite-ci-secrets }

  - label: ":scroll: resume build (PR)"
    key: resume-build-pr
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/**"
        - ".mise.toml"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
        - "patches/**"
        - "turbo.json"
        - "packages/resume/**"
        # Main's resume lane also gates on the deploy consumers of its
        # artifact — mirror them (lane↔if_changed coverage test).
        - "scripts/deploy-site.ts"
        - "scripts/lib/s3-static-site.ts"
        - "scripts/lib/run.ts"
    cancel_on_build_failing: true
    command: |
      export PATH="$(dirname "$(find /usr/local/texlive -name xelatex | head -1)"):$$PATH"
      cd packages/resume
      xelatex resume.tex
    artifact_paths: "packages/resume/*.pdf"
    retry: *retry
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: resume-build-pr
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            serviceAccountName: buildkite-agent-stack-k8s-controller
            containers:
              - *checkout_container
              - name: container-0
                # renovate: datasource=docker depName=texlive/texlive
                image: "texlive/texlive:TL2024-historic"
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "1", memory: "2Gi" }
                  limits: { cpu: "2", memory: "4Gi" }
                volumeMounts:
                  # Mirror-backed checkouts: see the container-0 mounts in the
                  # shared pod anchors (turbo runs git in these containers).
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true
                envFrom:
                  - secretRef: { name: buildkite-ci-secrets }

  - label: ":scroll: resume build (main)"
    key: resume-build-main
    if: build.branch == pipeline.default_branch
    depends_on: ci-selector-base
    cancel_on_build_failing: true
    command: |
      if [ "$(buildkite-agent meta-data get ci-lane-run-resume --default true)" != true ]; then exit 0; fi
      export PATH="$(dirname "$(find /usr/local/texlive -name xelatex | head -1)"):$$PATH"
      cd packages/resume
      xelatex resume.tex
    artifact_paths: "packages/resume/*.pdf"
    retry: *retry
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: resume-build-main
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            serviceAccountName: buildkite-agent-stack-k8s-controller
            containers:
              - *checkout_container
              - name: container-0
                # renovate: datasource=docker depName=texlive/texlive
                image: "texlive/texlive:TL2024-historic"
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "1", memory: "2Gi" }
                  limits: { cpu: "2", memory: "4Gi" }
                volumeMounts:
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true
                envFrom:
                  - secretRef: { name: buildkite-ci-secrets }

  - label: ":test_tube: observability e2e (PR)"
    key: docker-e2e-pr
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/**"
        - ".mise.toml"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
        - "patches/**"
        - "turbo.json"
        - "packages/llm-observability/**"
        - "packages/eslint-config/**"
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@shepherdjerred/llm-observability'
      bun --no-install run --cwd packages/llm-observability test:e2e:ci
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_buildkit_kubernetes
          podSpecPatch:
            <<: *pod_buildkit_pod_spec
            initContainers:
              - name: tempo
                image: "grafana/tempo:2.10.6@sha256:6ea351a2186822a044d5e326ed4c7a43d019378e4c033c271b89584216db03e7"
                restartPolicy: Always
                args: ["-config.file=/etc/tempo/tempo.yaml"]
                volumeMounts:
                  - {
                      name: llm-observability-e2e-tempo,
                      mountPath: /etc/tempo,
                      readOnly: true,
                    }
                  - { name: llm-observability-e2e-data, mountPath: /var/tempo }
              - name: minio
                image: "minio/minio:RELEASE.2025-04-08T15-41-24Z@sha256:8834ae47a2de3509b83e0e70da9369c24bbbc22de42f2a2eddc530eee88acd1b"
                restartPolicy: Always
                args: ["server", "/data", "--console-address", ":9001"]
                env:
                  - { name: MINIO_ROOT_USER, value: minioadmin }
                  - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
                volumeMounts:
                  - { name: llm-observability-e2e-data, mountPath: /data }
              - name: minio-init
                image: "minio/mc:RELEASE.2025-04-03T17-07-56Z@sha256:69fb6e6ca209008ae3cacf9f63c2524f68a1322dc921c8992ba2cc99c5bef3c6"
                command:
                  [
                    "/bin/sh",
                    "-c",
                    "until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/llm-archive",
                  ]
            volumes:
              - {
                  name: llm-observability-e2e-tempo,
