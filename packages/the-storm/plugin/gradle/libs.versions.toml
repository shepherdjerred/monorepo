# Single source of truth for every dependency and Gradle plugin version.
# Renovate bumps these; build-logic reads them through the `libs` catalog.
[versions]
paper = "26.2.build.129-stable"
jspecify = "1.0.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
errorprone-support = "0.30.0"
google-java-format = "1.36.1"
pmd = "7.27.0"
jacoco = "0.8.15"
jackson = "3.2.3"
jooq = "3.21.8"
flyway = "13.8.0"
sqlite-jdbc = "3.53.4.0"
hikari = "7.1.0"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.0"
mockbukkit = "4.116.1"
mockito = "5.24.0"
jda = "6.7.0"
luckperms = "5.5"
bluemap = "2.8.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-support-contrib = { module = "tech.picnic.error-prone-support:error-prone-contrib", version.ref = "errorprone-support" }
errorprone-support-refaster = { module = "tech.picnic.error-prone-support:refaster-runner", version.ref = "errorprone-support" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
bluemap-api = { module = "de.bluecolored:bluemap-api", version.ref = "bluemap" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version = "5.1.1" }
spotless = { id = "com.diffplug.spotless", version = "8.10.2" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
