                env:
                  - *env_buildkite_shell
                  - *grant_github_download
            initContainers:
              # The live ConfigMap is reconciled only after this PR merges.
              # Render its Tempo 3-compatible subset first, so this PR's new
              # Tempo image can be accepted before that GitOps reconciliation.
              - name: render-tempo-config
                # renovate: datasource=docker depName=mikefarah/yq
                image: "mikefarah/yq:latest@sha256:cfc4eee658595834ef304eadb0c3ea721f3b7cb6404ad8b7cb909cc5b5145b23"
                command:
                  - /bin/sh
                  - -ec
                  - >-
                    yq eval 'del(.ingester, .compactor)'
                    /config-source/tempo.yaml > /etc/tempo/tempo.yaml
                volumeMounts:
                  - {
                      name: llm-observability-e2e-tempo-source,
                      mountPath: /config-source,
                      readOnly: true,
                    }
                  - {
                      name: llm-observability-e2e-tempo-rendered,
                      mountPath: /etc/tempo,
                    }
              - name: tempo
                image: "grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5"
                restartPolicy: Always
                args: ["-config.file=/etc/tempo/tempo.yaml"]
                volumeMounts:
                  - {
                      name: llm-observability-e2e-tempo-rendered,
                      mountPath: /etc/tempo,
                      readOnly: true,
                    }
                  - { name: llm-observability-e2e-data, mountPath: /var/tempo }
              - name: minio
                image: "minio/minio:RELEASE.2025-04-08T15-41-24Z@sha256:8834ae47a2de3509b83e0e70da9369c24bbbc22de42f2a2eddc530eee88acd1b"
                restartPolicy: Always
                args: ["server", "/data", "--console-address", ":9001"]
                env:
                  - { name: MINIO_ROOT_USER, value: minioadmin }
                  - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
                volumeMounts:
                  - { name: llm-observability-e2e-data, mountPath: /data }
              - name: minio-init
                image: "minio/mc:RELEASE.2025-04-03T17-07-56Z@sha256:69fb6e6ca209008ae3cacf9f63c2524f68a1322dc921c8992ba2cc99c5bef3c6"
                command:
                  [
                    "/bin/sh",
                    "-c",
                    "until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/llm-archive",
                  ]
            volumes:
              - {
                  name: llm-observability-e2e-tempo-source,
                  configMap: { name: llm-observability-e2e-tempo },
                }
              - { name: llm-observability-e2e-tempo-rendered, emptyDir: {} }
              - {
                  name: llm-observability-e2e-data,
                  emptyDir: { medium: Memory, sizeLimit: 1Gi },
