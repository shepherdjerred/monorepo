              # Render its Tempo 3-compatible subset first, so this PR's new
              # Tempo image can be accepted before that GitOps reconciliation.
              - name: render-tempo-config
                # renovate: datasource=docker depName=mikefarah/yq
                image: "mikefarah/yq:latest@sha256:cfc4eee658595834ef304eadb0c3ea721f3b7cb6404ad8b7cb909cc5b5145b23"
                command:
                  - /bin/sh
                  - -ec
                  - >-
                    yq eval 'del(.ingester, .compactor)'
                    /config-source/tempo.yaml > /etc/tempo/tempo.yaml
                volumeMounts:
                  - {
                      name: llm-observability-e2e-tempo-source,
                      mountPath: /config-source,
                      readOnly: true,
                    }
                  - {
                      name: llm-observability-e2e-tempo-rendered,
                      mountPath: /etc/tempo,
                    }
              - name: tempo
                image: "grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5"
                restartPolicy: Always
                args: ["-config.file=/etc/tempo/tempo.yaml"]
                volumeMounts:
                  - {
                      name: llm-observability-e2e-tempo-rendered,
                      mountPath: /etc/tempo,
                      readOnly: true,
                    }
                  - { name: llm-observability-e2e-data, mountPath: /var/tempo }
              - name: minio
                image: "minio/minio:RELEASE.2025-04-08T15-41-24Z@sha256:8834ae47a2de3509b83e0e70da9369c24bbbc22de42f2a2eddc530eee88acd1b"
                restartPolicy: Always
                args: ["server", "/data", "--console-address", ":9001"]
                env:
                  - { name: MINIO_ROOT_USER, value: minioadmin }
                  - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
                volumeMounts:
                  - { name: llm-observability-e2e-data, mountPath: /data }
              - name: minio-init
                image: "minio/mc:RELEASE.2025-04-03T17-07-56Z@sha256:69fb6e6ca209008ae3cacf9f63c2524f68a1322dc921c8992ba2cc99c5bef3c6"
                command:
                  [
                    "/bin/sh",
                    "-c",
                    "until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/llm-archive",
                  ]
            volumes:
              - {
                  name: llm-observability-e2e-tempo-source,
                  configMap: { name: llm-observability-e2e-tempo },
                }
              - { name: llm-observability-e2e-tempo-rendered, emptyDir: {} }
              - {
                  name: llm-observability-e2e-data,
                  emptyDir: { medium: Memory, sizeLimit: 1Gi },
                }
          metadata:
            labels:
              ci.sjer.red/step-key: docker-e2e-main

  # These are optional security findings: a finding is soft, but scanner/runtime
  # failures remain hard. Both scanners are PR-only and path-gated.
  - label: ":shield: Trivy — optional, non-blocking findings"
    key: trivy
    timeout_in_minutes: 20
    soft_fail:
      - exit_status: 7
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/pipeline.yml"
        - ".buildkite/main-bootstrap.yml"
        - ".buildkite/scripts/buildkite-handoff.ts"
        - ".buildkite/scripts/ci-changed.ts"
        - ".buildkite/scripts/migration-core.ts"
        - ".buildkite/scripts/prepare-ci-changed-base.ts"
        - ".buildkite/scripts/read-buildkite-handoff.ts"
        - ".buildkite/scripts/select-main-pipeline.ts"
        - ".buildkite/scripts/upload-pipeline.sh"
        - "bun.lock"
        - "**/bun.lock"
        - "bunfig.toml"
        - ".trivyignore"
        - "package.json"
        - "packages/**/package.json"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/go.mod"
        - "**/go.sum"
        - "**/Cargo.lock"
        - "**/Cargo.toml"
        - "**/Podfile.lock"
        - "**/Package.resolved"
        - "**/requirements*.txt"
        - "**/Pipfile"
        - "**/Pipfile.lock"
        - "**/poetry.lock"
        - "**/uv.lock"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/*.csproj"
        - "Dockerfile"
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "patches/**"
        - "turbo.json"
      # sandbox is personal scratch and frozen legacy code; it is not shipped.
      # Do not start a scanner pod for changes that only touch that tree.
      exclude: "sandbox/**"
    cancel_on_build_failing: true
    # Excluding unshipped scratch also avoids traversing and resolving the
    # archived Maven graphs on every scan (build 5980 exhausted Maven Central's
    # shared-IP rate limit while resolving sandbox/archive/castle-casters).
    # The trusted CronJob refreshes the shared database. PR scans mount that
    # database read-only and keep only scan results in memory, avoiding both
    # concurrent BoltDB writers and per-PR database downloads.
    command: |
      echo "OPTIONAL SECURITY SCAN: Trivy HIGH/CRITICAL findings do not block merge; scanner/runtime failures do."
      set +e
      trivy fs --cache-backend memory --cache-dir /buildkite/trivy-db --skip-db-update --scanners vuln --severity HIGH,CRITICAL --exit-code 7 --skip-dirs node_modules --skip-dirs sandbox .
      trivy_status=$$?
      set -e
      if [ "$$trivy_status" -eq 7 ]; then
        echo "Trivy reported findings only (exit 7); Buildkite will soft-fail this optional step."
      elif [ "$$trivy_status" -ne 0 ]; then
        echo "Trivy failed to run (exit $$trivy_status); this is a hard CI failure."
      fi
      exit "$$trivy_status"
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: trivy
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            serviceAccountName: buildkite-job
            automountServiceAccountToken: false
            containers:
              - *checkout_container
              # The shell is taken from the AGENT container's registration
              # env (container-0-level BUILDKITE_SHELL is ignored — the
              # build-5651 lesson). This image has no bash; use sh.
              - name: agent
                env:
                  - name: BUILDKITE_SHELL
                    value: "/bin/sh -e -c"
              - name: container-0
                # renovate: datasource=docker depName=aquasec/trivy
                image: "aquasec/trivy:0.72.0"
                securityContext:
                  allowPrivilegeEscalation: false
                # The Trivy image has /bin/sh but no /bin/bash. The agent's
                # default bash shell otherwise fails before Trivy can start.
                env:
                  - name: BUILDKITE_SHELL
                    value: "/bin/sh -e -c"
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "250m", memory: "512Mi" }
                  limits: { cpu: "2", memory: "4Gi" }
                volumeMounts:
                  # Mirror-backed checkouts (same as semgrep below): without
                  # this mount the trivy pod's checkout cannot resolve the
                  # alternates path and pays a full ~1 GB cold clone on every
                  # lockfile-touching PR.
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true
                  - name: trivy-db
                    mountPath: /buildkite/trivy-db
                    readOnly: true
            volumes:
              - name: trivy-db
                persistentVolumeClaim:
                  claimName: buildkite-trivy-db

  - label: ":mag: Semgrep — optional, non-blocking findings"
    key: semgrep
    timeout_in_minutes: 20
    soft_fail:
      - exit_status: 1
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/pipeline.yml"
        - ".buildkite/main-bootstrap.yml"
        - ".buildkite/scripts/buildkite-handoff.ts"
        - ".buildkite/scripts/ci-changed.ts"
        - ".buildkite/scripts/migration-core.ts"
        - ".buildkite/scripts/prepare-ci-changed-base.ts"
        - ".buildkite/scripts/read-buildkite-handoff.ts"
        - ".buildkite/scripts/select-main-pipeline.ts"
        - ".buildkite/scripts/upload-pipeline.sh"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
