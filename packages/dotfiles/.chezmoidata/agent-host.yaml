# Package selection for the headless "agent-host" profile (see
# .chezmoi.toml.tmpl). `.Brewfile_darwin` stays the generated dump of the full
# workstation; dot_Brewfile.tmpl filters it for agent hosts instead of keeping a
# second hand-maintained list. Every tap, formula, go, uv, and npm entry is kept.
# Only these casks survive, and VS Code extensions are dropped.
agentHost:
  casks:
    - 1password-cli
    - anthropics/tap/ant
    - claude-code@latest
    - codex
    - gcloud-cli
    # Provides the xterm-ghostty terminfo for sessions opened from Ghostty.
    - ghostty
    # PinchTab drives Canary as its dedicated automation browser
    # (run_once_after_install-pinchtab-daemon.sh).
    - google-chrome@canary
    - orbstack
  # The GUI Tailscale build cannot run the Tailscale SSH server, so agent hosts
  # use the open-source tailscaled installed as a system daemon instead of the
  # tailscale-app cask.
  brews:
    - tailscale
