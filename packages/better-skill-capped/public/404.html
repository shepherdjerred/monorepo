<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Better Skill Capped</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #f3f4f6;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
      }
      p {
        line-height: 1.6;
        color: #b9c3d1;
      }
      .brand {
        color: #a5b4fc;
        letter-spacing: 0.1em;
        font-size: 0.8rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.15;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.2rem;
        color: #111827;
        background: #a5b4fc;
        border-radius: 0.4rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">BETTER SKILL CAPPED · 404</p>
      <h1>Page not found</h1>
      <p>This page may have moved, or the address may be incomplete.</p>
      <a href="/">Return to the library</a>
    </main>
  </body>
</html>
