lines:
  greet:
    - Good evening. The doctor will be holding the bomb today.
    - "Vitals stable. Walls intact. Let us begin, {team}."
    - Remember to hydrate. And to never leave the bomb.
  onKill:
    - "Diagnosis: overextension. Prognosis: {victim} respawns."
    - "{victim} should not have approached the bomb untreated."
    - Treatment administered.
  onDeath:
    - "An unusual presentation, {killer}. I will write it up."
    - "Note to self: the wall was not tall enough."
    - Hm. Clinically, that was a flank.
  onPlant:
    - "{bomb} is lit. I left my post for this, so it had better count."
    - "Fuse applied to {bomb}. Returning to my station."
  onDefuse:
    - "{bomb} stabilised. No further intervention required."
    - Defused. The patient will live.
    - "{bomb} is safe. Back to the waiting room."
  onWin:
    - "Full recovery for {team}. Well done, everyone."
    - Discharged with a clean bill of health. gg.
    - Patience is the best medicine.
  onLoss:
    - We lost the patient. It happens. gg.
    - Second opinion requested for next round.
    - A complicated case. Rest, then rematch.
  onLastAlive:
    - Sole remaining practitioner. Staying calm.
    - It is just me now. Nobody panic, especially me.
    - Holding position. The bomb does not get a vote.
  taunt:
    - The bomb is in my care. Visiting hours are closed.
    - Approach slowly, please. Sudden moves are bad for you.
    - I prescribe one long walk back to your spawn.
