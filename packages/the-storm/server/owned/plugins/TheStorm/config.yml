# Owned by the repository and written on every boot; the plugin never saves it.
# Every module must be listed. A missing or unknown key stops the plugin.
# A module is switched on in the same change that retires the third-party
# plugin it replaces.
modules:
  economy: true
  messages: true
  safety: true
  mail: true
  chat: true
  discord: true
  essentials: true
  shops: true
  shards: true
  towns: true
  # Recovered 2016 plot terrain is required; TheStorm loads its generator before modules enable.
  creative: true
  tracks: true
  mechanics: true
  spells: true
  npcs: true
  quests: true
  reset: true
  arena: true
  mobs: true
  qol: true
  skills: true
  seasonal: true
  # Creates and loads the generated skylands world itself; never a Multiverse world.
  skylands: true
  world: true
  tickets: true
  agent: true
  companions: true
  # Red Warfare Search and Destroy and its bots; the rwf world is provisioned on live.
  rwf: true
  rwfbots: true
  advancements: true
