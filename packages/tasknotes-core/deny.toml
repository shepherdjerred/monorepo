# cargo-deny configuration for the TaskNotes core workspace.
#
# This replaces cargo-audit (subsumed by [advisories]), cargo-vet, and
# cargo-outdated. Run it with `cargo deny --all-features check`.

[graph]
all-features = true
# The core is Linux-testable and targets Apple, Android, and Windows. Anything outside
# these targets is not part of the shipped graph and should not be audited.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "x86_64-linux-android",
]

[advisories]
version = 2
# No blanket ignores. An advisory that genuinely does not apply gets its own
# entry here with a comment naming why, not a wildcard.
ignore = []

[licenses]
version = 2
# Registry dependencies retain a reviewed allow-list. The owner's explicit
# GPL version 3 grant applies only to the six first-party workspace packages
# listed below; it does not blanket-approve new third-party copyleft licenses.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.93
exceptions = [
  { name = "tasknotes-core", version = "=0.1.0", allow = ["GPL-3.0-only"] },
  { name = "tasknotes-core-ffi", version = "=0.1.0", allow = ["GPL-3.0-only"] },
  { name = "tasknotes-vault", version = "=0.1.0", allow = ["GPL-3.0-only"] },
  { name = "tasknotes-runtime", version = "=0.1.0", allow = ["GPL-3.0-only"] },
  { name = "obsidian-sync", version = "=0.1.0", allow = ["GPL-3.0-only"] },
  { name = "xtask", version = "=0.1.0", allow = ["GPL-3.0-only"] },
  # serde-saphyr's byte decoder includes WHATWG tables under BSD-3-Clause.
  # Reviewed license terms retain attribution; no copyleft or runtime code loading.
  { name = "encoding_rs", version = "=0.8.42", allow = ["BSD-3-Clause"] },
  # SQLite's hashlink dependency uses foldhash under the permissive zlib license.
  # Retain the copyright/license notice in packaged third-party attribution.
  { name = "foldhash", version = "=0.2.0", allow = ["Zlib"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The intra-workspace `tasknotes-core` path dependency has no version because
# nothing here is published. Wildcards on *registry* crates stay denied.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[bans.build]
# A build script is arbitrary code executed on every developer machine and
# every CI agent, with full filesystem and network access, before a single
# line of the project compiles. Enumerating them turns "a transitive dep grew
# a build.rs" from invisible into a review conversation.
#
# Regenerate with:
#   cargo metadata --format-version 1 --all-features \
#     | jq -r '.packages[] | select(any(.targets[]; .kind == ["custom-build"])) | .name' \
#     | sort -u
allow-build-scripts = [
  { name = "anyhow" },
  { name = "camino" },
  # Pinned build.rs is empty unless optional filtering/case-insensitive features
  # are enabled. Neither feature is enabled; all bundled IANA zones are retained.
  { name = "chrono-tz", version = "=0.10.4" },
  # Version-specific SIMD cfg selection; reviewed build.rs has no I/O.
  { name = "encoding_rs", version = "=0.8.42" },
  { name = "fs-err" },
  { name = "getrandom" },
  { name = "iana-time-zone-haiku" },
  { name = "libc" },
  # Compiles the pinned bundled SQLite amalgamation using cc. Reviewed build.rs
  # has no network download; system-library discovery is unused with bundled.
  { name = "libsqlite3-sys", version = "=0.38.2" },
  { name = "num-traits" },
  { name = "proc-macro2" },
  { name = "quote" },
  { name = "rustix" },
  { name = "rustversion" },
  { name = "serde" },
  { name = "serde_core" },
  { name = "serde_json" },
  { name = "thiserror" },
  { name = "wasm-bindgen" },
  { name = "wasm-bindgen-shared" },
  { name = "wit-bindgen" },
  { name = "zerocopy" },
  { name = "zmij" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Deliberately empty. Note for the Windows phase: uniffi-bindgen-cs is
# git-install-only (never published to crates.io). It is a *tool*, not a
# dependency of this graph, so it must stay out of Cargo.toml rather than be
# allow-listed here.
allow-git = []
