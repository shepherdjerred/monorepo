# Mob Arena classes. Owned by the repository; the plugin never writes it.
# Every key is required and unknown keys are errors.
#
# The nine 2014-2015 kits (Archer, Madman, Guardian, Healer, Wolfmaster, Tank,
# Knight, Oddjob, Chemist) are open to everyone; there are no paid classes.
# Advanced classes (the 2017 idea) need thestorm.arena.class.<id>, which quests
# grant. Each kit can clear every wave solo: there is no natural healing to
# lean on, so every kit carries healing potions and golden apples, and upgrade
# waves (the wave after each boss) refill the consumables.
#
# Items: material, amount (1-64), name (plain text or null), enchantments
# (key: level), potion (a potion type key such as strong_healing, for potions
# and tipped arrows, or null) and slot (HEAD, CHEST, LEGS, FEET, MAIN_HAND,
# OFF_HAND, or null for anywhere). Arena gear is unbreakable, and nothing a
# class carries leaves the arena.
# Effects are potion effect keys to amplifiers (0 is level I) lasting the game.
