name: llm-obs-e2e
services:
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo.yaml"]
    # `configs` ships the file CONTENT through the compose API instead of a
    # host bind mount — required in CI, where the docker daemon is a dind
    # sidecar that cannot see this container's checkout.
    configs:
      - source: tempo_config
        target: /etc/tempo.yaml
    volumes:
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    # No healthcheck: the tempo image is distroless (no shell, no wget — an
    # exec-form check can never pass). run.ts polls /ready from the host.

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    command: ["silo", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      retries: 30
      start_period: 5s

configs:
  tempo_config:
    # Inline content (not `file:`): compose implements `file:` configs as
    # bind mounts, which CI's dind daemon cannot resolve. Keep in sync with
    # ./tempo.yaml (kept for local tooling/reference).
    content: |
      stream_over_http_enabled: true
      server:
        http_listen_port: 3200
        log_level: info
      distributor:
        receivers:
          otlp:
            protocols:
              http:
                endpoint: "0.0.0.0:4318"
              grpc:
                endpoint: "0.0.0.0:4317"
      storage:
        trace:
          backend: local
          wal:
            path: /var/tempo/wal
          local:
            path: /var/tempo/blocks
      overrides:
        defaults:
          metrics_generator:
            processors: []

volumes:
  tempo-data: {}
  minio-data: {}
