  - label: ":helm: helm push"
    key: helm-push
    timeout_in_minutes: 60
    if: build.branch == pipeline.default_branch
    # Wait for this build's remote solves before suspending the currently
    # floating repository Applications and publishing their immutable charts.
    depends_on:
      [
        homelab-release-admission,
        images,
        ci-base-refresh,
        ci-playwright-refresh,
      ]
    concurrency: 1
    concurrency_group: monorepo/homelab-release
    concurrency_method: ordered
    command: |
      release_admission=$$(bun --no-install .buildkite/scripts/homelab-release-admission.ts consume)
      if [ "$$release_admission" = "superseded" ]; then exit 0; fi
      if [ "$$release_admission" != "admitted" ]; then
        echo "invalid homelab release admission outcome: $$release_admission"
        exit 1
      fi
      image_digests=$$(bun --no-install .buildkite/scripts/read-buildkite-handoff.ts image-digests)
      release_requested=false
      if bun --no-install .buildkite/scripts/ci-changed.ts helm; then release_requested=true; fi
      if bun --no-install .buildkite/scripts/ci-changed.ts argocd; then release_requested=true; fi
      if [ "$$image_digests" != "{}" ]; then release_requested=true; fi
      if ! $$release_requested; then
        exit 0
      fi
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter homelab --filter '@homelab/cdk8s' --production
      export ARGOCD_TOKEN="$$ARGOCD_AUTH_TOKEN"
      bun --no-install packages/homelab/scripts/argocd.ts suspend-auto-sync apps --timeout 300
      export HOMELAB_IMAGE_DIGESTS_JSON="$$image_digests"
      export HOMELAB_RELEASE_VERSION="2.0.0-$BUILDKITE_BUILD_NUMBER"
      bun --no-install packages/homelab/scripts/helm-push.ts "$BUILDKITE_BUILD_NUMBER"
      buildkite-agent artifact upload "helm-release-plan.json"
      buildkite-agent artifact upload "argocd-release-expected.json"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: helm-push
          podSpecPatch:
            <<: *pod_light_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_light_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_argocd
                  - *grant_chartmuseum_username
                  - *grant_chartmuseum_password

