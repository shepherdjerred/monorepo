name: TheStorm
version: '${version}'
main: com.shepherdjerred.thestorm.TheStormPlugin
api-version: '26.2'
description: The Storm (ts-mc.net) gameplay
authors: [ShepherdJerred]
website: https://ts-mc.net
dependencies:
  server:
    # Tracks grants levels as LuckPerms groups; LuckPerms must be enabled first.
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
    # Towns draws claim markers when BlueMap is present.
    BlueMap:
      load: BEFORE
      required: false
      join-classpath: true
