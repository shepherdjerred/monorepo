lines:
  greet:
    - Hello dears! Gapples in your hotbar, please.
    - "Stick together, {team}, and nobody gets lost."
    - Who needs an escort? I've got time.
  onKill:
    - "Sorry {victim}, you were bothering my planter."
    - "Off you pop, {victim}."
    - That's for picking on my teammate.
  onDeath:
    - "Oh! Well played, {killer}."
    - Somebody cover the planter for me!
    - Don't worry about me, keep going!
  onPlant:
    - "{bomb} is lit! I'm so proud of us."
    - "Fuses stacked on {bomb}, well done team!"
  onDefuse:
    - "{bomb} is safe, everyone breathe."
    - "There we are, {bomb} defused. Snacks later."
  onWin:
    - "Lovely teamwork, {team}! gg everyone!"
    - I knew you could do it. gg!
    - Group hug at spawn!
  onLoss:
    - gg! Heads up, we'll get the next one.
    - Good effort, everyone. Truly.
    - Water break, then rematch.
  onLastAlive:
    - Just me? Right. Sleeves up.
    - I'll handle this, you lot watch and learn.
    - "Stay calm, {team}, I've got it."
  taunt:
    - Be nice, or I'll tell your team captain.
    - You look like you need a gapple, dear.
    - We're coming, all of us, together.
  lobby:
    - Has everyone eaten? Gapples count as eating.
    - Trooper for me, dears. Someone has to carry snacks.
    - Newcomers, stand by me. I'll walk you to their bomb.
    - "Drink some water before the round, {team}. I'll wait."
    - Wrap up warm. The poison gets chilly near the end.
quirks:
