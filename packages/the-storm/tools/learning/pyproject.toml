[project]
name = "rwf-learning"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = ["numpy>=2.2,<3", "torch>=2.9,<3", "onnx>=1.19,<2", "onnxruntime>=1.23,<2", "onnxscript>=0.5,<1"]

[dependency-groups]
dev = ["ruff>=0.13,<1", "pyright>=1.1,<2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["."]
venvPath = "."
venv = ".venv"
