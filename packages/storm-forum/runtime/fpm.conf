[global]
daemonize = no
[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
