# Plain text; {placeholders} are filled in. Each message may use only the
# placeholders listed in its comment.
messages:
  # {player} {arena}
  joined: "{player} entered {arena}. Pick a class at the signs."
  # {player}
  left: "{player} left the arena."
  # {arena}
  spectating: "You are watching {arena}. Use /arena leave to stop."
  # {class}
  classPicked: "You are a {class}. Hit the ready block (or /arena ready) when you are set."
  # {player}
  ready: "{player} is ready."
  # {seconds}
  countdown: "Everyone is ready! The gates open in {seconds} seconds."
  countdownCancelled: "The countdown stopped: not everyone is ready."
  # {arena} {tier} {waves}
  gameStarted: "The gates of {arena} open ({tier}). Survive {waves} waves!"
  # {wave}
  waveStarted: "Wave {wave}!"
  # {wave}
  swarmWave: "Wave {wave}: a swarm pours in!"
  # {wave}
  cavalryWave: "Wave {wave}: riders on the horizon!"
  # {wave} {boss}
  bossWave: "Wave {wave}: {boss} has come for you!"
  # {wave}
  upgradeWave: "Wave {wave}: supplies! Your kit has been refilled."
  # {wave}
  waveCleared: "Wave {wave} cleared."
  # {amount} {wave}
  reward: "You earned {amount} for clearing wave {wave}."
  # {wave}
  vaultOpened: "The wave {wave} vault opens for you. Its loot waits outside the arena."
  # {wave}
  vaultAlreadyOpened: "You have already opened the wave {wave} vault today."
  vaultDelivered: "Your arena vault loot is in your inventory."
  # {player} {wave}
  died: "{player} fell on wave {wave}."
  # {arena} {wave}
  victory: "{arena} is conquered! All {wave} waves cleared."
  # {arena} {wave}
  defeat: "{arena} falls silent after wave {wave}."
  removedWithoutClass: "The game started without you: you had not picked a class."
  startedWithoutYou: "The game started before you got in. Use /arena spec to watch."
  # {boss}
  heartBroken: "A heart of {boss} shatters!"
  # {boss}
  bossDefeated: "{boss} is defeated!"
  restored: "Your belongings from your last arena game are back."
