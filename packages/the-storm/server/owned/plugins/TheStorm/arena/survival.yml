classes:
  - role: FIGHTER
    passive: "10% less melee damage received."
    ability: "Sweep nearby enemies for damage and knockback."
    specializations:
      - id: GUARDIAN
        name: "Guardian"
        description: "Gain 8 absorption HP for 8 seconds."
      - id: VANGUARD
        name: "Vanguard"
        description: "Sweep for 8 damage within 5 blocks, with knockback."
  - role: RANGER
    passive: "10% more projectile damage; native deflection still applies."
    ability: "Receive 8 arrows and a five-second speed burst."
    specializations:
      - id: MARKSMAN
        name: "Marksman"
        description: "Next 3 shots deal 50% extra damage; expires in 12 seconds."
      - id: PIERCER
        name: "Piercer"
        description: "Next 3 arrows pierce up to 3 enemies; expires in 12 seconds."
  - role: MEDIC
    passive: "Revive teammates in four seconds instead of five."
    ability: "Heal nearby standing teammates for 6 HP."
    specializations:
      - id: FIELD_SURGEON
        name: "Field Surgeon"
        description: "Heal standing allies within 8 blocks for 8 HP."
      - id: RESCUER
        name: "Rescuer"
        description: "Revive one downed ally within 5 blocks and line of sight for 4 HP."
  - role: ENGINEER
    passive: "Repair barricades for 2 planks instead of 4."
    ability: "Restore a nearby barricade."
    specializations:
      - id: FORTIFIER
        name: "Fortifier"
        description: "Repair nearby barricades; grant allies within 6 blocks 4 absorption HP."
      - id: SAPPER
        name: "Sapper"
        description: "Place a 15-second shock trap: 6 damage and Slowness II in 5 blocks."
  - role: ALCHEMIST
    passive: "Class debuffs last 20% longer."
    ability: "Weaken and slow the nearby horde."
    specializations:
      - id: CRYOMANCER
        name: "Cryomancer"
        description: "Slow enemies within 6 blocks with Slowness II for 6 seconds."
      - id: PLAGUE_BREWER
        name: "Plague Brewer"
        description: "Weaken enemies and deal 6 total damage over 6 seconds within 6 blocks."
  - role: BEASTMASTER
    passive: "Companions deal 20% extra damage."
    ability: "Summon or recall one companion wolf."
    specializations:
      - id: PACKLEADER
        name: "Packleader"
        description: "Summon or recall two wolves."
      - id: WARDEN
        name: "Warden"
        description: "Summon or recall one wolf; gain 8 absorption HP for 8 seconds."
