# An arena. Owned by the repository; the plugin never writes it. The file name
# must be the arena's id. Every key is required and unknown keys are errors.
#
# Coordinates of the existing Colosseum and its underground class lobby.
# The module checks at enable that the world is loaded, that every
# point but the exit and join signs lies inside the region, that the exit lies
# outside it, and that every loot chest is a container.
#
# The towns module protects the region as an admin region; the arena also
# keeps its players inside, blocks every block change while a game runs, and
# keeps its chunks loaded only while a game runs.
id: colosseum
name: The Colosseum
world: world

# The box players and mobs are kept inside, both corners included; min must
# not exceed max on any axis.
region:
  min: { x: 164, y: 30, z: -60 }
  max: { x: 290, y: 100, z: 64 }

# Where players wait, pick a class and ready up (inside the region).
lobby: { x: 224.5, y: 33.0, z: 2.5, yaw: 90.0, pitch: 0.0 }
# Where spectators watch from (inside the region).
spectator: { x: 227.5, y: 66.0, z: 50.5, yaw: 180.0, pitch: 30.0 }
# Where a fighter who dies respawns, outside the region; their belongings are
# then restored and they return to where they joined from.
exit: { x: 160.5, y: 68.0, z: 2.5, yaw: 90.0, pitch: 0.0 }

# Where fighters start, shared in turn.
playerSpawns:
  - { x: 227.5, y: 43.0, z: 2.5, yaw: 0.0, pitch: 0.0 }
  - { x: 224.5, y: 43.0, z: 2.5, yaw: 90.0, pitch: 0.0 }
  - { x: 200.5, y: 42.0, z: 2.5, yaw: -90.0, pitch: 0.0 }
  - { x: 250.5, y: 42.0, z: 2.5, yaw: 90.0, pitch: 0.0 }

# Where mobs appear; keep them a little away from the player spawns. The
# Creaking's heart grows on these blocks, so leave them clear.
mobSpawns:
  - { x: 227.5, y: 41.0, z: -29.5 }
  - { x: 227.5, y: 42.0, z: 32.5 }
  - { x: 227.5, y: 41.0, z: -24.5 }
  - { x: 205.5, y: 42.0, z: 20.5 }
  - { x: 249.5, y: 42.0, z: -19.5 }

# The block (usually a sign) to right-click for each class, in the lobby.
classSigns:
  knight: { x: 220, y: 34, z: 3 }
  archer: { x: 220, y: 35, z: 3 }
  madman: { x: 220, y: 34, z: 1 }
  guardian: { x: 220, y: 35, z: 1 }
  healer: { x: 220, y: 34, z: 0 }
  wolfmaster: { x: 220, y: 35, z: 2 }
  tank: { x: 220, y: 34, z: 4 }
  oddjob: { x: 220, y: 36, z: 2 }
# All eleven classes remain available with /arena class <class>.

# The block to right-click when ready (MobArena's iron block).
readyBlock: { x: 220, y: 33, z: 2 }

# Every chest in the saved Colosseum, stocked at start and every five cleared waves.
lootChests:
  - { x: 179, y: 48, z: 2 }
  - { x: 185, y: 48, z: 2 }
  - { x: 212, y: 42, z: 2 }
  - { x: 227, y: 48, z: -40 }
  - { x: 227, y: 48, z: -46 }
  - { x: 227, y: 42, z: -13 }
  - { x: 225, y: 42, z: 2 }
  - { x: 227, y: 42, z: 0 }
  - { x: 229, y: 42, z: 2 }
  - { x: 227, y: 42, z: 4 }
  - { x: 227, y: 42, z: 17 }
  - { x: 227, y: 48, z: 44 }
  - { x: 227, y: 48, z: 50 }
  - { x: 242, y: 42, z: 2 }
  - { x: 269, y: 48, z: 2 }
  - { x: 275, y: 48, z: 2 }

# Signs outside the arena that join it when right-clicked.
joinSigns:
  - { x: 171, y: 60, z: 2 }

# 1 is Ominous I (arena.yml tiers).
tier: 1
# The server has two or three players online: a game starts with one ready
# player and takes at most four.
minPlayers: 1
maxPlayers: 4
