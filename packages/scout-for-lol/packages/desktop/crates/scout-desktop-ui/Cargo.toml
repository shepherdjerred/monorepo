[package]
name = "scout-desktop-ui"
description = "gpui-kit window for Scout Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
scout-desktop-ipc = { path = "../scout-desktop-ipc" }
# The overlay's card contract and placement; toolkit-free.
scout-overlay = { path = "../scout-overlay" }
uuid.workspace = true

# The only GPUI dependencies in the workspace, and only where the window can
# run. Linux builds and tests the view models, link and tokens without them.
# `tests/gpui_boundary.rs` keeps it that way.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
async-channel.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
# The overlay window's native handle, for click-through (`src/native/`). The
# version GPUI implements `HasWindowHandle` with.
raw-window-handle = "0.6.2"

# Click-through on macOS: `NSWindow.ignoresMouseEvents`, and a window class
# that cannot become key. The versions GPUI's macOS platform already links.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["std", "NSResponder", "NSView", "NSWindow"]

# Click-through, no-activate and topmost on Windows: the extended window
# styles, `SetLayeredWindowAttributes` and `SetWindowPos`.
[target.'cfg(windows)'.dependencies.winsafe]
version = "0.0.29"
features = ["user"]

# Compile the Metal shaders when the window starts rather than at build time,
# so a macOS build needs no Metal Toolchain download on top of Xcode.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-platform = { workspace = true, features = ["runtime_shaders"] }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
# The golden Explore fixtures played through a chat session, so the view
# models and the offscreen render start from the server's contract frames.
scout-explore-client = { path = "../scout-explore-client", features = ["golden"] }
serde_json.workspace = true

# The offscreen renderer behind `tests/render_pages.rs`. Dev-only, so release
# builds never carry GPUI's test support. It is enabled on GPUI itself, not on
# gpui-kit: gpui-kit's `test-support` names its optional gpui-fast backend,
# whose exact pins (`taffy =0.15.0`, `unicode-properties =0.1.3`) conflict
# with the versions GPUI resolves to.
[target.'cfg(target_os = "macos")'.dev-dependencies]
async-channel.workspace = true
# Writes the stub chart and card art the offscreen render shows; GPUI already
# links this version.
image = { version = "0.25.10", default-features = false, features = ["png"] }
gpui = { workspace = true, features = ["test-support"] }
gpui-platform = { workspace = true, features = ["runtime_shaders", "test-support"] }

[[test]]
name = "render_pages"
harness = false

[[test]]
name = "render_overlay"
harness = false

[lints]
workspace = true
