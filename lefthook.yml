glob_matcher: doublestar

# Local hooks inspect only staged files. Buildkite owns the exhaustive
# whole-repo verification graph; developers run focused package checks while
# iterating instead of competing for laptop resources with parallel agents.

commit-msg:
  jobs:
    - name: validate-commit-msg
      run: bun scripts/validate-commit-msg.ts {1}

pre-commit:
  jobs:
    - name: safety
      group:
        parallel: true
        jobs:
          - name: gitleaks
            run: gitleaks protect --staged --redact --no-banner

          - name: merge-conflicts
            glob: "**/*.{ts,tsx,rs,json,yaml,yml,md,sh,astro,toml}"
            run: bun scripts/check-merge-conflicts.ts {staged_files}

          - name: large-files
            run: bun scripts/check-large-files.ts {staged_files}

          - name: line-endings
            run: bun scripts/check-line-endings.ts {staged_files}

          - name: env-var-names
            glob: "**/*.{ts,rs,py,fish,tmpl,yaml,yml,env,md,sh,swift}"
            exclude:
              - "sandbox/archive/**"
              - "**/generated/**"
              - "**/node_modules/**"
            run: bun scripts/check-env-var-names.ts {staged_files}

          - name: check-suppressions
            run: bun scripts/check-suppressions.ts

          - name: check-agent-guidance
            glob: "{AGENTS.md,CLAUDE.md,.agents/**,.claude/**,.cursor/**,.opencode/**,packages/**/AGENTS.md,packages/**/CLAUDE.md,packages/**/.agents/**,packages/**/.cursor/**,packages/**/.opencode/**,packages/**/skills/**,packages/dotfiles/dot_agents/skills/**,packages/dotfiles/dot_claude/**,packages/dotfiles/dot_gemini/**,packages/dotfiles/private_dot_codex/**,packages/dotfiles/private_dot_cursor/**,sandbox/**/AGENTS.md,sandbox/**/CLAUDE.md,scripts/check-agent-guidance.ts,scripts/check-agent-guidance.test.ts,scripts/lib/agent-guidance-files.ts}"
            run: bun run check-agent-guidance

          # Swift is the one language Buildkite cannot build: the CI image ships
          # SwiftLint's static binary but no toolchain, and standing up a
          # Swift+Rust+bun image for one test layer is not worth ~5GB/arch and a
          # promotion lane (measured — see the macOS plan's "Swift on Linux").
          # That leaves `bun run mac:verify` as the only real gate, and until now
          # nothing enforced that anyone ran it. This is that enforcement.
          # Deliberately the FAST subset, not `mac:verify` — that ends in a full
          # xcodebuild. This is build + test + lint + format-check, ~5s, which is
          # proportionate for a hook. `mac:verify` (which adds xcodegen and the
          # app build) stays the pre-PR command.
          #
          # ⚠️ The steps below go through `bun run` rather than calling `swift`
          # directly. That is load-bearing, not tidiness: `mac:build` and
          # `mac:test` run `mac:preflight` first, which checks the committed
          # UniFFI bindings against the gitignored XCFramework they link. A bare
          # `swift build` here would fail with `Undefined symbol: _uniffi_…`
          # while the package's own command succeeded. A hook that disagrees
          # with the command it is enforcing is worse than no hook.
          #
          # Skipped outside a local CLI runtime. A hosted Claude or Codex
          # checkout is Linux with no Swift toolchain and no `xcrun`, so
          # staging one `.swift` file there would fail the commit itself
          # rather than the code — and the repository rule is that lifecycle
          # hooks exit immediately in those environments. The same env vars the
          # session hooks keyed on, so there is one answer to "is this hosted".
          - name: swift-verify
            glob: "packages/tasknotes-macos/**/*.swift"
            skip:
              - run: test -n "$CLAUDE_CODE_REMOTE"
              - run: test -n "$CODEX_CI"
              - run: test -n "$CODEX_CLOUD_TASKS_BASE_URL"
              # Swift, swiftlint, xcrun, and the XCFramework builder are
              # macOS-only. Buildkite remains the cross-platform backstop.
              - run: 'bun -e ''process.exit(process.platform === "win32" ? 0 : 1)'''
            run: |
              cd packages/tasknotes-macos
              bun run mac:build
              bun run mac:test
              swiftlint lint --strict
              xcrun swift-format lint --strict --parallel --recursive Sources Tests App UITests Package.swift
              ./ci/no-suppressions.sh

          # The bundle, as opposed to the code in it.
          #
          # ⚠️ A separate job with its own glob, deliberately. `swift-verify`
          # above is gated on `**/*.swift`, so the change that shipped an
          # unlaunchable Release build — `ENABLE_HARDENED_RUNTIME: YES` in
          # `project.yml`, nothing else — **did not trigger it at all**. Widening
          # that job's glob instead would put a Release `xcodebuild` in the path
          # of every one-line Swift edit, and a hook people disable is worse than
          # one that missed something.
          #
          # This is the expensive gate (1–3 minutes) and it is affordable
          # precisely because these files change rarely — while being exactly the
          # files whose failures no Swift test can see. `mac:smoke` builds
          # Release, launches it in the background, and requires it to stay up;
          # see `scripts/verify-launch.ts` for why launching rather than
          # inspecting the signature is the only check that works here.
          - name: mac-bundle-verify
            glob: "packages/tasknotes-macos/{project.yml,Package.swift,App/**,scripts/**}"
            skip:
              - run: test -n "$CLAUDE_CODE_REMOTE"
              - run: test -n "$CODEX_CI"
              - run: test -n "$CODEX_CLOUD_TASKS_BASE_URL"
              - run: 'bun -e ''process.exit(process.platform === "win32" ? 0 : 1)'''
            run: |
              cd packages/tasknotes-macos
              bun run mac:smoke

          - name: lockfile-check
            glob: "**/package.json"
            run: bun install --frozen-lockfile --dry-run

          # Formatting is intentionally staged-file-only locally. CI runs the
          # sharded `//#prettier-*` tasks over the whole repository
          # (scripts/repo-shards.ts).
          - name: prettier
            glob: "**/*.{ts,tsx,js,jsx,json,jsonc,yaml,yml,md,css,astro,html,graphql}"
            exclude:
              - "sandbox/archive/**"
              - "**/node_modules/**"
              - "**/generated/**"
              # CLAUDE.md is a symlink to AGENTS.md everywhere; prettier
              # errors on explicitly-passed symlinks. AGENTS.md is linted.
              - "**/CLAUDE.md"
            run: bun scripts/prettier-staged.ts {staged_files}
            stage_fixed: true
