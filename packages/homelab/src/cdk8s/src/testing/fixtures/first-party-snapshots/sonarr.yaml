apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-sonarr
  namespace: media
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: LinuxServer.io images require writable filesystem
    ignore-check.kube-linter.io/run-as-non-root: LinuxServer.io images run as root internally
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: media-sonarr-c83de5a2
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        cdk8s.io/metadata.addr: media-sonarr-c83de5a2
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TZ
              value: America/Los_Angeles
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          image: ghcr.io/linuxserver/sonarr:<version-catalog:linuxserver/sonarr>
          imagePullPolicy: Always
          name: main
          ports:
            - containerPort: 8989
          resources:
            limits:
              cpu: 1000m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          startupProbe:
            failureThreshold: 3
            tcpSocket:
              port: 8989
          volumeMounts:
            - mountPath: /config
              name: pvc-sonarr-pvc
            - mountPath: /downloads
              name: pvc-qbittorrent-hdd-pvc
            - mountPath: /tv
              name: pvc-plex-tv-hdd-pvc
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsNonRoot: true
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: pvc-sonarr-pvc
          persistentVolumeClaim:
            claimName: sonarr-pvc
            readOnly: false
        - name: pvc-qbittorrent-hdd-pvc
          persistentVolumeClaim:
            claimName: qbittorrent-hdd-pvc
            readOnly: false
        - name: pvc-plex-tv-hdd-pvc
          persistentVolumeClaim:
            claimName: plex-tv-hdd-pvc
            readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-pvc
  namespace: media
  labels:
    velero.io/backup: enabled
    velero.io/exclude-from-backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  storageClassName: zfs-ssd
  volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  name: media-sonarr-service
  namespace: media
spec:
  externalIPs: []
  ports:
    - port: 8989
  selector:
    cdk8s.io/metadata.addr: media-sonarr-c83de5a2
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-sonarr-tailscale-ingress-ingress
  namespace: media
  labels:
    tailscale.com/proxy-class: medium
spec:
  defaultBackend:
    service:
      name: media-sonarr-service
      port:
        number: 8989
  ingressClassName: tailscale
  tls:
    - hosts:
        - sonarr
