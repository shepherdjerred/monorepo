# Reynold's Supplies: the general store at spawn. In 2015 Reynold sold 16 coal
# for 128 crystals on purpose, to cap player prices; while the server is small
# the prices are kinder.
#
# Every entry states buy, sell and dailyLimit; write null for "not offered" or
# "no limit". buy is what a player pays per trade, sell what a player is paid.
# A sell price is never above the buy price, and no catalog pays more per item
# than another charges.
id: reynolds-supplies
name: Reynold's Supplies
greeting: >-
  Reynold looks up from his ledger. "Coal, rope and lanterns: everything a new
  arrival needs. The Storm doesn't wait for anyone to be ready."
