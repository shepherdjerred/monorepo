  # Findings are soft; scanner/runtime failures are hard. Both scanners are PR
  # only and use native path filters so unchanged code never starts a pod.
  - label: ":shield: trivy"
    key: trivy
    soft_fail:
      - exit_status: 7
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/**"
        - ".mise.toml"
        - "bun.lock"
        - "**/bun.lock"
        - "bunfig.toml"
        - ".trivyignore"
        - "package.json"
        - "packages/**/package.json"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/go.mod"
        - "**/go.sum"
        - "**/Cargo.lock"
        - "**/Cargo.toml"
        - "**/Podfile.lock"
        - "**/Package.resolved"
        - "**/requirements*.txt"
        - "**/Pipfile"
        - "**/Pipfile.lock"
        - "**/poetry.lock"
        - "**/uv.lock"
        - "**/pom.xml"
        - "**/build.gradle"
        - "**/build.gradle.kts"
        - "**/*.csproj"
        - "Dockerfile"
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "patches/**"
        - "turbo.json"
      # sandbox is personal scratch and frozen legacy code; it is not shipped.
      # Do not start a scanner pod for changes that only touch that tree.
      exclude: "sandbox/**"
    cancel_on_build_failing: true
    # Excluding unshipped scratch also avoids traversing and resolving the
    # archived Maven graphs on every scan (build 5980 exhausted Maven Central's
    # shared-IP rate limit while resolving sandbox/archive/castle-casters).
    # The trusted CronJob refreshes the shared database. PR scans mount that
    # database read-only and keep only scan results in memory, avoiding both
    # concurrent BoltDB writers and per-PR database downloads.
    command: trivy fs --cache-backend memory --cache-dir /buildkite/trivy-db --skip-db-update --scanners vuln --severity HIGH,CRITICAL --exit-code 7 --skip-dirs node_modules --skip-dirs sandbox .
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: trivy
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            containers:
              - *checkout_container
              # The shell is taken from the AGENT container's registration
              # env (container-0-level BUILDKITE_SHELL is ignored — the
              # build-5651 lesson). This image has no bash; use sh.
              - name: agent
                env:
                  - name: BUILDKITE_SHELL
                    value: "/bin/sh -e -c"
              - name: container-0
                # renovate: datasource=docker depName=aquasec/trivy
                image: "aquasec/trivy:0.72.0"
                securityContext:
                  allowPrivilegeEscalation: false
                # The Trivy image has /bin/sh but no /bin/bash. The agent's
                # default bash shell otherwise fails before Trivy can start.
                env:
                  - name: BUILDKITE_SHELL
                    value: "/bin/sh -e -c"
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "500m", memory: "1Gi" }
                  limits: { cpu: "2", memory: "4Gi" }
                volumeMounts:
                  # Mirror-backed checkouts (same as semgrep below): without
                  # this mount the trivy pod's checkout cannot resolve the
                  # alternates path and pays a full ~1 GB cold clone on every
                  # lockfile-touching PR.
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true
                  - name: trivy-db
                    mountPath: /buildkite/trivy-db
                    readOnly: true
            volumes:
              - name: trivy-db
                persistentVolumeClaim:
                  claimName: buildkite-trivy-db

  - label: ":mag: semgrep"
    key: semgrep
    soft_fail:
      - exit_status: 1
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/**"
        - ".mise.toml"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
        - "patches/**"
        - "turbo.json"
        - "Dockerfile"
        - "**/Dockerfile"
        - "**/Dockerfile.*"
        - "**/*.astro"
        - "**/*.c"
        - "**/*.cjs"
        - "**/*.clj"
        - "**/*.cljs"
