excluded:
  - .build
  - dist

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_zero_over_explicit_init
  - prohibited_super_call
  - redundant_nil_coalescing
  - return_value_from_void_function
  - sorted_first_last
  - toggle_bool
  - unhandled_throwing_task
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - weak_delegate
  - yoda_condition

disabled_rules:
  - opening_brace
  - trailing_comma

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 700

type_body_length:
  warning: 350
  error: 450

function_body_length:
  warning: 60
  error: 90

cyclomatic_complexity:
  warning: 12
  error: 15

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

reporter: xcode
