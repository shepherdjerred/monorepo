# Discord Plays Mario Kart 64 — example config.
# Copy to config.toml and fill in. Leaving the IDs/tokens empty makes this file
# fail validation on purpose (so it can't be run as-is).

server_id = ""  # Discord guild (server) ID

[bot]
# Optional Discord *bot* (for /screenshot, /help, presence). Not used for video.
enabled = false
discord_token = ""
application_id = ""

[bot.commands]
enabled = false
update = false

[bot.commands.screenshot]
enabled = true

[bot.notifications]
enabled = false
channel_id = ""

[stream]
enabled = true
channel_id = ""          # voice channel to Go-Live in
dynamic_streaming = true # start/stop the stream with channel occupancy
minimum_in_channel = 0
require_watching = false

[stream.userbot]
# Discord USER (self) account — Discord blocks video from bot tokens, so a user
# token is required. Use a DEDICATED throwaway account (this violates Discord
# ToS and risks a ban). Token invalidates on password change.
id = ""
token = ""

[stream.video]
canvas_height = 720       # 16:9 output canvas height (-> 1280x720); 4:3 game pillarboxed onto black
frame_rate = 30
bitrate_kbps = 5000
bitrate_max_kbps = 8000
hardware_acceleration = false  # VAAPI h264 on an Intel iGPU; also via STREAM_HARDWARE_ACCELERATION env
vaapi_device = "/dev/dri/renderD128"
encoder_async_depth = 1   # VAAPI -async_depth; 1 = lowest latency, 2 = ffmpeg default (A/B knob)
low_latency_mux = true    # -flush_packets 1 on the container output
low_delay_audio = true    # Opus lowdelay + 10ms frames

[emulator]
enabled = true   # false: nothing is prepared at startup and /play is refused
# Your Mario Kart 64 ROM (US, .z64). Provided at runtime via a volume — never
# baked into the image. You must supply your own copy. The game's asset archive
# is extracted from it at startup into <state_root_dir>/spaghettikart-assets.
rom_path = "roms/mariokart64.z64"
seats = 4

[spaghettikart]
# The SpaghettiKart build. The image ships it at this path; for a local build
# (`bun run build:spaghetti`) use ".cache/spaghetti/dist".
install_dir = "packages/backend/assets/spaghettikart"
output_fps = 30   # 30, or 60 with the port's interpolated frames

[web]
enabled = true
cors = true
port = 8081
assets = "packages/frontend/dist"

[web.api]
enabled = true

# Discord sign-in for seats is required while [web.api] is enabled. Set, in the
# environment: WEB_PUBLIC_ORIGIN (the origin players open, e.g.
# http://localhost:8081) and DISCORD_CLIENT_SECRET (the bot application's OAuth2
# secret), and register <WEB_PUBLIC_ORIGIN>/api/auth/discord/callback as a
# redirect on that application.

[leaderboard]
enabled = true                      # race-result recording + the leaderboard API
db_path = "data/leaderboard.db"     # overridden by DATABASE_PATH / DATABASE_URL env
overlay_enabled = true              # burn player names into the stream per viewport
poll_every_n_frames = 10            # race-state snapshot cadence in game frames (~3 Hz)

[driver_feed]
# Low-latency in-browser video for seated players, served as H.264 access units
# over the /video WebSocket. Additive: spectators keep watching the Go-Live
# stream, which is unaffected. Costs a second ffmpeg encode and one copy of the
# stream on the uplink per connected driver, so measure your upstream bandwidth
# against bitrate_kbps * max_clients before raising either.
# Reuses [stream.video]'s hardware_acceleration, vaapi_device and
# encoder_async_depth — same GPU, same latency knob.
enabled = false
height = 480                        # square-pixel output height (4:3 -> 640x480)
bitrate_kbps = 2500
bitrate_max_kbps = 4000
keyframe_interval_frames = 30       # ~1s at 30fps; also the client resync cadence
max_client_buffer_bytes = 131072    # per-client socket backlog before deltas are dropped (~0.4 s at 2500 kbps)
max_clients = 8
