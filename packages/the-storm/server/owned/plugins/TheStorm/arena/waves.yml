# Mob Arena wave table. Owned by the repository; the plugin never writes it.
# Every key is required and unknown keys are errors.
#
# 72 waves, as in 2015: a boss every 10 waves, a swarm on every wave ending in
# 5, an upgrade wave after each boss (refilling every class's consumables), and
# a cavalry wave on every wave ending in 8. Modernized for 26.x: the Giant is a
# zombie scaled up with the scale attribute (it keeps its AI), and the bosses
# are the Parched King, a Breeze, an Evoker, the Creaking (break its heart),
# a Piglin Brute, a Ravager, the Colossus and the Warden as the finale.
#
# Counts are for one fighter: every wave is meant to be clearable solo. Extra
# fighters, the wave number and the arena's tier scale them (arena.yml).

finalWave: 72

# Mob archetypes. type: the entity type. health, damage, speed: multipliers on
# vanilla values. scale: the scale attribute (1 is vanilla size). name: shown
# above the mob, or null. equipment: slot to material; never dropped. rider:
# another archetype riding this one, or null. behavior: VANILLA, CHASE (always
# hunts the nearest fighter), KAMIKAZE (hunts and explodes with power blast)
# or FOLLOW (harmless, trails a fighter). blast: explosion power for KAMIKAZE,
# 0 otherwise.
