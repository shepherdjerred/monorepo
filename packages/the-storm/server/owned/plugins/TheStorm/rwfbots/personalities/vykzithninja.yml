    - "Calmly, {bomb} is safe."
  onWin:
    - Patience is rewarded. gg.
    - "Well waited, {team}."
  onLoss:
    - Loss teaches. gg.
    - The river flows on.
  onLastAlive:
    - Alone, and at peace.
    - Stillness.
    - "The wall and I are one, {team}."
  taunt:
    - Why rush?
    - The bomb will wait. So will I.
    - Hurry, and you will stumble.
  lobby:
    - Breathe in. The lobby is a pond.
    - The sword waits in its sheath.
    - "{team}, the round arrives whether we hurry or not."
    - Stillness is a kit, too.
    - I will be in my corner. Visit if you need calm.
