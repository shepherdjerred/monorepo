      - crystals 550
      - points 1
      - reputation townsfolk 1

  the-ore-account:
    name: "The Ore Account"
    giver: marcus
    category: side
    repeat: once
    estimatedMinutes: 45
    requirements:
      - completed the-cart-brakes
    text:
      offer: "The cart can stop safely. Now compare the ore leaving the face with the cart manifest, so a missing load is noticed early."
      accept: "Bring raw iron and paper for a checked ore account."
      decline: "I will trust the cart tally for one more run."
      finish: "The crew can trace a cart load back to the measured ore at the face."
      summary: "Check the South Mines raw iron against the cart manifest."
      questions: []
    start: account
    stages:
      account:
        journal: "Bring Marcus 32 raw iron and 12 paper."
        waiting: "The ore account should match the cart it belongs to."
        complete: "The third cart has a checked ore account."
        objectives:
          - deliver marcus 32 RAW_IRON
          - deliver marcus 12 PAPER
        onComplete: []
        next: [{ to: complete, when: [], label: none }]
        timeLimit: none
    onAccept: []
    rewards:
      - crystals 600
      - points 1
      - reputation townsfolk 1
