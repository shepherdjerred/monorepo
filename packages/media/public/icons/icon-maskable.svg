<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    The mark of icon.svg for a launcher that cuts its own shape (a circle, a
    squircle, a teardrop) out of the icon. Spruce runs to every edge, and the
    mark stays inside the safe zone every mask keeps: the centered circle
    whose radius is 40% of the icon, 204.8 here. The farthest ink, the foot of
    the left stem, is 185 from the center.

    Source of icon-maskable-512.png (`bun scripts/render-icons.ts`).
  -->
  <rect width="512" height="512" fill="#141918" />
  <g transform="translate(89.6 176) scale(1.6)">
    <path
      d="M15 100V47.5a32.5 32.5 0 0 1 65 0V100M80 47.5a32.5 32.5 0 0 1 65 0V100"
      fill="none"
      stroke="#eef0e9"
      stroke-width="30"
    />
    <circle cx="191" cy="83" r="17" fill="#e9b878" />
  </g>
</svg>
