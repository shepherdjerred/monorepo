# Worlds the world module requires to be provisioned and loaded before enable.
# Paper already owns world, world_nether and world_the_end. Owned by the
# repository; the plugin never writes it.
# sleepPercentage is the share of awake players who must be in a bed to skip
# the night, on every overworld. Entering a bed is the only vote.

sleepPercentage: 50
# Preserve the former ChunkyBorder radii using native border diameters.
borders:
  - { world: world, centerX: 0.0, centerZ: 0.0, size: 40000.0 }
  - { world: world_nether, centerX: 0.0, centerZ: 0.0, size: 10000.0 }
  - { world: world_the_end, centerX: 0.0, centerZ: 0.0, size: 5000.0 }
# The crier reads current main-world weather and time only when asked.
crier:
  enabled: true
  world: world
# One weather-grounded archive bark on arrival near the windmill spawn per
# Pacific date. Event-driven; no repeating task or automatic server broadcast.
ambient:
  enabled: true
  world: world
  # Same measured windmill entrance as essentials.yml.
  spawnX: 68
  spawnY: 69
  spawnZ: 66
  spawnRadius: 24
  verticalRadius: 8
  timeZone: America/Los_Angeles
# Records only observed arrivals and deaths after activation. The command is
# read-only, on demand, and requires crier.enabled above.
digest:
  enabled: true
  world: world
  timeZone: America/Los_Angeles
# Clear cobblestone outside the windmill, away from its door and altar.
# A nearby arrival can begin one finite, item-barter visit per Pacific date.
merchant:
  enabled: true
  world: world
  anchors:
    - { x: 65, y: 69, z: 66 }
  arrivalRadius: 12
  visitMinutes: 20
  timeZone: America/Los_Angeles
worlds:
  - name: wilds
    preset: large_biomes
    rtp: true
  - name: peaks
    preset: amplified
    rtp: true
  # This resource world is disposable; its quarterly reset is managed by
  # Temporal only after a backup and while the server is stopped.
  - name: mining
    preset: normal
    rtp: true
