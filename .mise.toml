# Mise configuration for monorepo development AND CI.
# `mise install` provides every toolchain: dev machines, git hooks, and the
# CI toolchain image (ci/ci-image) are all baked from this one file,
# so laptop and CI can never disagree about tool versions.
#
# Renovate's native mise manager tracks these pins without a hint comment.
# Only `dotnet` and `java` carry a `# renovate:` hint, because the native
# manager cannot resolve them; the `.mise.toml` custom manager in
# renovate.json reads those two lines.

[tools]
bun = "1.4.2"
# Temporal's real workflow-worker tests need Node runtime primitives that Bun
# 1.4 does not implement. Keep the sole exception on the current LTS line.
node = "24.21.0"
# The Storm's archive and restore tests require modern Python syntax. Resolve
# this interpreter through mise inside Gradle rather than the system Python.
python = "3.15.0"
# The short `temporal` registry alias still targets the archived
# temporalio/temporal release layout, which has no Darwin arm64 artifact.
"aqua:temporalio/cli" = "1.9.1"
# Media subtitle archives use the upstream 7zz binary, including RAR decoding.
"aqua:ip7z/7zip" = "26.04"
rust = "1.99.0"
# Compiler cache for every CI rustc invocation (RUSTC_WRAPPER): CI mounts a
# shared object store so verify stops rebuilding ~4 GB of target/ per run.
sccache = "0.18.0"
"aqua:yonaskolb/XcodeGen" = { version = "2.46.0", os = ["macos"] }
"cargo:cargo-packager" = "0.11.8"
# renovate: datasource=dotnet-version depName=dotnet-sdk
dotnet = "10.0.303"
# The C# UniFFI generator is built by tasknotes-core's xtask from its
# source-controlled 0.32 retarget. It is not a global tool: the generated
# bindings must match the core's exact UniFFI ABI.
# Explicit deep-quality tools. These are scheduled/operator gates, not ordinary
# PR-lane work, but they stay pinned with the rest of the repository toolchain.
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-llvm-cov" = "0.9.1"
# tasknotes-core's `deny` script (supply-chain + license + build-script bans).
# No mise registry entry exists, so this names the backend explicitly; `github:`
# fetches the release binary and verifies its artifact attestation and SLSA
# provenance, where `cargo:` would build it from source on every CI image bake.
"github:EmbarkStudios/cargo-deny" = "0.20.2"
# renovate: datasource=github-releases depName=corretto/corretto-25 versioning=loose
java = "corretto-25.0.5.0.10"
# The Storm plugin build (packages/the-storm/plugin). No Gradle wrapper: this pin
# is the single Gradle version for laptops and the CI image.
gradle = "9.8.2"
# Repo-wide checks + git hooks (verify/pre-commit call these directly)
gitleaks = "8.30.1"
shellcheck = "0.11.0"
hadolint = "2.15.1"
# Native-family shims
go = "1.27.2"
golangci-lint = "2.14.0"
# Release automation (cooklang publish, release commit-backs) shells out to gh
gh = "2.102.0"
# CI scripts (bake-images.ts affected-scoping + digest collection) use jq
jq = "1.8.2"
# Link checker for the weekly Temporal link-rot report (root lychee.toml);
# pinned here so local runs match the worker image's binary.
lychee = "0.24.2"
# Semantic YAML/JSON comparison in the Minecraft config-drift check test
# (misc/minecraft-drift-check.test.ts shells out to yq, matching the yq the
# init container runs at deploy time)
yq = "4.54.1"
# Shared local/CI Postgres for scout-for-lol dev + tests. Prebuilt binaries
# (initdb/pg_ctl/psql/createdb/dropdb); major 18 matches the homelab clusters
# (resources/postgres/*.ts, PostgresqlSpecPostgresqlVersion.VALUE_18).
"github:theseus-rs/postgresql-binaries" = { version = "18.6.0", strip_components = 1, bin_path = "bin" }
# Homelab automation (helm push, tofu wrappers, ArgoCD sync, site deploys)
helm = "4.3.0"
opentofu = "1.13.1"
# Kubernetes schema validation of the cdk8s synth output (packages/homelab
# check:kubeconform). Fetches upstream JSON schemas at validation time.
kubeconform = "0.8.0"
# Execute monitoring-rule regression cases with Prometheus's real evaluator.
"aqua:prometheus/prometheus" = "3.15.0"
argocd = "3.5.4"
awscli = "2.37.12"
