# Quality of life: graves, combat tags, the sleep vote and chest sorting
# (replaces GravesX, CombatLog, Sleeper and ChestSort).
# Owned by the repository; the plugin never writes it. Every key is required,
# unknown keys are errors, and durations are ISO-8601 (PT15S, PT2H, P7D).

# When a player dies their drops go into a grave: a player head in open air
# near where they died, on land they may build on (or, after a death in the
# void or lava, where they last stood safely). The items live in the
# database, not in the block. The owner can always empty it; after lockedFor
# anyone may take what fits in their inventory ("stealing from unlocked chests
# is allowed"). After expireAfter the grave breaks open where it stands, drops
# what is left, and the owner is told (at once, or when they next join).
# /graves lists your graves. Experience still drops as vanilla orbs.
graves:
  lockedFor: PT2H
  expireAfter: P7D
  # How far from the death, on each axis, a grave may be placed (1-8).
  searchRadius: 4

# A hit that deals damage between two players (or from a player's pet, TNT,
# lingering potion or projectile) tags both. Tagged players cannot teleport
# (/home, /spawn, /tpa, /back, /warp) and, with killOnLogout, die if they
# disconnect or time out; kicks and bans never kill.
combat:
  tagFor: PT15S
  killOnLogout: true
  logoutMessage: "{player} logged out in combat and was struck down."

# Vanilla's players_sleeping_percentage rule, set on every overworld. Players
# marked AFK are left out of the count (unless they are the ones in bed).
sleep:
  percent: 50

# /sort opens the settings screen. /sort on, off and toggle change automatic
# chest sorting. /sort inventory, hotbar and all sort those slots. With
# sneakPunch, punching a chest, barrel, shulker box or ender chest while
# sneaking with an empty hand sorts it too. sortTime is when a player who
# turned automatic sorting on has a container sorted: OPEN, CLOSE, or BOTH.
# New players start from defaults, with automatic sorting off. blockedHolders
# are regular expressions matched against an inventory holder's class name.
# disabledWorlds skips automatic sorting. Plugin screens are never sorted.
sort:
  sneakPunch: true
  sortTime: CLOSE
  hotkeyCooldownMillis: 200
  defaults:
    containers: false
    inventory: false
    middleClick: true
    shiftClick: true
    doubleClick: true
    shiftRightClick: true
    dump: false
    take: false
    leftClickBlock: false
  blockedHolders:
    - ".*[Bb]ack[Pp]ack.*"
  preventNullHolders: false
  disabledWorlds: []

# A [Bank] sign on a chest, barrel, copper chest or dispenser, and [Shelf]
# signs that receive the items it accepts. groups are extra limits a player
# gets with thestorm.qol.bank.limits.<name>. Distances are blocks, in a
# straight line.
bank:
  limits:
    linkRadius: 64
    findRadius: 128
    banksPerPlayer: 8
    shelvesPerBank: 32
  fallbackRole: OPEN
  verticalTwo: false
  horizontalTwo: false
  signInFront: true
  groups:
    donors:
      linkRadius: 128
      findRadius: 256
      banksPerPlayer: 20
      shelvesPerBank: 64
