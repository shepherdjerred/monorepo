pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_max_body_size 8m;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  proxy_temp_path /tmp/proxy_temp;
  scgi_temp_path /tmp/scgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  map $http_x_forwarded_proto $storm_https { default off; https on; }
  # The chart renders trusted Cloudflare connector addresses, never 0.0.0.0/0.
  server {
    listen 8080;
    root /app/forum;
    index index.php;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /livez { access_log off; return 200 'ok'; }
    location = /readyz { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /opt/storm-forum/runtime/ready.php; fastcgi_pass 127.0.0.1:9000; }
    location ~ ^/(install|src|internal_data)(/|$) { return 404; }
    location = /admin.php { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
      if (-f /var/lib/storm-forum/.maintenance) { return 503; }
      try_files $uri =404;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param HTTPS $storm_https;
      fastcgi_param HTTP_PROXY '';
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_read_timeout 65s;
    }
    # No shared cache for sessions, dynamically generated pages, or attachments.
  }
  server {
    listen 8081;
    root /app/forum;
    location = /admin.php {
      if (-f /var/lib/storm-forum/.maintenance) { return 503; }
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/forum/admin.php;
      fastcgi_param HTTPS on;
      fastcgi_param HTTP_PROXY '';
      fastcgi_pass 127.0.0.1:9000;
    }
    location ^~ /styles/ { try_files $uri =404; }
    location ^~ /js/ { try_files $uri =404; }
    location / { return 404; }
  }
}
