# Essentials: spawn, teleports, homes, kits, the rules book and AFK.
# Owned by the repository; the plugin never writes it. Every key is required,
# unknown keys are errors, and durations are ISO-8601 (PT3S, PT10M, PT1H).

# Where /spawn leads, where new players arrive, and where players without a bed
# or respawn anchor respawn. The entrance of the existing windmill. The module
# refuses to start unless this is a safe spot (solid block underfoot, two open
# blocks above, no hazards) in a loaded world.
spawn:
  world: world
  x: 68.5
  y: 69.0
  z: 66.5
  yaw: -90.0
  pitch: 0.0

teleports:
  # Stand still this long before a teleport; moving a block or taking damage
  # cancels it.
  warmup: PT3S
  # How long a /tpa or /tpahere request stays open.
  tpaTimeout: PT1M
  # The least time between two requests from one player.
  tpaInterval: PT10S
  # How many places /back remembers (teleports and deaths).
  backHistorySize: 5
  # Every command shares a rolling allowance and one cooldown. A successful
  # trip leaves the history after window. Include the next trip's weight:
  # each point above allowance doubles both price and cooldown, up to the cap.
  # Elytra, happy ghasts and lodestones make ordinary journeys without crystals.
  pricing:
    window: PT1H
    allowance: 4.0
    maxMultiplier: 32.0
    rtpFreeFor: P7D
    prices:
      spawn:
        cost: 10
        cooldown: PT30S
        weight: 0.5
      home:
        cost: 25
        cooldown: PT1M
        weight: 1.0
      tpa:
        cost: 25
        cooldown: PT1M
        weight: 2.0
      back:
        cost: 25
        cooldown: PT1M
        weight: 1.0
      warp:
        cost: 15
        cooldown: PT30S
        weight: 0.5
      rtp:
        cost: 25
        cooldown: PT1M
        weight: 1.0

# How many homes each player may set.
homeLimit: 3

# Idle time before a player is marked AFK.
afkTimeout: PT5M

kits:
  # Given once to every new player on their first join.
  starter: starter
  kits:
    starter:
      once: true
      cooldown: PT0S
      items:
        - material: IRON_SWORD
          amount: 1
          name: null
          enchantments: {}
        - material: STONE_PICKAXE
          amount: 1
          name: null
          enchantments: {}
        - material: STONE_AXE
          amount: 1
          name: null
          enchantments: {}
        - material: STONE_SHOVEL
          amount: 1
          name: null
          enchantments: {}
        - material: BREAD
          amount: 16
          name: null
          enchantments: {}
      books:
        - title: Welcome to The Storm
          author: The Storm
          pages:
            - |-
              <dark_aqua><b>The Storm</b></dark_aqua>

              Build, trade, and explore.
              You start with tools, food and 500 crystals.

              /bal shows your money.
              /guide reopens this book.
            - |-
              <dark_aqua><b>Stay safe</b></dark_aqua>

              Read /rules. No griefing.
              Spawn is PvP-free. Outside it, PvP is on.

              /pvp off opts out, once a week.
            - |-
              <dark_aqua><b>Find your own land</b></dark_aqua>

              /rtp finds a safe spot. Free for seven days; cooldowns apply.

              Gather wood. Pick a home, then /sethome to save it.
            - |-
              <dark_aqua><b>Protect your base</b></dark_aqua>

              /town create <name> starts a town.
              /claim protects the chunk you stand in.

              Build on your land or with permission.
            - |-
              <dark_aqua><b>Lock what you love</b></dark_aqua>

              Placed chests lock automatically. Look at one: /lock info checks it.

              Unlocked chests are fair game where access permits.
            - |-
              <dark_aqua><b>Your first reward</b></dark_aqua>

              Right-click Anna by the windmill for a daily reward.

              /quests opens your journal.
              /shop shows the shops.
            - |-
              <dark_aqua><b>Travel</b></dark_aqua>

              /spawn goes to the windmill.
              /home goes to your home.
              /tpa asks to visit a friend.

              Trips cost crystals. /tpinfo shows prices and cooldowns.
            - |-
              <dark_aqua><b>Recover your things</b></dark_aqua>

              /graves lists your graves.

              Recover items within two hours. After that, others may take them.
            - |-
              <dark_aqua><b>Brave The Storm</b></dark_aqua>

              Mobs and ores drop Storm Shards.

              Use one on the windmill's emerald block in rain to upgrade equipment.
            - |-
              <dark_aqua><b>Play together</b></dark_aqua>

              /arena lists co-op games.
              /rwf join enters Search and Destroy.

              Ask in chat or Discord to find players.
            - |-
              <dark_aqua><b>Find your people</b></dark_aqua>

              /help lists commands.
              /ticket <message> asks staff for help.

              Discord and the full player guide:
              docs.ts-mc.net

# The book /rules opens. MiniMessage; at most 100 pages. The server's official
# rules, as given by the owner.
rules:
  title: The Storm Rules
  author: The Storm Staff
  pages:
    - |-
      <dark_aqua><b>The Storm Rules</b></dark_aqua>

      <dark_aqua>1. No griefing.</dark_aqua> Build on your own land or with permission. Staff can roll griefing back.

      <dark_aqua>2. Lock what you love.</dark_aqua> Unlocked chests are fair game; locked containers are off-limits.
    - |-
      <dark_aqua>3. Spare the animals.</dark_aqua> Don't kill other players' animals, pets or villagers.

      <dark_aqua>4. No harassment.</dark_aqua> Not in chat, and no following, trapping or spamming anyone.

      <dark_aqua>5. PvP is on.</dark_aqua> Spawn is PvP-free. /pvp switches yours off or on, once a week.
    - |-
      <dark_aqua>6. No hacks or bug exploits.</dark_aqua>

      Arguing? Take it to War chat with <click:run_command:'/war'><u>/war</u></click>. <click:run_command:'/channels'><u>/channels</u></click> lists every channel.

      What you type to NPCs may be sent to an AI provider to write their replies.
