    name: "The Cart Brakes"
    giver: dorran
    category: side
    repeat: once
    estimatedMinutes: 40
    requirements:
      - completed the-third-cart
    text:
      offer: "The third cart carried a measured load. Before another run, the crew needs powered rails for a safe stopping section."
      accept: "Craft powered rails in the main world for the cart line."
      decline: "The next cart can wait at the loading point."
      finish: "The crew has a batch of powered rails for the stopping section."
      summary: "Prepare a safer stopping section for the South Mines cart."
      questions: []
    start: brakes
    stages:
      brakes:
        journal: "Craft 12 powered rails in the main world for Dorran."
        waiting: "A full cart needs room to stop as well as room to move."
        complete: "Dorran has powered rails for the next repair."
        objectives:
          - craft 12 POWERED_RAIL
        onComplete: []
        next: [{ to: complete, when: [], label: none }]
        timeLimit: none
    onAccept: []
