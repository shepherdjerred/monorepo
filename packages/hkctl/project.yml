name: hkctl

options:
  bundleIdPrefix: red.sjer
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.46.0"

packages:
  HKCTLPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic

targets:
  hkctl:
    type: application
    platform: iOS
    supportedDestinations: [macCatalyst]
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: HKCTLPackage
        product: HKCTLCore
    entitlements:
      path: App/hkctl.entitlements
      properties:
        com.apple.developer.homekit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: hkctl
        CFBundleName: hkctl
        NSHomeKitUsageDescription: "hkctl reads and organizes your HomeKit accessories and rooms."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: red.sjer.hkctl
        PRODUCT_NAME: hkctl
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  hkctl:
    build:
      targets:
        hkctl: all
    run:
      config: Debug
