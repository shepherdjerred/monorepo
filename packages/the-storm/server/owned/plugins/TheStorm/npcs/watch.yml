skins: {}
schedules:
  market-watch:
    shelter: none
    slots:
      - from: "00:00"
        to: "00:00"
        activity: patrol home market-watch-turn
  tavern-watch:
    shelter: none
    slots:
      - from: "00:00"
        to: "00:00"
        activity: patrol home tavern-watch-turn
  windmill-watch:
