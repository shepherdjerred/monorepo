# BlueMap map for The End. Owned by the repository: plugins/BlueMap/maps is an
# owned root, so the image replaces this file on every boot and removes maps
# it does not ship. Keys and defaults follow BlueMap's generated map.conf.
world: "world"
dimension: "minecraft:the_end"
name: "The End"
sorting: 11
start-pos: { x: 0, z: 0 }
sky-color: "#080010"
void-color: "#080010"
sky-light: 1
ambient-light: 0.6
remove-caves-below-y: -10000
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
# Matches the circular border in plugins/TheStorm/world.yml.
render-mask: [
  { type: circle, center-x: 0, center-z: 0, radius: 1750 }
]
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: false
marker-sets: {}
