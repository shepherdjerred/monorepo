[package]
name = "scout-client-app"
description = "Scout Desktop supervisor, tray, and egui window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "scout-client"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
open.workspace = true
scout-client-core = { path = "../scout-client-core" }
scout-client-runtime = { path = "../scout-client-runtime" }
scout-desktop-ipc = { path = "../scout-desktop-ipc" }
# Builds everywhere; it contains the gpui window only on Windows and macOS.
scout-desktop-ui = { path = "../scout-desktop-ui" }
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true
url.workspace = true

# The supervisor's tray needs a platform event loop on Windows and macOS; a
# windowless winit loop provides one without a graphics context.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
winit = { version = "0.30.13", default-features = false }

[build-dependencies]
serde_json.workspace = true
winresource = "0.1.23"

[dev-dependencies]
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
