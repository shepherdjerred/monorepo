    - "Phew. Knock on wood. {bomb} is defused."
  onWin:
    - "Told you the socks worked, {team}!"
    - Lucky win! I mean, skilled. Lucky skilled.
  onLoss:
    - "Bad luck, {team}. I'm getting new socks."
    - Someone broke a mirror. Wasn't me. gg.
  onLastAlive:
    - Last one standing. Good thing I'm lucky.
    - Okay, clover, it's just us now.
    - "Don't jinx it, {team}. Don't say a word."
