# Owned by the repository. Short local watches keep the busy parts of spawn covered.
places:
  market-watch-turn:
    world: minecraft:overworld
    x: -32.5
    y: 64
    z: 4.5
    yaw: 180.0
    pitch: 0.0
  tavern-watch-turn:
    world: minecraft:overworld
    x: -5.5
    y: 67
    z: 66.5
    yaw: 180.0
    pitch: 0.0
  windmill-watch-turn:
