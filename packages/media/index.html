<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the shell pads itself by the safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The canvas color of each theme, from src/client/styles/tokens.css. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f3f5ee"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#141918"
    />
    <meta
      name="description"
      content="Your household's films, series, and requests in one place."
    />
    <!--
      The installable web app: public/manifest.webmanifest and public/icons,
      served at these fixed addresses. The PNG favicon is for a browser that
      takes no SVG one; its `sizes` lets the others prefer the SVG.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Media · Your next watch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
