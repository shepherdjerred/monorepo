# The Search and Destroy lobby: the room every player and bot waits in before
# a match. Owned by the repository; the plugin never writes it. Every key is
# required and unknown keys are errors.
#
# The room is generated by LobbyBuild (rwf domain): a roofed 31x9x31 stone
# room east of every map. blocks.schem fills region exactly and is pasted
# at region.min when the module enables and whenever the world's blocks stop
# matching blocksSha256, like a map. `mise exec -- gradle bakeRwfLobby` writes
# blocks.schem and its nav files; `verifyRwfLobby` (part of check) fails when
# this file, the schematic or the nav files are not what the generator and a
# fresh bake produce. The places below are LobbyBuild.layout() in world
# coordinates; yaw 0 faces south (+z), 90 west, 180 north, 270 east.
name: Waiting Room
region:
  min: { x: 128, y: 64, z: 16 }
  max: { x: 158, y: 72, z: 46 }
# The gold pad in the middle, facing the kit alcoves.
spawn: { x: 143.5, y: 65.0, z: 31.5, yaw: 270.0, pitch: 0.0 }
# Red concrete to the north, blue to the south.
sides:
  - team: RED
    at: { x: 143.5, y: 65.0, z: 22.5, yaw: 0.0, pitch: 0.0 }
  - team: BLUE
    at: { x: 143.5, y: 65.0, z: 40.5, yaw: 180.0, pitch: 0.0 }
# One lit alcove per kit along the east wall, in menu order, north to south:
# the kit's item floats over the pedestal at display; stand is in front of it.
alcoves:
  - kit: trooper
    display: { x: 157.5, y: 66.25, z: 22.5 }
    stand: { x: 154.5, y: 65.0, z: 22.5, yaw: 270.0, pitch: 0.0 }
  - kit: longbow
    display: { x: 157.5, y: 66.25, z: 28.5 }
    stand: { x: 154.5, y: 65.0, z: 28.5, yaw: 270.0, pitch: 0.0 }
  - kit: shortbow
    display: { x: 157.5, y: 66.25, z: 34.5 }
    stand: { x: 154.5, y: 65.0, z: 34.5, yaw: 270.0, pitch: 0.0 }
  - kit: rewind
    display: { x: 157.5, y: 66.25, z: 40.5 }
    stand: { x: 154.5, y: 65.0, z: 40.5, yaw: 270.0, pitch: 0.0 }
# The rules float in front of the north wall, the live match board in front
# of the south wall.
rules: { x: 143.5, y: 66.5, z: 17.5, yaw: 0.0, pitch: 0.0 }
board: { x: 143.5, y: 66.5, z: 45.5, yaw: 180.0, pitch: 0.0 }
# The raised balcony against the west wall, looking out of the window towards
# the maps.
balcony: { x: 131.5, y: 69.0, z: 31.5, yaw: 90.0, pitch: 0.0 }
blocksSha256: 63d4513bab8df532597dbabd5a49abe32ffcbb64f186f1ef14111000c4cf78a3
