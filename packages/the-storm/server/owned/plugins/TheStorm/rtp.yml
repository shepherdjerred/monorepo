# Random teleport and first-arrival dialog. Owned by the repository; the plugin
# never writes it. Durations are ISO-8601.

# Failed searches have their own throttle. All successful travel pricing,
# warmup, cooldown and the seven-day cost waiver live in essentials.yml.
searchInterval: PT15S
landingMemory: PT5M
batchSize: 24
minGap: 512
band: 1500
borderMargin: 128
nearBestHundredths: 90
biomes:
  - plains
  - forest
  - dark_forest
  - cherry_grove
  - flower_forest
  - desert
  - savanna
  - jungle
  - taiga
  - snowy_plains
  - badlands
  - swamp
