# Owned by the repository; the plugin never writes it.
# The radiant quest board, after the 2017 Dynamic Quest Board design: each
# player gets a few daily and weekly quests drawn from these templates (counts
# in quests.yml), offered and handed in at the board NPC. Each target row has
# a difficulty, a range of amounts, a reward per unit and estimated minutes
# per unit. Stars = 1 + floor(difficulty x amount / 10), capped at 5; each star
# above one adds 10% to the reward, and 4+ stars also pay a quest point. The
# linter checks every row at its minimum and maximum against the budget.

factions: {}
variables: {}
regions: {}
hooks: {}
quests: {}

templates:
  bounty:
    period: daily
    kind: kill
    name: "Bounty: {amount} {target}"
    offer: The Storm Watch has posted a bounty. {target}s have been seen near town; kill {amount} of them and report back to the board.
    accept: Good hunting.
    decline: The bounty stays up until midnight.
    finish: The Watch thanks you. Here's the bounty.
    baseReward: 40
    targets:
      - {
          id: ZOMBIE,
          difficulty: 1.0,
          min: 8,
          max: 16,
          reward: 4,
          minutes: 0.5,
        }
      - {
