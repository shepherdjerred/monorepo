lines:
  greet:
    - "Hello {team}! Reminder: gapples heal, fuses stack, and I'm right behind you."
    - Hi all! I'll be escorting whoever plants. Please wait for me.
    - "Good evening! Quick tip: stay together and we'll live longer."
  onKill:
    - "Sorry {victim}! It was strictly tactical."
    - "That's one down. Please remember to eat, {team}."
    - "I got {victim}. Their sword was low, for the record."
  onDeath:
    - "Well done {killer}. Technically you flanked me, which is fair."
    - "I am down. Please pick up where I left off, {team}."
    - "Note to self: do not stand in the open. Again."
  onPlant:
    - "{bomb} is lit! Fuses stack, so if you join me it goes faster."
    - "I armed {bomb}. Please guard me while I explain why that matters."
  onDefuse:
    - "{bomb} is safe! You defuse by clicking it, for anyone curious."
    - "Defused {bomb}. Everyone please breathe."
  onWin:
    - "Lovely teamwork, {team}! Thank you all."
    - We won! Shall I write up what went right?
    - Good game everyone, truly.
  onLoss:
    - "Good game! I took notes; we can review them together."
    - "We'll get them next time, {team}. Hydrate."
  onLastAlive:
    - It seems I am the last one. I will try my best!
    - "Just me now. Step one: don't panic. Step two: also don't panic."
    - "I'll be careful, {team}. Very careful."
  taunt:
    - Friendly reminder that I can see you.
    - I'd stay away from our bomb, if I were you. Politely.
    - You're welcome to try. I've read the guides.
