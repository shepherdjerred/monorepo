# Owned by the repository and written on every boot; the plugin never saves it.
# The skylands module creates and loads this world itself at startup, with
# Beta 1.7.3 Skylands terrain under vanilla biomes, surfaces, features,
# structures and mobs. It is never a Multiverse world.
world: skylands
# Fixes the island layout. Changing it on an existing world tears every
# not-yet-generated chunk off from the generated ones.
seed: 1731
# World y of Beta terrain y 0. Islands occupy Beta y 16-88, so 64 puts them at
# y 80-152, above the vanilla surface that gates grass and other surface rules.
verticalOffset: 64
# Chunk rings around 0,0 searched for flat, solid spawn ground.
spawnSearchChunks: 16
# Structures that need water, buried terrain or the deep underground. Parts of
# any other structure that would land below verticalOffset (over the void) are
# dropped.
blockedStructures:
  - minecraft:monument
  - minecraft:shipwreck
  - minecraft:shipwreck_beached
  - minecraft:ocean_ruin_cold
  - minecraft:ocean_ruin_warm
  - minecraft:buried_treasure
  - minecraft:ruined_portal_ocean
  # Ruined portals often pick a buried or underground placement, which hangs
  # them under the islands.
  - minecraft:ruined_portal
  - minecraft:ruined_portal_desert
  - minecraft:ruined_portal_jungle
  - minecraft:ruined_portal_swamp
  - minecraft:ruined_portal_mountain
  - minecraft:stronghold
  - minecraft:mineshaft
  - minecraft:mineshaft_mesa
  - minecraft:ancient_city
  - minecraft:trial_chambers
  - minecraft:trail_ruins
# Water-only vanilla biomes become the land biome of a similar climate. Eroded
# badlands become badlands: its hoodoo surface extension fills void columns up
# from the world floor.
biomeRemap:
  "minecraft:ocean": "minecraft:plains"
  "minecraft:deep_ocean": "minecraft:forest"
  "minecraft:cold_ocean": "minecraft:taiga"
  "minecraft:deep_cold_ocean": "minecraft:taiga"
  "minecraft:frozen_ocean": "minecraft:snowy_plains"
  "minecraft:deep_frozen_ocean": "minecraft:snowy_taiga"
  "minecraft:lukewarm_ocean": "minecraft:savanna"
  "minecraft:deep_lukewarm_ocean": "minecraft:savanna"
  "minecraft:warm_ocean": "minecraft:desert"
  "minecraft:river": "minecraft:plains"
  "minecraft:frozen_river": "minecraft:snowy_plains"
  "minecraft:beach": "minecraft:plains"
  "minecraft:snowy_beach": "minecraft:snowy_plains"
  "minecraft:stony_shore": "minecraft:windswept_hills"
  "minecraft:eroded_badlands": "minecraft:badlands"
# Ores whose vanilla height bands lie below the islands, placed into island
# stone by Beta terrain y (islands span Beta y 16-88, so low y is an island's
# core) and never in the top 4 blocks of a column. Starts in the void place
# nothing. Rates match what vanilla placed in the same islands sunk into its
# deep band (verticalOffset -40): about 95 diamond, 180 redstone, 260 lapis and
# 210 gold ore per 100 chunks.
ores:
  - block: minecraft:diamond_ore
    attempts: 2
    size: 5
    minY: 16
    maxY: 44
  - block: minecraft:redstone_ore
    attempts: 3
    size: 6
    minY: 16
    maxY: 52
  - block: minecraft:lapis_ore
    attempts: 4
    size: 7
    minY: 16
    maxY: 64
  - block: minecraft:gold_ore
    attempts: 3
    size: 8
    minY: 16
    maxY: 56
