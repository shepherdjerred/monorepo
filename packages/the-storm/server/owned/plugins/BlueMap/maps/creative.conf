# BlueMap map for the creative plot world, the recovered 2016 snapshot. Owned by
# the repository: plugins/BlueMap/maps is an owned root, so the image replaces
# this file on every boot and removes maps it does not ship. Keys and defaults
# follow BlueMap's generated map.conf.
# Converted 1.8 chunks carry present but zeroed light data: render them
# without waiting for light, fully ambient-lit.
world: "world"
dimension: "minecraft:creative"
name: "Creative"
sorting: 6
start-pos: { x: 1280, z: -768 }
sky-color: "#7dabff"
void-color: "#000000"
sky-light: 1
ambient-light: 1
remove-caves-below-y: 55
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
# Matches the square border in plugins/TheStorm/creative.yml. BlueMap deletes
# tiles outside a changed mask.
render-mask: [
  { min-x: -3072, max-x: 5631, min-z: -5120, max-z: 3583 }
]
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: true
marker-sets: {}
