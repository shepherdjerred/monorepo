name: MCBridge
version: "${version}"
main: com.shepherdjerred.mcbridge.McBridgePlugin
api-version: "26.2"
description: HTTP bridge for the mc-harness agent tooling
authors: [ShepherdJerred]
dependencies:
  server:
    # Every /v1/we route and snapshots run through the WorldEdit API.
    WorldEdit:
      load: BEFORE
      required: true
      join-classpath: true
    # /v1/actors drives Citizens player NPCs; without Citizens those routes
    # answer `unsupported` and the capability is absent from /v1/info.
    Citizens:
      load: BEFORE
      required: false
      join-classpath: true
