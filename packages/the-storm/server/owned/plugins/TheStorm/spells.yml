# Owned by the repository; the plugin never writes it. Parsed strictly: every
# spell must be present with every key, unknown keys are errors, and every
# material, particle, sound, entity type and vanilla item model is checked
# against the server at enable.
#
# Spells are items. `/spells bind <spell>` gives a reusable focus for a spell
# you know (Spellcaster tier from the tracks module; quest-only spells also
# need thestorm.spells.learned.<id>). Right-click to cast; a focus cast
# consumes its reagents. Administrators hand out single-use scrolls with
# `/spells scroll <spell> <player> [amount]`: anyone can read one, and the
# scroll is the cost.
#
# tier: Spellcaster level I..V (1..5) a focus needs.
# learned: quest-only; also needs thestorm.spells.learned.<id>.
# reagents: material name -> amount consumed per focus cast.
# cooldownSeconds / cooldownGroup: spells in one group share one cooldown and
#   one native cooldown overlay on their items.
# look.model: the item_model. Vanilla models stand in until the server
#   resource pack ships thestorm:spell/<id> models.
# fx: a data-free particle name and a sound event key.
# settings: ranges and radii in blocks, durations in seconds (Dawn and Dusk:
#   minutes), damage in half-hearts, velocities in blocks per tick.

label: Spells

scroll:
  model: minecraft:paper
  readSeconds: 1.2
  sound: item.book.page_turn
  maxStack: 16

# No spell ever affects these.
immuneEntities: [ENDER_DRAGON, WITHER, WARDEN, ELDER_GUARDIAN]

