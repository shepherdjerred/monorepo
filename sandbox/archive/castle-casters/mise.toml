[tools]
maven = "3.9.14"

[tasks.build]
description = "Compile, test, and assemble the original Java game"
run = "mvn package"

[tasks.test]
description = "Rules, AI, and real socket tests"
run = "mvn test"

[tasks.play]
description = "Launch the original desktop game"
run = "bun tools/desktop.ts --run"

[tasks.acceptance]
description = "Drive native windows and capture framebuffer evidence"
run = "bun tools/harness.ts"

[tasks.desktop]
description = "Build a desktop ZIP with bundled Java on its target OS"
run = "bun tools/desktop.ts"
