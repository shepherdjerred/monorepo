# Owned by the repository; the plugin never writes it. A missing or unknown key
# stops the towns module.
#
# Worlds are named as the server names them (level-name in server.properties).

claims:
  # Worlds towns may claim land in.
  worlds: [world]
  # Chunks that must separate one town's claims from another's, on both axes.
  buffer: 2
  # The most chunks a town may hold: `base`, plus the bonus for its owner's
  # Governor level (one entry each for Governor I to V, never falling). The
  # owner's level is the one last seen while they were online.
  #
  #   Governor:   -   I   II  III  IV   V
  #   chunks:    16  24   32   48  64  80
  limits:
    base: 16
    governorBonus: [8, 16, 32, 48, 64]
  # Flags a new claim starts with; every flag not listed is off. Server rule:
  # PvP is on in new claims (towns may turn it off with /claim flag pvp false);
  # spawn stays PvP-off and the wilderness PvP-on. Flags: PVP, EXPLOSIONS,
  # FIRE_SPREAD, MOB_GRIEFING, PUBLIC_BUILD, PUBLIC_SWITCHES, PUBLIC_ENTITIES.
  # There is no container flag: anyone may open an unlocked container anywhere,
  # and /lock protects the rest.
  defaultFlags: [PVP]

membership:
  # How long an invitation may be accepted. Invitations are kept in memory, so
  # a restart withdraws them.
  inviteExpiryMinutes: 1440
  # How long an owner has to confirm handing their town over.
  transferConfirmSeconds: 60

locks:
  # The most locks one player may hold; a double chest counts once.
  maxPerPlayer: 64
  # Lock newly placed containers for their placer; /unlock makes one public.
  autoLockOnPlace: true

pvp:
  # How long after changing their own PvP (/pvp on|off) a player must wait to
  # change it again (168 hours is one week).
  toggleCooldownHours: 168
  # Damage between players prevents either player changing their switch briefly.
  combatLockSeconds: 30

# How long before a player is told about the same refusal again.
denialCooldownMillis: 2000

# How far some wide-reaching griefs are kept from land a player has no say over
# (other towns' claims and admin regions).
grief:
  # Chunks, on both axes, within which a player may not build a wither.
  witherBufferChunks: 8
  # Blocks from a raid's centre within which such land stops the raid.
  raidRadiusBlocks: 64
  # Ticks a dropped item still counts as its thrower's (5 seconds); after that
  # anyone may have moved it, so it counts as coming from where it was dropped.
  thrownItemMemoryTicks: 100

# Admin regions. Nobody can claim a chunk a region overlaps. Players may only
# do what `allow` lists (staff with thestorm.towns.bypass may do anything but
# fight); explosions, fire and mob griefing never change a region, and nothing
# flows or is pushed into it from outside. Where regions overlap, the one
# listed first wins, so list small exceptions before large regions.
#
# Actions: BUILD, BREAK, INTERACT, OPEN_CONTAINER, USE_REDSTONE, DAMAGE_ENTITY,
# INTERACT_ENTITY, PLACE_ENTITY, ATTACK_PLAYER, TELEPORT_INTO, SET_HOME.
# Subjects: DOOR, TRAPDOOR, FENCE_GATE, BUTTON, LEVER, PRESSURE_PLATE,
# TRIPWIRE, BELL, BED, RESPAWN_ANCHOR, ANVIL, CONTAINER, LECTERN, SIGN, CAKE,
# REDSTONE_COMPONENT, FARMLAND, CREAKING_HEART, BLOCK, PLAYER, VEHICLE, ANIMAL,
# VILLAGER, ITEM_FRAME, ARMOR_STAND, ENTITY, ENDER_PEARL, CHORUS_FRUIT,
# LOCATION, or ANY on its own for all of them.
#
# `mobSpawns` says which creature spawns a region lets through: `limited: false`
# lets every spawn (then `allow` must be empty); `limited: true` lets only the
# spawn reasons in `allow`.
regions:
  # Spawn around the windmill. PLACEHOLDER coordinates: replace with the real
  # chunk range around the windmill before the module is switched on.
  - id: spawn
    name: Spawn
    areas:
      chunks:
        - world: world
          from: { x: -4, z: -4 }
          to: { x: 3, z: 3 }
      cuboids: []
    allow:
      - action: INTERACT
        subjects:
          - DOOR
          - TRAPDOOR
          - FENCE_GATE
          - BUTTON
          - LEVER
          - PRESSURE_PLATE
          - TRIPWIRE
          - BELL
      - action: INTERACT_ENTITY
        subjects: [VILLAGER, VEHICLE]
      - action: TELEPORT_INTO
        subjects: [LOCATION]
    # Creatures spawn at spawn as anywhere else.
    mobSpawns:
      limited: false
      allow: []
  # The Mob Arena. PLACEHOLDER coordinates: replace with the arena's real box.
  - id: arena
    name: Arena
    areas:
      chunks: []
      cuboids:
        - world: world
          from: { x: 512, y: -64, z: 512 }
          to: { x: 575, y: 320, z: 575 }
    allow:
      - action: INTERACT
        subjects: [DOOR, TRAPDOOR, FENCE_GATE, BUTTON, LEVER, PRESSURE_PLATE]
      - action: TELEPORT_INTO
        subjects: [LOCATION]
      # The creaking boss is beaten by breaking its creaking heart; every other
      # block stays unbreakable.
      - action: BREAK
        subjects: [CREAKING_HEART]
    # Only the arena's own waves and bosses (spawned by the arena module with
    # reason CUSTOM), what they bring with them (evoker vexes, zombie
    # reinforcements, split slimes, jockeys and mounts) and staff summons
    # appear inside; nothing wanders in. Reasons are Paper's
    # CreatureSpawnEvent.SpawnReason names.
    mobSpawns:
      limited: true
      allow:
        [CUSTOM, COMMAND, SPELL, REINFORCEMENTS, SLIME_SPLIT, JOCKEY, MOUNT]
