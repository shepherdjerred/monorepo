# Mob Arena: the rules every arena shares. Owned by the repository; the plugin
# never writes it. Every key is required, unknown keys are errors, durations are
# ISO-8601 (PT10S, PT3M).
#
# Arenas live in arena/arenas/<id>.yml, classes in arena/classes.yml and the
# 72-wave table in arena/waves.yml.
#
# Tuned for a small server (two or three players online): every wave is meant
# to be clearable solo with a class kit, and extra players make the waves only
# gently harder.

# From everyone in the lobby being ready to the gates opening.
countdown: PT10S

waves:
  # The pause between the gates opening and wave 1.
  firstWave: PT5S
  # The pause between clearing a wave and the next one.
  between: PT8S
  # If a wave is not cleared this long after it starts (a mob stuck in a
  # wall), the next wave comes anyway. The final wave never times out.
  timeout: PT3M
  # The most arena mobs alive at once, riders and bosses included; the rest of
  # a wave waits its turn.
  entityCap: 40

# Mob health and damage are multipliers on vanilla values. Wave 1 with one
# fighter is the baseline; each factor grows linearly.
scaling:
  # +2% mob health per wave: x2.42 by wave 72.
  healthPerWave: 0.02
  # +1% mob damage per wave: x1.71 by wave 72.
  damagePerWave: 0.01
  # +20% mob health per extra fighter (swarms ignore this).
  healthPerExtraPlayer: 0.2
  # +40% more mobs per extra fighter.
  countPerExtraPlayer: 0.4
  # +35% boss health per extra fighter.
  bossHealthPerExtraPlayer: 0.35

# The ominous-trial ladder. An arena names its tier by number (1 is Ominous I).
# Higher tiers pay more per boss, but the per-game cap below still holds.
tiers:
  - name: Ominous I
    health: 1.0
    damage: 1.0
    count: 1.0
    reward: 1.0
  - name: Ominous II
    health: 1.15
    damage: 1.1
    count: 1.1
    reward: 1.2
  - name: Ominous III
    health: 1.3
    damage: 1.2
    count: 1.2
    reward: 1.4
  - name: Ominous IV
    health: 1.5
    damage: 1.35
    count: 1.3
    reward: 1.7
  - name: Ominous V
    health: 1.75
    damage: 1.5
    count: 1.4
    reward: 2.0

rewards:
  # As in 2015: crystals from wave 30 on, at each cleared boss wave, at most
  # 750 per player per game. Boss waves 30, 40, 50, 60, 70 and 72 at 125 each
  # make exactly 750 on Ominous I, so a solo player who clears every wave
  # earns the full cap.
  firstWave: 30
  perBossWave: 125
  capPerGame: 750
  # Vault-style bonus: clearing a milestone wave opens a vault for each fighter
  # still standing, once per player per milestone per day (across every
  # arena). The loot is handed out after they leave the arena.
  vault:
    zone: UTC
    milestones:
      - wave: 10
        loot:
          rolls: 2
