org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.java.installations.auto-download=false
# CI runs this build alongside other packages in one pod; keep the footprint small.
org.gradle.jvmargs=-Xmx1g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
# Compile build-logic's Kotlin inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
# The plugin version is static so rebuilding unchanged sources yields an identical jar.
version=0.1.0
