# Owned by the repository; the plugin never writes it. A missing or unknown key
# stops the towns module.
#
# Worlds are named as the server names them (level-name in server.properties).

claims:
  # Worlds towns may claim land in: every permanent survival world.
  worlds: [world, frontier, map2, skylands]
  # Chunks that must separate one town's claims from another's, on both axes.
  buffer: 2
  # The most chunks a town may hold: `base`, plus the bonus for its owner's
  # Governor level (one entry each for Governor I to V, never falling). The
  # owner's level is the one last seen while they were online.
  #
  #   Governor:   -   I   II  III  IV   V
  #   chunks:    16  24   32   48  64  80
  limits:
    base: 16
    governorBonus: [8, 16, 32, 48, 64]
  # Flags a new claim starts with; every flag not listed is off. Server rule:
  # PvP is on in new claims (towns may turn it off with /claim flag pvp false);
  # spawn stays PvP-off and the wilderness PvP-on. Flags: PVP, EXPLOSIONS,
  # FIRE_SPREAD, MOB_GRIEFING, PUBLIC_BUILD, PUBLIC_SWITCHES, PUBLIC_ENTITIES.
  # There is no container flag: unlocked containers in claims follow claim trust;
  # locks grant explicit access to their owners and trusted players.
  defaultFlags: [PVP]

camps:
  chunks: 16
  members: 8
  idleDays: 90
  warnDays: 14
  settleBlocks: 24
  settleStayMinutes: 5

membership:
  # How long an invitation may be accepted. Invitations are kept in memory, so
  # a restart withdraws them.
  inviteExpiryMinutes: 1440
  # How long an owner has to confirm handing their town over.
  transferConfirmSeconds: 60

locks:
  # The most locks one player may hold; a double chest counts once.
  maxPerPlayer: 1024
  # Lock newly placed containers, doors, trapdoors, fence gates, item frames
  # and armor stands for their placer. Signs can be locked with /lock and are
  # not locked just by placing them. /unlock removes the lock. /lock public, password, donation, supply
  # and display change who else may use a lock. /lock hopper, hopperin,
  # hopperout, golem, magnet, autoclose, explosions and exempt turn those
  # flags on or off.
  autoLockOnPlace: true
  # Seconds before an iron door, trapdoor or gate closes itself, and before
  # any door closes when its autoclose flag is on.
  autocloseSeconds: 2
  # Crystals charged for a new lock. Zero charges nothing.
  lockCost: 0
  # Blocks from which a magnet lock pulls dropped items.
  magnetRadius: 3
  # Days a lock may go unopened before /lock admin expire can remove it.
  # Exempt locks are kept.
  expireDays: 30

pvp:
  # How long after changing their own PvP (/pvp on|off) a player must wait to
  # change it again (168 hours is one week).
  toggleCooldownHours: 168
  # Damage between players prevents either player changing their switch briefly.
  combatLockSeconds: 30

# How long before a player is told about the same refusal again.
denialCooldownMillis: 2000

# How far some wide-reaching griefs are kept from land a player has no say over
# (other towns' claims and admin regions).
grief:
  # Chunks, on both axes, within which a player may not build a wither.
  witherBufferChunks: 8
  # Blocks from a raid's centre within which such land stops the raid.
  raidRadiusBlocks: 64
  # Ticks a dropped item still counts as its thrower's (5 seconds); after that
  # anyone may have moved it, so it counts as coming from where it was dropped.
  thrownItemMemoryTicks: 100

# Existing Spawn Town, windmill and Colosseum. PvP and construction are denied
# in these admin regions; doors, NPCs and gameplay teleports remain usable.
# Every loaded world also receives full-height protection around its current
# spawn (and the End arrival platform). Recomputed on world load/spawn changes.
spawnRadiusBlocks: 32
regions:
  - id: spawn
    name: Spawn Town
    profile: SAFE
    areas:
      chunks: []
      cuboids:
        - world: world
          from: { x: -128, y: -64, z: -272 }
          to: { x: 163, y: 319, z: 128 }
        - world: world
          from: { x: 164, y: -64, z: -272 }
          to: { x: 191, y: 319, z: -61 }
    allow:
      - action: INTERACT
        subjects:
          [
            DOOR,
            TRAPDOOR,
            FENCE_GATE,
            BUTTON,
            LEVER,
            PRESSURE_PLATE,
            TRIPWIRE,
            BELL,
          ]
      - action: INTERACT_ENTITY
        subjects: [VILLAGER, VEHICLE]
      - action: OPEN_CONTAINER
        subjects: [CONTAINER]
      - action: TELEPORT_INTO
        subjects: [LOCATION]
    mobSpawns:
      limited: true
      allow: [CUSTOM, COMMAND]
  - id: arena
    name: The Colosseum
    profile: ARENA
    areas:
      chunks: []
      cuboids:
        - world: world
          from: { x: 164, y: -64, z: -60 }
          to: { x: 290, y: 319, z: 64 }
    allow:
      - action: INTERACT
        subjects: [DOOR, TRAPDOOR, FENCE_GATE, BUTTON, LEVER, PRESSURE_PLATE]
      - action: TELEPORT_INTO
        subjects: [LOCATION]
      - action: BREAK
        subjects: [CREAKING_HEART]
      - action: OPEN_CONTAINER
        subjects: [CONTAINER]
    mobSpawns:
      limited: true
      allow:
        [CUSTOM, COMMAND, SPELL, REINFORCEMENTS, SLIME_SPLIT, JOCKEY, MOUNT]
  - id: settlement
    name: The Storm Settlement
    profile: ARENA
    areas:
      chunks: []
      cuboids:
        - world: settlement
          from: { x: -82, y: -64, z: -80 }
          to: { x: 79, y: 319, z: 79 }
    allow:
      - action: INTERACT
        subjects: [DOOR, TRAPDOOR, FENCE_GATE, BUTTON, LEVER, PRESSURE_PLATE]
      - action: TELEPORT_INTO
        subjects: [LOCATION]
      - action: OPEN_CONTAINER
        subjects: [CONTAINER]
      - action: BREAK
        subjects: [CREAKING_HEART]
    mobSpawns:
      limited: true
      allow:
        [CUSTOM, COMMAND, SPELL, REINFORCEMENTS, SLIME_SPLIT, JOCKEY, MOUNT]
  - id: rustworks
    name: Rustworks
    profile: ARENA
    areas:
      chunks: []
      cuboids:
        - world: rustworks
          from: { x: -98, y: -64, z: -100 }
          to: { x: 95, y: 319, z: 99 }
    allow:
      - action: INTERACT
        subjects: [DOOR, TRAPDOOR, FENCE_GATE, BUTTON, LEVER, PRESSURE_PLATE]
      - action: TELEPORT_INTO
        subjects: [LOCATION]
      - action: OPEN_CONTAINER
        subjects: [CONTAINER]
      - action: BREAK
        subjects: [CREAKING_HEART]
    mobSpawns:
      limited: true
      allow:
        [CUSTOM, COMMAND, SPELL, REINFORCEMENTS, SLIME_SPLIT, JOCKEY, MOUNT]

