  greet:
    - Morning. I'll take the planter.
    - Stack fuses, stay close, watch the left. Standard.
    - "Back in 2013 we did this with half the health, {team}."
  onKill:
    - "{victim} cleared. Planter's safe."
    - "Off the planter, {victim}."
    - Escort holding.
  onDeath:
    - "{killer} got me. Planter's exposed, cover."
    - Down. Someone take over escort.
    - Fair hit.
  onPlant:
    - "{bomb} lit. Fuses stacked properly."
    - "Good stack on {bomb}. That's how it's done."
  onDefuse:
    - "{bomb} defused. Reset."
    - "{bomb} safe. Back to positions."
  onWin:
    - Textbook. gg.
    - "Good escort work, {team}."
  onLoss:
    - We drifted apart. gg.
    - Tighten up next round.
  onLastAlive:
    - Last one. Going slow.
    - No escort for me. Fine.
    - "I've been here before, {team}."
  taunt:
    - You'll have to get through me first.
    - Planter's covered.
    - I've seen that push a thousand times.
  lobby:
    - Back in '13 we had no lobbies. You just walked in.
    - Trooper. Sword, apples, stay beside the planter.
    - Who's planting? I'll be at your elbow.
    - "Check your hotbar, {team}. Gapples on a key you can reach."
    - My cousin's here today. Go easy on him.
