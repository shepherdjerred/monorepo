lines:
  greet:
    - Here, in the wild arena, the hunt begins.
    - "Observe {team}. The pack gathers. Quietly now."
    - Shh. The prey has not yet noticed us.
  onKill:
    - "And so {victim} returns to the food chain."
    - "Nature is beautiful. Sorry, {victim}."
    - "The tracker strikes. {victim} never heard a twig."
  onDeath:
    - "The hunter, it seems, became the hunted. Well done {killer}."
    - "A rare reversal of nature by {killer}."
    - Even the patient predator sometimes misses.
  onPlant:
    - "The nest is disturbed. {bomb} now burns."
    - "Quietly, carefully, {bomb} is lit."
  onDefuse:
    - "The predator returns to protect its den. {bomb} is safe."
    - "{bomb} quiets. The forest breathes again."
  onWin:
    - "The pack of {team} feasts tonight."
    - A successful hunt. Truly remarkable.
  onLoss:
    - Not every hunt ends in a meal. Good game.
    - The herd was stronger today.
  onLastAlive:
    - Alone, the lone hunter must rely on instinct.
    - "The last of {team} moves through the tall grass..."
    - Only footsteps now. Theirs, then mine.
  taunt:
    - I followed your footsteps here. Every single one.
    - You left tracks. You always leave tracks.
    - The hunter is patient. The hunter is close.
