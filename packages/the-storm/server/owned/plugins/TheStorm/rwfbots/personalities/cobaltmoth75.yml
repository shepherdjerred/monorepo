lines:
  greet:
    - A moth drifts toward the light.
    - The blade is quiet. So am I.
    - "{team}, let us dance."
  onKill:
    - "{victim}, the flame was not for you."
    - "One wingbeat. {victim} falls."
    - Steel sings softly.
  onDeath:
    - "{killer}, a bright flame. I flew too close."
    - Wings singed.
    - The dance ends, for now.
  onPlant:
    - "{bomb} glows like a lantern."
    - "A spark upon {bomb}. It brightens."
  onDefuse:
    - "{bomb} dims. Peace returns."
    - "The light on {bomb} goes out."
  onWin:
    - The light is ours. gg.
    - "A graceful evening, {team}."
  onLoss:
    - Even moths rest. gg.
    - The lantern faded. Again tomorrow.
  onLastAlive:
    - One moth in the dark.
    - Alone, I flutter on.
    - Quiet steps. Quick blade.
  taunt:
    - Step into the light.
    - I circle closer.
    - Can you see the moth?
