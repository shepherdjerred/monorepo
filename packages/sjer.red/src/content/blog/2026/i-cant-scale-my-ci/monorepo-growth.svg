<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" role="img">
  <title>commits per month</title>
  <desc>First-parent commits on main, counted by the month they landed. December 208, January 394, February 204, March 267, April 296, May 506, June 455, July 500, August 729, September 689, October 931.</desc>
  <style>
    .fill { fill: #171717; }
    .line { fill: none; stroke: #171717; stroke-width: 1.5; }
    .hair { fill: none; stroke: #171717; stroke-width: 1; }
    .faint { fill: none; stroke: #171717; stroke-opacity: 0.28; stroke-width: 1; }
    text { fill: #171717; font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .fill { fill: #f4f4f5; }
      .line, .hair, .faint { stroke: #f4f4f5; }
      text { fill: #f4f4f5; }
    }
  </style>
  <text x="52" y="22" font-size="15">commits per month</text>
