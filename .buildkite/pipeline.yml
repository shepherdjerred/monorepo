      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter homelab --production
      (
        export TF_PLUGIN_CACHE_DIR=/buildkite/tofu-plugin-cache
        flock -x 9
        bun --no-install packages/homelab/scripts/tofu-stack.ts posthog plan
        bun --no-install packages/homelab/scripts/tofu-stack.ts posthog apply
      ) 9>/buildkite/tofu-plugin-cache/.lock
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_posthog_tofu_apply_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: tofu-posthog

  - label: ":argo: sync + wait"
    key: argocd-sync
    timeout_in_minutes: 60
    if: build.branch == pipeline.default_branch
    depends_on: [homelab-release-admission, images, helm-push, tofu-apply-arr]
    concurrency: 1
    concurrency_group: monorepo/homelab-release
    concurrency_method: ordered
    command: |
      release_admission=$$(bun --no-install .buildkite/scripts/homelab-release-admission.ts consume)
      if [ "$$release_admission" = "superseded" ]; then exit 0; fi
      if [ "$$release_admission" != "admitted" ]; then
        echo "invalid homelab release admission outcome: $$release_admission"
        exit 1
      fi
      image_digests=$$(bun --no-install .buildkite/scripts/read-buildkite-handoff.ts image-digests)
      release_requested=false
      if bun --no-install .buildkite/scripts/ci-changed.ts helm; then release_requested=true; fi
      if bun --no-install .buildkite/scripts/ci-changed.ts argocd; then release_requested=true; fi
      if [ "$$image_digests" != "{}" ]; then release_requested=true; fi
      if ! $$release_requested; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter homelab --filter '@homelab/cdk8s' --production
      # The CI secret uses the argocd CLI's canonical ARGOCD_AUTH_TOKEN name;
      # argocd.ts reads ARGOCD_TOKEN (build 5648).
      export ARGOCD_TOKEN="$$ARGOCD_AUTH_TOKEN"
      buildkite-agent artifact download "argocd-release-expected.json" . --step helm-push
      apps_revision=$$(jq -er '.[] | select(.name == "apps") | .revision' argocd-release-expected.json)
      # One identity-bound process stages root prerequisites, reconciles exact
      # child revisions, restores/prunes the root, and owns scoped health.
      bun --no-install packages/homelab/scripts/argocd.ts release-root apps argocd-release-expected.json --revision "$$apps_revision" --request-id "$BUILDKITE_BUILD_ID" --timeout 300
      buildkite-agent artifact upload "homelab-release-result.json"
      buildkite-agent annotate --context homelab-release-result --style success < homelab-release-result.json
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: argocd-sync
          podSpecPatch:
            <<: *pod_light_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_light_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_argocd

  # Build each Scout flavor exactly once, bind both immutable archives to the
  # exact backend digest that Argo just made healthy, then deploy beta from
  # that archived state. This lane is separate from generic static sites so a
  # non-Scout image pin update cannot manufacture a Scout release.
  - label: ":test_tube: Scout release phase 1 — archive + beta deploy"
    key: scout-beta-release
    timeout_in_minutes: 30
    if: build.branch == pipeline.default_branch
    depends_on: [images, argocd-sync]
    concurrency: 1
    concurrency_group: monorepo/site-deploys
    command: |
      scout_candidate=$$(bun --no-install .buildkite/scripts/read-buildkite-handoff.ts image-digests |
        jq -r '."shepherdjerred/scout-for-lol/beta" // empty')
      scout_source_changed=false
      if bun --no-install .buildkite/scripts/ci-changed.ts site-scout; then
        scout_source_changed=true
      fi
      if [ -z "$$scout_candidate" ] && ! $$scout_source_changed; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      # The release script owns a workspace dependency on the shared catalog.
      .buildkite/scripts/bun-install.sh --frozen-lockfile \
        --filter '@shepherdjerred/root-scripts' \
        --filter '@scout-for-lol/frontend' \
        --filter '@scout-for-lol/app' \
        --filter '@scout-for-lol/docs-site' \
        --filter '@scout-for-lol/design-system' \
        --filter scout-for-lol \
        --filter astro-opengraph-images \
        --filter '@shepherdjerred/llm-models' \
        --filter '@shepherdjerred/glitter-context'
      bun --no-install run --cwd packages/llm-models build
      bun --no-install run --cwd packages/astro-opengraph-images build
      bun --no-install run --cwd packages/glitter-context build
      export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_DEPLOY_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_DEPLOY_SECRET_ACCESS_KEY"
      if [ -n "$$scout_candidate" ]; then
        scout_backend=$$(bun --no-install scripts/scout-site-release.ts resolve-backend-digest --candidate-digest "$$scout_candidate")
      else
        scout_backend=$$(bun --no-install scripts/scout-site-release.ts resolve-backend-digest)
      fi
      bun --no-install scripts/scout-site-release.ts prepare-state \
        --build-number "$BUILDKITE_BUILD_NUMBER" \
        --backend-digest "$$scout_backend" \
        --output .scout-release/state.json
      scout_state=$$(<.scout-release/state.json)
      bun --no-install scripts/scout-site-release.ts archive --state "$$scout_state"
      buildkite-agent meta-data set scout-release-state "$$scout_state"
      bun --no-install scripts/scout-site-release.ts deploy-beta --state "$$scout_state"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: scout-beta-release
          podSpecPatch:
            <<: *pod_light_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_light_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_seaweedfs_deploy_access
                  - *grant_seaweedfs_deploy_secret

  # Mint a promotable tag only after the exact beta release is deployed and
  # verified. The immutable state binds tag, backend digest, both site archives,
  # source commit, and release inputs.
  - label: ":label: Scout release phase 2 — immutable tag promotion"
    key: scout-tag-release
    timeout_in_minutes: 30
    if: build.branch == pipeline.default_branch
    depends_on: scout-beta-release
    command: |
      scout_state=$$(buildkite-agent meta-data get scout-release-state --default "")
      if [ -z "$$scout_state" ]; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter '@shepherdjerred/root-scripts' --production
      export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_DEPLOY_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_DEPLOY_SECRET_ACCESS_KEY"
      printf '%s' "$$GITHUB_PACKAGES_TOKEN" | docker login ghcr.io -u shepherdjerred --password-stdin
      bun --no-install scripts/scout-site-release.ts tag-release --state "$$scout_state"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: scout-tag-release
          podSpecPatch:
            <<: *pod_light_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_light_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_github_packages
                  - *grant_seaweedfs_deploy_access
                  - *grant_seaweedfs_deploy_secret

  # Reconcile the prod scout site to its versions.ts pin. Usually a no-op
  # (bucket marker == pin); after a promotion merge it syncs the archived
  # artifact for the pinned version into the prod bucket. Ordered AFTER
  # argocd-sync on purpose: the promoted backend deploys first, so the
  # transient mid-promotion mix is old-frontend/new-backend — the safe
  # direction (the reverse skew is what crashed the prod SPA). Shares the
  # site-deploys concurrency group so it never races a beta sync.
  - label: ":rocket: Scout release phase 3 — production pin reconcile"
    key: scout-prod-reconcile
    timeout_in_minutes: 30
    if: build.branch == pipeline.default_branch
    depends_on: [argocd-sync, scout-beta-release]
    concurrency: 1
    concurrency_group: monorepo/site-deploys
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts scout-reconcile; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter '@shepherdjerred/root-scripts' --production
      export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_DEPLOY_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_DEPLOY_SECRET_ACCESS_KEY"
      prod_pin=$$(bun --no-install scripts/scout-site-release.ts resolve-prod-pin)
      bun --no-install scripts/scout-site-release.ts reconcile-prod-pin --prod-pin "$$prod_pin"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: scout-prod-reconcile
          podSpecPatch:
            <<: *pod_light_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_light_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_seaweedfs_deploy_access
                  - *grant_seaweedfs_deploy_secret

  - label: ":terraform: OpenTofu apply — Cloudflare after tunnel gate"
    key: tofu-apply-cloudflare
    timeout_in_minutes: 60
    if: build.branch == pipeline.default_branch
    depends_on: [homelab-release-admission, argocd-sync]
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/tofu-cloudflare
    # Fail-closed: the SeaweedFS TunnelBinding finalizer must complete before
    # the Cloudflare DNS tunnel route is removed (same gate as the old CI).
    command: |
      release_admission=$$(bun --no-install .buildkite/scripts/homelab-release-admission.ts consume)
      if [ "$$release_admission" = "superseded" ]; then exit 0; fi
      if [ "$$release_admission" != "admitted" ]; then
        echo "invalid homelab release admission outcome: $$release_admission"
        exit 1
      fi
      if ! bun --no-install .buildkite/scripts/ci-changed.ts tofu; then
        if ! bun --no-install .buildkite/scripts/ci-changed.ts argocd; then exit 0; fi
      fi
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter '@homelab/cdk8s' --filter homelab --production
      # Same ARGOCD_AUTH_TOKEN → ARGOCD_TOKEN mapping as the sync step.
      export ARGOCD_TOKEN="$$ARGOCD_AUTH_TOKEN"
      bun --no-install packages/homelab/scripts/argocd.ts wait-deletion apps --group networking.cfargotunnel.com --version v1alpha1 --kind TunnelBinding --namespace seaweedfs --timeout 120
      (
        export TF_PLUGIN_CACHE_DIR=/buildkite/tofu-plugin-cache
        flock -x 9
        bun --no-install packages/homelab/scripts/tofu-stack.ts cloudflare apply
      ) 9>/buildkite/tofu-plugin-cache/.lock
    # Safe to retry: tofu re-plans from state, and the scripts only exit 34
    # (the retryable code) on classified transient failures.
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_tofu_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: tofu-apply-cloudflare
          podSpecPatch:
            <<: *pod_tofu_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_tofu_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_argocd
                  - *grant_seaweedfs_state_access
                  - *grant_seaweedfs_state_secret
                  - *grant_cloudflare_account
                  - *grant_cloudflare_token

  # ── Main-only: release automation ─────────────────────────────────────────
  # Gates on verify only: release-please consumes no image or site artifact
  # (build 5644: gating on [images, sites] parked it behind the 52-min images
  # step for no data reason). The version commit-back — which DOES consume the
  # pushed image digests — is its own step below, gated on images.
  - label: ":package: release-please"
    key: release-please
    timeout_in_minutes: 60
    if: build.branch == pipeline.default_branch
    depends_on: verify
    concurrency: 1
    concurrency_group: monorepo/release-please
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter '@shepherdjerred/root-scripts' --filter '@shepherdjerred/release-tools' --production
      bun --no-install scripts/release.ts
    # Safe to retry: release-please upserts its PR and skips already-cut
    # releases; a GitHub GraphQL 500 (build 5809) exits 34 via transient.ts.
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_release_codex_auth_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: release-please
          podSpecPatch:
            <<: *pod_release_codex_auth_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_release_codex_auth_container
                env:
                  - *env_buildkite_shell
                  - name: CODEX_HOME
                    value: /buildkite/codex-auth
                  - *grant_github_download
                  - *grant_github_app_id
                  - *grant_github_app_installation_id
                  - *grant_github_app_private_key
                  - *grant_claude

  # Version commit-back: rewrites versions.ts tag@digest pins from the digests
  # the images step recorded in build meta-data, and opens the auto-merge bump
  # PR. (The replatform's bare `bun scripts/update-versions.ts` invocation was
  # a stub — no digest plumbing existed, and the step exited 1 on every build
  # that reached it.) Digest-unchanged entries are skipped, so a no-change
  # merge redeploys nothing.
  - label: ":package: version commit-back"
    key: version-commit-back
    timeout_in_minutes: 60
    if: build.branch == pipeline.default_branch
    depends_on: images
    cancel_on_build_failing: true
    concurrency: 1
    # Serialize commit-back with image publication. A later image build must
    # not evaluate converged pins from its stale checkout while an earlier
    # release's candidate ramp is being committed.
    concurrency_group: monorepo/image-push
    concurrency_method: ordered
    command: |
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter '@shepherdjerred/root-scripts' --production
      bun --no-install scripts/update-versions.ts --commit-back --candidates "$$(bun --no-install .buildkite/scripts/read-buildkite-handoff.ts pin-candidates)"
    # Safe to retry: the bump branch is force-updated and the PR lookup is
    # find-or-create; transient gh/git failures exit 34 via transient.ts.
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: version-commit-back
          podSpecPatch:
            <<: *pod_light_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_light_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_github_app_id
                  - *grant_github_app_installation_id
                  - *grant_github_app_private_key

  # ── Toolchain image candidates ────────────────────────────────────────────
  # Candidate builds are independent. Each generated PR updates one committed
  # digest, and PR CI consumes that digest before auto-merge.
  - label: ":docker: ci-base candidate"
    key: ci-base-refresh
    timeout_in_minutes: 60
    if: build.branch == pipeline.default_branch
    depends_on: verify
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/ci-base-refresh
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts ci-base; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      bun --no-install .buildkite/scripts/buildkit-env.ts
      bun --no-install .buildkite/scripts/build-ci-image.ts --image ci-base --candidate-out ci-base-candidate.json
      bun --no-install .buildkite/scripts/update-ci-image-pin.ts --candidate ci-base-candidate.json
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_buildkit_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: ci-base-refresh
          podSpecPatch:
            <<: *pod_buildkit_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_buildkit_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_github_packages
                  - *grant_github_app_id
                  - *grant_github_app_installation_id
                  - *grant_github_app_private_key

  - label: ":performing_arts: ci-playwright candidate"
    key: ci-playwright-refresh
    timeout_in_minutes: 60
    if: build.branch == pipeline.default_branch
    depends_on: verify
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/ci-playwright-refresh
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts ci-playwright; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      bun --no-install .buildkite/scripts/buildkit-env.ts
      bun --no-install .buildkite/scripts/build-ci-image.ts --image ci-playwright --candidate-out ci-playwright-candidate.json
      bun --no-install .buildkite/scripts/update-ci-image-pin.ts --candidate ci-playwright-candidate.json
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_buildkit_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: ci-playwright-refresh
          podSpecPatch:
            <<: *pod_buildkit_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_buildkit_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_github_packages
                  - *grant_github_app_id
                  - *grant_github_app_installation_id
                  - *grant_github_app_private_key

  # ── Main-only: build summary annotation (runs even when deploys fail) ─────
  - label: ":memo: build summary"
    key: build-summary
    timeout_in_minutes: 10
    if: build.branch == pipeline.default_branch
    depends_on:
      - verify
      - playwright-e2e-main
      - resume-build-main
      - docker-e2e-main
      - images
      - sites
      - homelab-release-admission
      - helm-push
      - tofu-apply-seaweedfs
      - tofu-apply-tailscale
      - tofu-apply-buildkite
      - tofu-apply-arr
      - tofu-apply-github
      - tofu-posthog
      - argocd-sync
      - scout-beta-release
      - publish
      - scout-tag-release
      - scout-prod-reconcile
      - tofu-apply-cloudflare
      - release-please
      - version-commit-back
      - ci-base-refresh
      - ci-playwright-refresh
    allow_dependency_failure: true
    command: bun --no-install .buildkite/scripts/annotate-build-summary.ts
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: build-summary
