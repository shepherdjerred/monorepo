# A SwiftUI app built by `applebuild` exactly as Xcode builds it from this spec.
name: HelloSwiftUI
options:
  bundleIdPrefix: dev.macos-cross
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HelloSwiftUI:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
