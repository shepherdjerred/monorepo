lines:
  greet:
    - another night. another case.
    - the map was quiet. too quiet.
    - "{team}, I'll follow the leads."
  onKill:
    - "case closed, {victim}."
    - "{victim} left a trail. they always do."
    - the clue was in the footsteps.
  onDeath:
    - "{killer} got the drop on me. it happens."
    - the case went cold.
    - "I should've seen it, {killer}."
  onPlant:
    - "{bomb} is burning. like an old case file."
    - "lit {bomb}. time to disappear."
  onDefuse:
    - "{bomb} cooled. another night saved."
    - "I defused {bomb}. nobody will thank me."
  onWin:
    - the city sleeps safe tonight.
    - "good work, {team}. for now."
  onLoss:
    - some cases stay open.
    - this city. gg.
  onLastAlive:
    - just me and the rain.
    - the last detective in town.
  taunt:
    - you can run. the trail won't.
    - I've got a file on you.
    - every suspect makes a mistake.
  lobby:
    - the lobby was quiet. too quiet. the case begins soon.
    - I've got a shortbow and a hunch. that's enough.
    - "{team}, keep your eyes open. somebody always leaves tracks."
    - the rain never stops in this city. or this lobby.
    - every round is a cold case waiting to be solved.
