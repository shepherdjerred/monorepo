# Red Warfare Search and Destroy kits, as the operator sees them. Owned by the
# repository; the plugin never writes it. The kits themselves are code
# (domain/kit/KitBook.java); this file must describe them exactly, kit for
# kit and in kit-menu order, or the module refuses to start, so a change to
# either is visible in the other. See plugin/modules/rwf/KITS.md for what each
# kit's ability does.
#
# Every kit carries the Blaze Powder "Bomb Fuse" in hotbar slot 0; a kit's
# fuseBonus (type BOMB_ARMING, BOMB_DEFUSING or BOMB_SPEED with a level, or
# null) is written on the fuse. hotbar items follow the fuse in slot order (an
# AIR item keeps a slot empty) and a kit's arrow is moved to inventory slot 9;
# armor names its slot (HELMET, CHESTPLATE, LEGGINGS, BOOTS). An item's look
# (or null) gives its name's chat colour, lore and lore colour, a glint, and a
# dye (#RRGGBB, or team for the wearer's team colour). Prices are Red Warfare
# credits; a kit is PURCHASE exactly when it has a price. tier (BASIC, MID or
# ADVANCED) follows the price and drives the weekly free rotation. icon and
# iconTint are what the kit menu and the lobby alcove show it by; summary is
# one to four lines of at most 40 characters, the alcove's label. A description
# keeps Red Warfare's lines (a literal block, one line each) and its section-sign
# colours; an empty item name is Red Warfare's bare colour title.
