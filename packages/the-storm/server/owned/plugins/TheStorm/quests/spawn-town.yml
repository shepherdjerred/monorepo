# Owned by the repository; the plugin never writes it.
# Spawn Town side quests, ported from the 2017 server (Blackvein Quests and the
# BetonQuest packs) with modern item names, the recorded bugs fixed, and
# amounts scaled so one player can finish each alone.
#
# A stage is done when all its objectives are; `next` then picks where to go
# (`complete` finishes the quest). `waiting` is what the stage's NPC says if you
# talk to them before you are done; `complete` is what they say when you are.

factions: {}
variables: {}
regions: {}
hooks: {}
templates: {}

quests:
  a-blacksmiths-task:
    name: A Blacksmith's Task
    giver: thomas
    category: side
    repeat: once
    estimatedMinutes: 45
    requirements: []
    text:
      offer: "ink:blacksmith#offer"
      accept: I would be happy to take the materials needed to make the basic weaponry. Bring them as you find them.
      decline: No problem. Please come back later!
      finish: Thanks again for your help. That should be all for now!
      summary: Thomas needs materials to forge new gear for the town guards.
      questions:
        - label: What's with all these attacks?
          answer: Recently, we have seen more bandits and hostile mobs lurking in our territory. The guards have done well to protect us, but their barracks are now filled with dull and broken weapons.
    start: gather
    stages:
      gather:
        journal: Thomas needs 32 iron ingots, 16 coal, 16 sticks, 16 string, 16 feathers, 12 gold ingots and 4 diamonds. The attacks are getting worse.
        waiting: Ahah! Bring me whatever you have; I'll take it a piece at a time.
        complete: Ahah! This is perfect!
        objectives:
          - deliver thomas 32 IRON_INGOT
          - deliver thomas 16 COAL
          - deliver thomas 16 STICK
          - deliver thomas 16 STRING
          - deliver thomas 16 FEATHER
          - deliver thomas 12 GOLD_INGOT
          - deliver thomas 4 DIAMOND
        onComplete: []
        next: [{ to: complete, when: [], label: none }]
        timeLimit: none
    onAccept: []
    rewards:
      - crystals 750
      - points 1
      - reputation townsfolk 1

