# Red Warfare Search and Destroy. Owned by the repository; the plugin never
# writes it. Every key is required, unknown keys are errors, durations are
# ISO-8601 (PT90S, PT10M).
#
# Kits live in rwf/kits.yml, maps in rwf/maps/<id>/ (map.yml + blocks.schem)
# and the lobby room players wait in before a match in rwf/lobby/.

# The world matches run in. An operator provisions it through Multiverse (a
# flat or void world is fine; the maps bring their own terrain) and it must be
# loaded before TheStorm enables. The module seals it: every other module
# leaves it alone.
world: rwf

# Where a player stands when no map places them elsewhere; once a map is
# chosen its own spectator point is used.
spectator: { x: 31.5, y: 76.0, z: 31.5, yaw: 0.0, pitch: 45.0 }

match:
  # A match counts down and starts only with at least this many humans.
  minHumans: 1
  # Fixed target when automaticSizing is false, and the default showcase
  # count. Without the rwfbots module matches are humans only.
  targetCombatants: 8
  # Ordinary play uses the map's large preset. Fixed targets remain available
  # for duel/training profiles; admin size overrides last until module restart.
  automaticSizing: true
  # The most combatants in a match. 101 (one human, 100 bots) held the bots'
  # governor at level 0 and the added tick p95 under 8 ms on the production
  # pod's 4 CPUs in the load profile (plugin/modules/rwfbots/LOAD.md);
  # nothing measured supports more.
  maxCombatants: 100
  # From enough humans to going live, as Red Warfare had it.
  countdown: PT90S
  # How long the result is shown before the map resets.
  endLinger: PT15S
  # A live match with no humans left is stopped, unpaid, after this long.
  noHumansAbort: PT30S

# The ported Red Warfare constants this build plays by. They are pinned: the
# module refuses to start if a value here disagrees with the code, so this
# file always documents the rules in force.
rules:
  fuseSeconds: 60
  craterRadius: 6
  poisonTimer: PT10M
  poisonGrace: PT1M
  attackSpeedModifier: 200.0
  steakHealth: 8.0
  hunger: false

# Paid in Red Warfare credits (the economy's rwf_credits, shown as RC), never
# crystals, and with no daily cap. Bots earn nothing. A suicide or a quit
# while the match is live forfeits the reward.
rewards:
  # Red Warfare paid 3 credits for a win and 1 for a loss (pinned).
  win: 3
  lose: 1
  # Taken instead of any pay from a player who never looked around while alive
  # in the live match, as Red Warfare did; a balance never goes below zero
  # (pinned).
  afkPenalty: 2
  # The share of a payout when every other combatant is a bot (pinned).
  botFloor: 0.25
  # Matches shorter than this pay, and charge, nobody.
  minMatchLength: PT1M

recording:
  # Every match is recorded under pseudonyms (positions, actions, results)
  # for review and bot training; players are told so on entry. Turn this off
  # to record nothing.
  enabled: true
  # Under plugins/TheStorm, as <directory>/yyyy/MM/dd/<matchId>.rwfrec.gz.
  directory: rwf-recordings
  retentionDays: 30
  # 2 GiB.
  maxBytes: 2147483648
  # The environment variable holding the pseudonym salt. Required when
  # recording is enabled; enabling fails loudly without it.
  saltEnv: RWF_RECORDING_SALT

loadtest:
  # Whether /rwf admin loadtest <n> may fill the lobby with bots. Off in
  # production.
  enabled: false

# Maps kept out of the rotation until someone fixes them, with the reason.
# They still ship under rwf/maps and are verified like every other map, but
# no match is played on them. Every id must name a map, and at least one map
# must stay in the rotation.
quarantine:
  saigon: "BOMB_UNREACHABLE: the map conversion found a bomb no team can reach"
  wonderland: "BOMB_UNREACHABLE: the map conversion found a bomb no team can reach"
