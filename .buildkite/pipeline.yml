        - "**/*.cpp"
        - "**/*.css"
        - "**/*.dart"
        - "**/*.ex"
        - "**/*.exs"
        - "**/*.h"
        - "**/*.hcl"
        - "**/*.hpp"
        - "**/*.hs"
        - "**/*.html"
        - "**/*.go"
        - "**/*.java"
        - "**/*.jl"
        - "**/*.js"
        - "**/*.json"
        - "**/*.jsonnet"
        - "**/*.jsx"
        - "**/*.kt"
        - "**/*.kts"
        - "**/*.lua"
        - "**/*.lisp"
        - "**/*.m"
        - "**/*.ml"
        - "**/*.mli"
        - "**/*.mjs"
        - "**/*.mm"
        - "**/*.php"
        - "**/*.py"
        - "**/*.proto"
        - "**/*.r"
        - "**/*.rb"
        - "**/*.rs"
        - "**/*.scss"
        - "**/*.scala"
        - "**/*.scm"
        - "**/*.sh"
        - "**/*.sol"
        - "**/*.svelte"
        - "**/*.sql"
        - "**/*.swift"
        - "**/*.tf"
        - "**/*.ts"
        - "**/*.cts"
        - "**/*.mts"
        - "**/*.tsx"
        - "**/*.vue"
        - "**/*.yaml"
        - "**/*.yml"
    cancel_on_build_failing: true
    # Excludes mirror the .gitleaks.toml allowlist: these paths hold values
    # already triaged as non-sensitive (legacy/undeployed sandbox archive,
    # a disabled Minecraft management-server secret, a public Firebase web
    # apiKey). semgrep's generic-secret rule would otherwise re-print those
    # values into the log on every build. Real code stays fully scanned.
    command: |
      if ! base=$(git merge-base origin/main HEAD); then
        echo "semgrep could not resolve the PR merge-base" >&2
        exit 2
      fi
      semgrep scan --config auto --error \
        --baseline-commit "$$base" \
        --exclude sandbox \
        --exclude server.properties \
        --exclude fetcher.ts \
        .
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: semgrep
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            containers:
              - *checkout_container
              # The shell is taken from the AGENT container's registration
              # env (container-0-level BUILDKITE_SHELL is ignored — the
              # build-5651 lesson). This image has no bash; use sh.
              - name: agent
                env:
                  - name: BUILDKITE_SHELL
                    value: "/bin/sh -e -c"
              - name: container-0
                # renovate: datasource=docker depName=semgrep/semgrep
                image: "semgrep/semgrep:1.170.0"
                securityContext:
                  allowPrivilegeEscalation: false
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "500m", memory: "1Gi" }
                  limits: { cpu: "2", memory: "4Gi" }
                volumeMounts:
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true

  # Blocking (like the old pipeline's blockingGates review step, which fed the
  # required check): every non-outdated review thread from the active code-review
  # provider must be resolved before the aggregate buildkite/monorepo/pr required
  # status can go green. The provider (Greptile, Codex, …) is chosen by
  # REVIEW_PROVIDER (default codex); wait-for-review.ts polls only while the
  # provider is still reviewing the head commit, then fails fast with the
  # unresolved-thread list.
  - label: ":robot_face: review gate"
    key: review-gate
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@shepherdjerred/root-scripts' --production
      bun --no-install scripts/wait-for-review.ts
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: review-gate

  # ── PR-only dry-run lane: ONE pod validates every deploy path, no side
  # effects (the old pipeline's --dryrun plumbing). Replaces five micro-steps
  # (tofu-plan, sites-pr, helm-pr, release-pr, helm-types-drift-check), each
  # of which paid pod + checkout + install overhead for seconds of real work.
  # Sections self-gate with ci-changed.ts against the PR merge-base
  # (CI_CHANGED_BASE override), so the two sections that do real work — the
  # tofu plans and the helm-types drift regen — still only run when their
  # inputs changed; the deploy rehearsals are print-only and always run.
  - label: ":microscope: pr dry-run (deploy paths + drift)"
    key: pr-dryrun
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/**"
        - ".mise.toml"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
        - "packages/**/package.json"
        - "patches/**"
        - "turbo.json"
        - "release-please-config.json"
        - ".release-please-manifest.json"
        - "scripts/package.json"
        - "scripts/release.ts"
        - "scripts/deploy-site.ts"
        - "scripts/scout-site-release.ts"
        - "scripts/lib/**"
        - "packages/homelab/src/tofu/**"
        - "packages/homelab/scripts/tofu-stack.ts"
        - "packages/homelab/scripts/helm-push.ts"
        - "packages/homelab/scripts/argocd.ts"
        - "packages/homelab/src/cdk8s/**"
        - "packages/homelab/src/helm-types/**"
        # Inputs of the npm, cooklang, and scout-image main lanes — mirrored
        # here so no lane input can change without a PR-side gate (asserted by
        # the lane↔if_changed coverage test).
        - "scripts/publish-npm.ts"
        - "packages/cooklang-for-obsidian/**"
        - "docker-bake.hcl"
        - ".dockerignore"
        - "packages/sjer.red/**"
        - "packages/resume/**"
        - "packages/webring/**"
        - "packages/astro-opengraph-images/**"
        - "packages/llm-models/**"
        - "packages/cooklang-rich-preview/**"
        - "packages/stocks-sjer-red/**"
        - "packages/better-skill-capped/**"
        - "packages/glitter/**"
        - "packages/glitter-context/**"
        - "packages/scout-for-lol/**"
    depends_on: verify
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@shepherdjerred/root-scripts' --filter '@shepherdjerred/release-tools' --filter '@homelab/cdk8s'
      # Merge-base for section gating; unresolvable → empty → ci-changed.ts
      # fails open and every section runs (extra work, never lost coverage).
      if ! CI_CHANGED_BASE=$(git merge-base origin/main HEAD); then
        CI_CHANGED_BASE=""
      fi
      export CI_CHANGED_BASE
      # Helm value-types drift gate (PR-only; main is skipped by design —
      # inputs are fully version-pinned, so a green PR gate implies a green
      # main tree). Renovate chart bumps touching versions.ts fail here until
      # someone pushes the regen commit (--check prints the command; hosted
      # Renovate cannot run it). helm comes from the ci-image's mise toolchain.
      if bun --no-install .buildkite/scripts/ci-changed.ts helm-types; then
        bun --no-install run --cwd packages/homelab/src/cdk8s generate-helm-types --check
      fi
      # Tofu plans — the only expensive section; gated on tofu inputs. The
      # SeaweedFS creds (tofu's S3 state backend) are confined to a subshell so
      # they DON'T leak into the deploy-site/scout dry-run rehearsals below:
      # with creds present, deploy-site's --dry-run runs a real
      # `aws s3 sync --dryrun` against a dist/ that was never built (the build
      # is stubbed in dry-run), which fails "path does not exist". These lanes
      # used to be separate pods; merging them into one made the leak possible.
      if bun --no-install .buildkite/scripts/ci-changed.ts tofu; then
        (
          export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_ACCESS_KEY"
          export TF_PLUGIN_CACHE_DIR=/buildkite/tofu-plugin-cache
          flock -x 9
          for stack in seaweedfs tailscale buildkite arr pagerduty github cloudflare; do
            bun --no-install packages/homelab/scripts/tofu-stack.ts "$$stack" plan
          done
        ) 9>/buildkite/tofu-plugin-cache/.lock
      fi
      # Print-only rehearsals (seconds each): sites catalog, the versioned
      # scout release path, helm chart push, and release-please.
      for site in sjer.red resume webring cooklang-rich-preview stocks-sjer-red better-skill-capped glitter; do
        bun --no-install scripts/deploy-site.ts "$$site" --dry-run
      done
      bun --no-install scripts/scout-site-release.ts archive --version "2.0.0-$BUILDKITE_BUILD_NUMBER" --dry-run
      bun --no-install scripts/scout-site-release.ts deploy-beta --version "2.0.0-$BUILDKITE_BUILD_NUMBER" --dry-run
      bun --no-install scripts/scout-site-release.ts reconcile-prod --dry-run
      bun --no-install scripts/scout-site-release.ts tag-release --version "2.0.0-$BUILDKITE_BUILD_NUMBER" --dry-run
      bun --no-install packages/homelab/scripts/helm-push.ts "$BUILDKITE_BUILD_NUMBER" --dry-run
      bun --no-install scripts/release.ts --dry-run
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_tofu_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: pr-dryrun

  - label: ":docker: images — build + smoke (PR dry-run)"
    key: images-pr
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/**"
        - ".dockerignore"
        - ".mise.toml"
        - "bun.lock"
        - "bunfig.toml"
        - "docker-bake.hcl"
        - "package.json"
        - "packages/**/package.json"
        - "scripts/package.json"
        - "patches/**"
        - "turbo.json"
        - "tsconfig.base.json"
        - "packages/birmel/**"
        - "packages/code-review/**"
        - "packages/discord-plays-core/**"
        - "packages/discord-plays-mario-kart/**"
        - "packages/discord-plays-pokemon/**"
        - "packages/discord-stream-lifecycle/**"
        - "packages/discord-video-stream/**"
        - "packages/eslint-config/**"
        - "packages/home-assistant/**"
        - "packages/homelab/images/**"
        - "packages/homelab/scripts/smoke-images.ts"
        - "packages/homelab/src/cdk8s/scripts/generate-caddyfile.ts"
        - "packages/homelab/src/cdk8s/src/misc/common.ts"
        - "packages/homelab/src/cdk8s/src/misc/s3-static-site.ts"
        - "packages/homelab/src/cdk8s/src/resources/s3-static-sites/sites.ts"
        - "packages/llm-models/**"
        - "packages/llm-observability/**"
        - "packages/scout-for-lol/packages/backend/**"
        - "packages/scout-for-lol/packages/data/**"
        - "packages/scout-for-lol/packages/report/**"
        - "packages/scout-for-lol/tsconfig.base.json"
        - "packages/starlight-karma-bot/**"
        - "packages/streambot/**"
        - "packages/tasknotes-server/**"
        - "packages/tasknotes-types/**"
        - "packages/temporal/**"
        - "packages/toolkit/**"
        - "packages/trmnl-dashboard/**"
    depends_on: verify
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun --no-install .buildkite/scripts/buildkit-env.ts
      buildkite-agent artifact download "caddyfile.generated" /tmp --step verify
      # Affected-scoped parallel bake + smoke, no push, cache read-only
      # (PUSH_CACHE stays false — only main writes the buildcache refs).
      # Executes no-exporter in-image smoke targets against remote BuildKit.
      CADDYFILE_SMOKE_PATH=/tmp/caddyfile.generated bun --no-install .buildkite/scripts/bake-images.ts --affected
    artifact_paths:
      - "image-selection-report.json"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_buildkit_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: images-pr

  # ── Main-only: images (parallel bake + smoke + push) ─────────────────────
  - label: ":docker: images — build, smoke, push"
    key: images
    if: build.branch == pipeline.default_branch
    depends_on: verify
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/image-push
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts images; then
        jq -n '{}' | buildkite-agent meta-data set image-digests
        # bake-images.ts never runs on this path, so it never produces
        # image-push-outcomes.json — write the empty array ourselves; an
        # unmatched artifact_paths entry fails the step even though the skip
        # itself is fine. image-selection-report.json is DIFFERENT: the
        # ci-changed.ts call above already wrote it (via select-image-targets.ts
        # --reasons-out) with the real base/changedPaths/targets that produced
        # this skip — fabricating a second, evidence-free one here would only
        # overwrite genuine data. Fall back to a synthetic report only in the
        # (should-never-happen) case that write didn't happen.
        jq -n '[]' > image-push-outcomes.json
        if [ ! -f image-selection-report.json ]; then
          jq -n '{base: null, changedPaths: [], mode: "selected", globalReason: "no image-owning packages changed since last green main build", targets: {}}' > image-selection-report.json
        fi
        if ! bun --no-install .buildkite/scripts/annotate-image-summary.ts --report image-selection-report.json --outcomes image-push-outcomes.json; then
          echo "WARN: image summary annotation failed (non-fatal)" >&2
        fi
        exit 0
      fi
      . .buildkite/scripts/toolchain.sh
      bun --no-install .buildkite/scripts/buildkit-env.ts
      buildkite-agent artifact download "caddyfile.generated" /tmp --step verify
      CADDYFILE_SMOKE_PATH=/tmp/caddyfile.generated bun --no-install .buildkite/scripts/bake-images.ts --push
    artifact_paths:
      - "image-selection-report.json"
      - "image-push-outcomes.json"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_buildkit_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: images

  # ── Main-only: static sites ───────────────────────────────────────────────
  - label: ":rocket: deploy sites"
    key: sites
    if: build.branch == pipeline.default_branch
    depends_on: [verify, playwright-e2e-main, resume-build-main]
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/site-deploys
    command: |
      # The site-scout lane carries paths the aggregate sites lane does not
      # (notably versions.ts: the version commit-back build must archive +
      # mint the deferred scout release pair — build 6281 hard-failed when
      # this early exit swallowed that build's archive), so only skip when
      # BOTH selectors agree nothing site-shaped changed.
      if ! bun --no-install .buildkite/scripts/ci-changed.ts sites &&
        ! bun --no-install .buildkite/scripts/ci-changed.ts site-scout; then
        # The per-site lanes below never run on this early-exit path, so their
        # own ci-changed.ts calls (and the recordDecision inside them) never
        # fire even though the aggregate answer applies to every one of them —
        # check each explicitly so build-summary shows a real "skipped"
        # instead of a misleading "not recorded" for every site-* row. The
        # result is discarded (all of them are unaffected by construction);
        # only the recorded decision matters here.
        for site_lane in site-sjer-red site-resume site-webring site-cooklang \
          site-stocks site-better-skill-capped site-glitter; do
          if bun --no-install .buildkite/scripts/ci-changed.ts "$$site_lane"; then :; fi
        done
        exit 0
      fi
      . .buildkite/scripts/toolchain.sh
      filters=()
      site_sjer=false
      site_resume=false
      site_webring=false
      site_cooklang=false
      site_stocks=false
      site_better_skill_capped=false
      site_glitter=false
      site_scout=false
      if bun --no-install .buildkite/scripts/ci-changed.ts site-sjer-red; then
        site_sjer=true
      fi
      if bun --no-install .buildkite/scripts/ci-changed.ts site-resume; then site_resume=true; fi
      if bun --no-install .buildkite/scripts/ci-changed.ts site-webring; then
        site_webring=true
        filters+=(--filter webring)
      fi
      if bun --no-install .buildkite/scripts/ci-changed.ts site-cooklang; then
        site_cooklang=true
        filters+=(--filter '@shepherdjerred/cooklang-rich-preview')
      fi
      if bun --no-install .buildkite/scripts/ci-changed.ts site-stocks; then
        site_stocks=true
        filters+=(--filter stocks-sjer-red)
      fi
      if bun --no-install .buildkite/scripts/ci-changed.ts site-better-skill-capped; then
        site_better_skill_capped=true
        filters+=(--filter better-skill-capped)
      fi
      if bun --no-install .buildkite/scripts/ci-changed.ts site-glitter; then
        site_glitter=true
        # The build imports @shepherdjerred/glitter-context through Glitter's
        # declared workspace dependency. Under Bun's isolated linker the
        # consumer must be selected so its production closure is installed.
        filters+=(--filter glitter)
      fi
      if bun --no-install .buildkite/scripts/ci-changed.ts site-scout; then
        site_scout=true
        filters+=(--filter '@scout-for-lol/frontend')
        filters+=(--filter '@scout-for-lol/app')
        filters+=(--filter astro-opengraph-images)
        filters+=(--filter '@shepherdjerred/llm-models')
        # Scout's data workspace imports this browser-safe shared context.
        # A filtered install links the workspace but does not produce its
        # gitignored dist entrypoint, so build it before the Scout site.
        filters+=(--filter '@shepherdjerred/glitter-context')
        bun install --frozen-lockfile --filter '@shepherdjerred/root-scripts' --production
      fi
      if [ "$${#filters[@]}" -gt 0 ]; then
        bun install --frozen-lockfile "$${filters[@]}"
      fi
      # Site syncs push to SeaweedFS S3 — same credential mapping as the
      # tofu steps (the secret exposes SEAWEEDFS_*, the AWS CLI wants AWS_*).
      export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_ACCESS_KEY"
      if $$site_sjer; then
        buildkite-agent artifact download "packages/sjer.red/dist/**/*" . --step playwright-e2e-main
        buildkite-agent artifact download "packages/sjer.red/dist/*" . --step playwright-e2e-main
        bun --no-install scripts/deploy-site.ts sjer.red --prebuilt
      fi
      if $$site_resume; then
        buildkite-agent artifact download "packages/resume/resume.pdf" . --step resume-build-main
        bun --no-install scripts/deploy-site.ts resume --prebuilt
      fi
      if $$site_webring; then bun --no-install scripts/deploy-site.ts webring; fi
      if $$site_cooklang; then bun --no-install scripts/deploy-site.ts cooklang-rich-preview; fi
      if $$site_stocks; then bun --no-install scripts/deploy-site.ts stocks-sjer-red; fi
      if $$site_better_skill_capped; then bun --no-install scripts/deploy-site.ts better-skill-capped; fi
      if $$site_glitter; then bun --no-install scripts/deploy-site.ts glitter; fi
      if $$site_scout; then
        bun --no-install run --cwd packages/llm-models build
        bun --no-install run --cwd packages/astro-opengraph-images build
        bun --no-install run --cwd packages/glitter-context build
        bun --no-install scripts/scout-site-release.ts archive --version "2.0.0-$BUILDKITE_BUILD_NUMBER"
        # Record the archived version so scout-tag-release can gate on what
        # actually happened instead of re-deriving it from a second path
        # selector that can (and did — build 6281) skew from this one.
        buildkite-agent meta-data set scout-site-archived "2.0.0-$BUILDKITE_BUILD_NUMBER"
        bun --no-install scripts/scout-site-release.ts deploy-beta --version "2.0.0-$BUILDKITE_BUILD_NUMBER"
      fi
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: sites

  # ── Main-only: npm publishes ──────────────────────────────────────────────
  # Two lanes, matching the old pipeline's npm-publish-all-prod/-dev pair:
  # the prod lane publishes package.json versions to --tag latest (idempotent
  # via --tolerate-republish, so it's a no-op except on the build after a
  # release-please merge bumps versions); the dev lane then publishes
  # <version>-dev.<build#> to --tag dev on every main build. Prod runs FIRST;
  # dev mode rewrites package.json versions mid-publish (and restores them in
  # a finally, so a failed dev publish can't leak -dev.N into a later prod run).
  - label: ":npm: publish packages + cooklang plugin"
    key: publish
    if: build.branch == pipeline.default_branch
    depends_on: verify
    cancel_on_build_failing: true
    # Both halves are idempotent (npm --tolerate-republish; cooklang skips an
    # existing version tag), so the shared retry anchor is safe.
    command: |
      npm_changed=true
      cooklang_changed=true
      if ! bun --no-install .buildkite/scripts/ci-changed.ts npm; then npm_changed=false; fi
      if ! bun --no-install .buildkite/scripts/ci-changed.ts cooklang; then cooklang_changed=false; fi
      if ! $$npm_changed && ! $$cooklang_changed; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      filters=()
      if $$npm_changed; then
        filters+=(--filter astro-opengraph-images --filter webring --filter '@shepherdjerred/helm-types')
      fi
      if $$cooklang_changed; then filters+=(--filter cooklang-for-obsidian); fi
      bun install --frozen-lockfile "$${filters[@]}"
      if $$npm_changed; then
        bun --no-install run --cwd packages/astro-opengraph-images publish:npm
        bun --no-install run --cwd packages/webring publish:npm
        bun --no-install run --cwd packages/homelab/src/helm-types publish:npm
        bun --no-install scripts/publish-npm.ts packages/astro-opengraph-images --dev-suffix "$BUILDKITE_BUILD_NUMBER"
        bun --no-install scripts/publish-npm.ts packages/webring --dev-suffix "$BUILDKITE_BUILD_NUMBER"
        bun --no-install scripts/publish-npm.ts packages/homelab/src/helm-types --dev-suffix "$BUILDKITE_BUILD_NUMBER"
      fi
      if $$cooklang_changed; then
        bun --no-install run --cwd packages/cooklang-for-obsidian publish:plugin
      fi
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: publish

  # ── Main-only: homelab release track ─────────────────────────────────────
  - label: ":helm: helm push"
    key: helm-push
    if: build.branch == pipeline.default_branch
    # Publishing the floating buildkitd chart makes Argo auto-sync it. Wait for
    # this build's remote solves first so a daemon version/config rollout
    # cannot send graceful_stop to its own image jobs (build 6681).
    depends_on: [verify, images, ci-image-refresh]
    cancel_on_build_failing: true
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts helm; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      # cdk8s synth output is flat (`dist/<chart>.k8s.yaml`), so `dist/*` matches
      # it. The former `dist/**/*` download failed fatally here: buildkite-agent's
      # `**/*` needs a subdirectory segment, matches none of the flat files, and
      # treats "no artifacts found" as fatal — killing the step before this
      # `dist/*` download (which does match) ever ran (build 6007).
      buildkite-agent artifact download "packages/homelab/src/cdk8s/dist/*" . --step verify
      bun --no-install packages/homelab/scripts/helm-push.ts "$BUILDKITE_BUILD_NUMBER"
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: helm-push

  - label: ":terraform: tofu apply (infra stacks)"
    key: tofu-apply
    if: build.branch == pipeline.default_branch
    depends_on: [verify, helm-push]
    cancel_on_build_failing: true
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts tofu; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      (
        export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_ACCESS_KEY"
        export TF_PLUGIN_CACHE_DIR=/buildkite/tofu-plugin-cache
        flock -x 9
        for stack in seaweedfs tailscale buildkite arr pagerduty; do
          bun --no-install packages/homelab/scripts/tofu-stack.ts "$$stack" apply
        done
      ) 9>/buildkite/tofu-plugin-cache/.lock
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_tofu_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: tofu-apply

  - label: ":terraform: tofu apply (github)"
    key: tofu-github
    if: build.branch == pipeline.default_branch
    depends_on: verify
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/tofu-github
    # No automatic retry: GitHub API mutations are not idempotent on partial
    # failure (same policy as the old pipeline).
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts tofu; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      (
        export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_ACCESS_KEY"
        export TF_PLUGIN_CACHE_DIR=/buildkite/tofu-plugin-cache
        flock -x 9
        bun --no-install packages/homelab/scripts/tofu-stack.ts github apply
      ) 9>/buildkite/tofu-plugin-cache/.lock
    plugins:
      - kubernetes:
          <<: *pod_tofu_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: tofu-github

  - label: ":argo: sync + wait"
    key: argocd-sync
    if: build.branch == pipeline.default_branch
    depends_on: [images, helm-push, tofu-apply]
    cancel_on_build_failing: true
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts argocd; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@homelab/cdk8s' --production
      # The CI secret uses the argocd CLI's canonical ARGOCD_AUTH_TOKEN name;
      # argocd.ts reads ARGOCD_TOKEN (build 5648).
      export ARGOCD_TOKEN="$$ARGOCD_AUTH_TOKEN"
      bun --no-install packages/homelab/scripts/argocd.ts sync apps
      bun --no-install packages/homelab/scripts/argocd.ts tree-health-wait argocd --timeout 300
      # Kueue was a child Application without a resources finalizer. Delete it
      # explicitly with foreground cascading before pruning the root-owned
      # queues and namespace; otherwise its Helm resources are orphaned.
      bun --no-install packages/homelab/scripts/argocd.ts delete-application kueue --project default --timeout 300
      bun --no-install packages/homelab/scripts/argocd.ts sync apps --prune
      bun --no-install packages/homelab/scripts/argocd.ts tree-health-wait apps --timeout 300
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: argocd-sync

  # Mint the versioned release-pair tag: after this build archived site
  # version 2.0.0-<build> and deployed it to beta, retag the paired backend
  # digest as ghcr.io/shepherdjerred/scout-for-lol:2.0.0-<build>. The tag is
  # what the Renovate-managed prod pin discovers — tag name = archived site
  # version, tag target = the backend content beta serves that site against —
  # so every tag Renovate can offer is a complete, promotable pair. Ordered
  # after images (paired digest known) AND sites (archive manifest uploaded);
  # imagetools talks straight to the registry, so no dind sidecar is needed.
  - label: ":label: scout tag release"
    key: scout-tag-release
    if: build.branch == pipeline.default_branch
    depends_on: [images, sites]
    cancel_on_build_failing: true
    command: |
      # Gate on what the sites step actually recorded, not on a re-derived
      # path selector: build 6281 failed because this step's site-scout list
      # and the sites step's aggregate list disagreed about a versions.ts-only
      # commit. No recorded archive → nothing to mint this build. If the
      # images step still recorded a scout digest (a backend-closure change
      # outside the site lane), the mint is deferred: the commit-back merge
      # touches versions.ts (in the site-scout lane), so the next build
      # archives + mints the pair.
      archived=$$(buildkite-agent meta-data get scout-site-archived --default "")
      if [ -z "$$archived" ]; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@shepherdjerred/root-scripts' --production
      # SeaweedFS creds: asserts the version's archive manifest exists before
      # minting (only archived versions may become promotable tags).
      export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_ACCESS_KEY"
      printf '%s' "$$GH_TOKEN" | docker login ghcr.io -u shepherdjerred --password-stdin
      scout_digest=$$(buildkite-agent meta-data get image-digests | jq -r '."shepherdjerred/scout-for-lol" // empty')
      bun --no-install scripts/scout-site-release.ts tag-release --version "$$archived" $${scout_digest:+--digest "$$scout_digest"}
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: scout-tag-release

  # Reconcile the prod scout site to its versions.ts pin. Usually a no-op
  # (bucket marker == pin); after a promotion merge it syncs the archived
  # artifact for the pinned version into the prod bucket. Ordered AFTER
  # argocd-sync on purpose: the promoted backend deploys first, so the
  # transient mid-promotion mix is old-frontend/new-backend — the safe
  # direction (the reverse skew is what crashed the prod SPA). Shares the
  # site-deploys concurrency group so it never races a beta sync.
  - label: ":rocket: scout prod reconcile"
    key: scout-prod-reconcile
    if: build.branch == pipeline.default_branch
    depends_on: [argocd-sync, sites]
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/site-deploys
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts scout-reconcile; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@shepherdjerred/root-scripts' --production
      export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_ACCESS_KEY"
      bun --no-install scripts/scout-site-release.ts reconcile-prod
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: scout-prod-reconcile

  - label: ":terraform: tofu apply (cloudflare, after tunnel gate)"
    key: tofu-cloudflare
    if: build.branch == pipeline.default_branch
    depends_on: argocd-sync
    cancel_on_build_failing: true
    concurrency: 1
    concurrency_group: monorepo/tofu-cloudflare
    # Fail-closed: the SeaweedFS TunnelBinding finalizer must complete before
    # the Cloudflare DNS tunnel route is removed (same gate as the old CI).
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts tofu; then
        if ! bun --no-install .buildkite/scripts/ci-changed.ts argocd; then exit 0; fi
      fi
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@homelab/cdk8s' --production
      # Same ARGOCD_AUTH_TOKEN → ARGOCD_TOKEN mapping as the sync step.
      export ARGOCD_TOKEN="$$ARGOCD_AUTH_TOKEN"
      bun --no-install packages/homelab/scripts/argocd.ts wait-deletion apps --group networking.cfargotunnel.com --version v1alpha1 --kind TunnelBinding --namespace seaweedfs --timeout 120
      (
        export AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_ACCESS_KEY"
        export TF_PLUGIN_CACHE_DIR=/buildkite/tofu-plugin-cache
        flock -x 9
        bun --no-install packages/homelab/scripts/tofu-stack.ts cloudflare apply
      ) 9>/buildkite/tofu-plugin-cache/.lock
    # Safe to retry: tofu re-plans from state, and the scripts only exit 34
    # (the retryable code) on classified transient failures.
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_tofu_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: tofu-cloudflare

  # ── Main-only: release automation ─────────────────────────────────────────
  # Gates on verify only: release-please consumes no image or site artifact
  # (build 5644: gating on [images, sites] parked it behind the 52-min images
  # step for no data reason). The version commit-back — which DOES consume the
  # pushed image digests — is its own step below, gated on images.
  - label: ":package: release-please"
    key: release-please
    if: build.branch == pipeline.default_branch
    depends_on: verify
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun install --frozen-lockfile --filter '@shepherdjerred/root-scripts' --filter '@shepherdjerred/release-tools' --production
      bun --no-install scripts/release.ts
    # Safe to retry: release-please upserts its PR and skips already-cut
    # releases; a GitHub GraphQL 500 (build 5809) exits 34 via transient.ts.
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: release-please

  # Version commit-back: rewrites versions.ts tag@digest pins from the digests
  # the images step recorded in build meta-data, and opens the auto-merge bump
  # PR. (The replatform's bare `bun scripts/update-versions.ts` invocation was
  # a stub — no digest plumbing existed, and the step exited 1 on every build
  # that reached it.) Digest-unchanged entries are skipped, so a no-change
  # merge redeploys nothing.
  - label: ":package: version commit-back"
    key: version-commit-back
    if: build.branch == pipeline.default_branch
    depends_on: images
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      bun --no-install scripts/update-versions.ts --commit-back "2.0.0-$BUILDKITE_BUILD_NUMBER" --digests "$$(buildkite-agent meta-data get image-digests)"
    # Safe to retry: the bump branch is force-updated and the PR lookup is
    # find-or-create; transient gh/git failures exit 34 via transient.ts.
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: version-commit-back

  # ── Toolchain image refresh ───────────────────────────────────────────────
  - label: ":docker: ci-image refresh"
    key: ci-image-refresh
    if: build.branch == pipeline.default_branch
    depends_on: verify
    cancel_on_build_failing: true
    command: |
      if ! bun --no-install .buildkite/scripts/ci-changed.ts ci-image; then exit 0; fi
      . .buildkite/scripts/toolchain.sh
      bun --no-install .buildkite/scripts/buildkit-env.ts
      bun --no-install .buildkite/scripts/build-ci-image.ts
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_buildkit_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: ci-image-refresh

  # ── Main-only: build summary annotation (runs even when deploys fail) ─────
  - label: ":memo: build summary"
    key: build-summary
    if: build.branch == pipeline.default_branch
    depends_on:
      - verify
      - playwright-e2e-main
      - resume-build-main
      - docker-e2e-main
      - images
      - sites
      - helm-push
      - tofu-apply
      - argocd-sync
      # These three record the npm/cooklang, scout-reconcile, and ci-image
      # lane decisions the table below renders; without depending on them
      # directly, build-summary can render before they finish and show a
      # false "not recorded" for a lane that's still mid-run.
      - publish
      - scout-prod-reconcile
      - ci-image-refresh
    allow_dependency_failure: true
    command: bun --no-install .buildkite/scripts/annotate-build-summary.ts
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: build-summary
