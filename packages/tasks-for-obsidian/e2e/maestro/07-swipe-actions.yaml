# Exercise both task-row swipe actions after the Gesture Handler 3 upgrade.
# A right swipe reveals Complete; a left swipe reveals Delete.
appId: org.reactjs.native.example.TasksForObsidian
---
- runFlow: 00-setup.yaml
- tapOn:
    id: "fab-add-task"
- extendedWaitUntil:
    visible:
      id: "quick-add-input"
    timeout: 10000
- tapOn:
    id: "quick-add-input"
- inputText: "Swipe complete task today"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible:
      id: "task-row-TaskNotes/Swipe complete task.md"
    timeout: 20000
- swipe:
    from:
      id: "task-row-TaskNotes/Swipe complete task.md"
    direction: RIGHT
- extendedWaitUntil:
    notVisible:
      id: "task-row-TaskNotes/Swipe complete task.md"
    timeout: 15000
- tapOn:
    id: "fab-add-task"
- extendedWaitUntil:
    visible:
      id: "quick-add-input"
    timeout: 10000
- tapOn:
    id: "quick-add-input"
- inputText: "Swipe delete task today"
- tapOn:
    id: "quick-add-submit"
- extendedWaitUntil:
    visible:
      id: "task-row-TaskNotes/Swipe delete task.md"
    timeout: 20000
- swipe:
    from:
      id: "task-row-TaskNotes/Swipe delete task.md"
    direction: LEFT
- extendedWaitUntil:
    visible:
      text: "Delete Task"
    timeout: 10000
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    notVisible:
      id: "task-row-TaskNotes/Swipe delete task.md"
    timeout: 15000
