        - "**/*.tf"
        - "**/*.ts"
        - "**/*.cts"
        - "**/*.mts"
        - "**/*.tsx"
        - "**/*.vue"
        - "**/*.yaml"
        - "**/*.yml"
    cancel_on_build_failing: true
    # Excludes mirror the .gitleaks.toml allowlist: these exact paths hold
    # values already triaged as non-sensitive (legacy/undeployed sandbox
    # scratch, disabled Minecraft management-server secrets, a public
    # Firebase web apiKey in the temporal activities fetcher). semgrep's
    # generic-secret rule would otherwise re-print those values into the log
    # on every build. Real code stays fully scanned — the old bare
    # `--exclude fetcher.ts` / `--exclude server.properties` basename
    # patterns matched every so-named file repo-wide, which silently
    # excluded files that were never triaged.
    #
    # The checked-in .semgrep/p-default is a reviewed snapshot of the
    # registry's p/default pack (SHA-256:
    # e0b51ec96a6685be302583fdae5b802b9f9fe692542d6afb330e67a93b5f45cc).
    # Its rule contents, rather than the registry alias, are the CI contract.
    # `--metrics=off` keeps this local-config scan telemetry-free.
    command: |
      echo "OPTIONAL SECURITY SCAN: Semgrep findings do not block merge; merge-base/config/runtime failures do."
      set +e
      if ! base=$(git merge-base origin/main HEAD); then
        echo "semgrep could not resolve the PR merge-base" >&2
        exit 2
      fi
      semgrep scan --config .semgrep/p-default.yml --metrics=off --error \
        --baseline-commit "$$base" \
        --exclude sandbox \
        --exclude packages/homelab/src/cdk8s/config/minecraft-shuxin/server.properties \
        --exclude packages/homelab/src/cdk8s/config/minecraft-sjerred/server.properties \
        --exclude packages/homelab/src/cdk8s/config/minecraft-tsmc/server.properties \
        --exclude packages/temporal/src/activities/fetcher.ts \
        .
      semgrep_status=$$?
      set -e
      if [ "$$semgrep_status" -eq 1 ]; then
        echo "Semgrep reported findings only (exit 1); Buildkite will soft-fail this optional step."
      elif [ "$$semgrep_status" -ne 0 ]; then
        echo "Semgrep failed to run (exit $$semgrep_status); this is a hard CI failure."
      fi
      exit "$$semgrep_status"
    plugins:
      - kubernetes:
          metadata:
            labels:
              ci.sjer.red/step-key: semgrep
          checkout:
            cloneFlags: "--no-tags"
          podSpecPatch:
            serviceAccountName: buildkite-job
            automountServiceAccountToken: false
            containers:
              - *checkout_container
              # The shell is taken from the AGENT container's registration
              # env (container-0-level BUILDKITE_SHELL is ignored — the
              # build-5651 lesson). This image has no bash; use sh.
              - name: agent
                env:
                  - name: BUILDKITE_SHELL
                    value: "/bin/sh -e -c"
              - name: container-0
                # renovate: datasource=docker depName=semgrep/semgrep
                image: "semgrep/semgrep:1.170.0"
                securityContext:
                  allowPrivilegeEscalation: false
                resources:
                  # The checkout container separately requests its 1Gi tmpfs charge.
                  requests: { cpu: "250m", memory: "512Mi" }
                  limits: { cpu: "2", memory: "4Gi" }
                volumeMounts:
                  - name: buildkite-git-mirrors
                    mountPath: /buildkite/git-mirrors
                    readOnly: true

  # The blocking required gate is Codex: it must finish reviewing the exact PR
  # head, and every unresolved finding at the configured severity must be
  # addressed. Qodo remains available as an optional provider for manual
  # investigation, but is not part of the PR status until re-enabled here.
  # This budget stays above wait-for-review.ts's own deadline plus its install,
  # so the script always reports which provider and head it gave up on rather
  # than Buildkite killing the pod first.
  - label: ":robot_face: Codex review gate (required)"
    key: codex-review-gate
    timeout_in_minutes: 90
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    env:
      REVIEW_PROVIDER: codex
    command: |
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/review-gate.sh
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_light_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: codex-review-gate
          podSpecPatch:
            <<: *pod_light_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_light_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_github_review

  # ── PR-only dry-run lane: ONE pod validates every deploy path, no side
  # effects (the old pipeline's --dryrun plumbing). OpenTofu plans run as
  # separate per-stack jobs below because each provider has a different
  # credential boundary.
  # Sections use ci-changed.ts against the PR merge-base
  # (CI_CHANGED_BASE override), so the two sections that do real work — the
  # helm-types drift regen still runs only when its inputs changed; the deploy
  # rehearsals are print-only and always run.
  - label: ":microscope: pr dry-run (deploy paths + drift)"
    key: pr-dryrun
    timeout_in_minutes: 30
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed:
      include:
        - ".buildkite/pipeline.yml"
        - ".buildkite/main-bootstrap.yml"
        - ".buildkite/scripts/bake-images.ts"
        - ".buildkite/scripts/bake-retry.ts"
        - ".buildkite/scripts/buildkit-env.ts"
        - ".buildkite/scripts/buildkite-handoff.ts"
        - ".buildkite/scripts/ci-changed.ts"
        - ".buildkite/scripts/docker-source-label.ts"
        - ".buildkite/scripts/migration-core.ts"
        - ".buildkite/scripts/prepare-ci-changed-base.ts"
        - ".buildkite/scripts/read-buildkite-handoff.ts"
        - ".buildkite/scripts/select-main-pipeline.ts"
        - ".buildkite/scripts/select-main-pipeline-selection.ts"
        - ".buildkite/scripts/select-image-targets.ts"
        - ".buildkite/scripts/select-image-targets-lockfile.ts"
        - ".buildkite/scripts/select-image-targets-workspaces.ts"
        - ".buildkite/scripts/smoke-app-configs.ts"
        - ".buildkite/scripts/smoke-app-in-image.ts"
        - ".buildkite/scripts/upload-pipeline.sh"
        - ".buildkite/scripts/validate-image-migration.ts"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
        - "packages/**/package.json"
        - "patches/**"
        - "turbo.json"
        - "release-please-config.json"
        - ".release-please-manifest.json"
        - "scripts/package.json"
        - "scripts/release.ts"
        - "scripts/deploy-site.ts"
        - "scripts/scout-site-release.ts"
        - "scripts/lib/**"
        - "packages/homelab/scripts/helm-release-core.ts"
        - "packages/homelab/scripts/helm-push.ts"
        - "packages/homelab/scripts/argocd.ts"
        - "packages/homelab/src/cdk8s/**"
        - "packages/homelab/src/helm-types/**"
        - "packages/version-catalog/**"
        # Inputs of the npm, cooklang, and scout-image main lanes — mirrored
        # here so no lane input can change without a PR-side gate (asserted by
        # the lane↔if_changed coverage test).
        - "scripts/publish-npm.ts"
        - "packages/cooklang-for-obsidian/**"
        - "docker-bake.hcl"
        - ".dockerignore"
        - "packages/sjer.red/**"
        - "packages/resume/**"
        - "packages/webring/**"
        - "packages/astro-opengraph-images/**"
        - "packages/llm-models/**"
        - "packages/cooklang-rich-preview/**"
        - "packages/stocks-sjer-red/**"
        - "packages/docs/wiki/**"
        - "packages/better-skill-capped/**"
        - "packages/glitter/**"
        - "packages/glitter-context/**"
        - "packages/scout-for-lol/**"
        - "config/analytics-sites.json"
    depends_on: verify
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      .buildkite/scripts/bun-install.sh --frozen-lockfile --filter '@shepherdjerred/root-scripts' --filter '@shepherdjerred/release-tools' --filter homelab --filter '@homelab/cdk8s'
      # Merge-base for section gating; unresolvable → empty → ci-changed.ts
      # fails open and every section runs (extra work, never lost coverage).
      if ! CI_CHANGED_BASE=$(git merge-base origin/main HEAD); then
        CI_CHANGED_BASE=""
      fi
      export CI_CHANGED_BASE
      # Helm value-types drift gate (PR-only; main is skipped by design —
      # inputs are fully version-pinned, so a green PR gate implies a green
      # main tree). Renovate chart bumps touching versions.ts fail here until
      # someone pushes the regen commit (--check prints the command; hosted
      # Renovate cannot run it). helm comes from the ci-image's mise toolchain.
      if bun --no-install .buildkite/scripts/ci-changed.ts helm-types; then
        bun --no-install run --cwd packages/homelab/src/cdk8s generate-helm-types --check
      fi
      # Print-only rehearsals (seconds each): sites catalog, the versioned
      # scout release path, helm chart push, and release-please.
      for site in sjer.red resume webring cooklang-rich-preview stocks-sjer-red wiki better-skill-capped glitter; do
        bun --no-install scripts/deploy-site.ts "$$site" --dry-run
      done
      scout_backend=$$(bun --no-install scripts/scout-site-release.ts resolve-backend-digest)
      bun --no-install scripts/scout-site-release.ts prepare-state \
        --build-number "$BUILDKITE_BUILD_NUMBER" \
        --backend-digest "$$scout_backend" \
        --output /tmp/scout-release-state.json \
        --dry-run
      scout_state=$$(</tmp/scout-release-state.json)
      bun --no-install scripts/scout-site-release.ts archive --state "$$scout_state" --dry-run
      bun --no-install scripts/scout-site-release.ts deploy-beta --state "$$scout_state" --dry-run
      bun --no-install scripts/scout-site-release.ts reconcile-prod --state "$$scout_state" --dry-run
      bun --no-install scripts/scout-site-release.ts tag-release --state "$$scout_state" --dry-run
      bun --no-install scripts/scout-site-release.ts resolve-prod-pin
      bun --no-install packages/homelab/scripts/helm-push.ts "$BUILDKITE_BUILD_NUMBER" --dry-run
      apps_revision=$$(jq -er '.[] | select(.name == "apps") | .revision' argocd-release-expected.json)
      bun --no-install packages/homelab/scripts/argocd.ts release-root apps argocd-release-expected.json --revision "$$apps_revision" --request-id "$BUILDKITE_BUILD_ID" --dry-run
      pin_candidates=$$(jq -cn --arg build "$BUILDKITE_BUILD_NUMBER" \
        '{schema:"pin-candidates/v1",buildNumber:($$build|tonumber),candidates:{}}')
      bun --no-install scripts/update-versions.ts --commit-back --candidates "$$pin_candidates" --dry-run
      bun --no-install scripts/release.ts --dry-run
    retry: *retry
    plugins:
      - kubernetes:
          <<: *pod_pr_dryrun_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: pr-dryrun
          podSpecPatch:
            <<: *pod_pr_dryrun_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_pr_dryrun_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download

  # OpenTofu plans are isolated by stack so a provider credential is never
  # present while another provider's configuration is evaluated. The chain
  # preserves the previous deterministic stack order and serializes writes to
  # the shared provider cache.
  - label: ":terraform: OpenTofu plan — SeaweedFS"
    key: tofu-plan-seaweedfs
    timeout_in_minutes: 30
    if: build.pull_request.id != null && (build.branch != "release-please--branches--main" || build.source != "webhook" || build.env("RUN_RELEASE_CI") == "true")
    if_changed: &tofu_plan_if_changed
      include:
        - ".buildkite/pipeline.yml"
        - ".buildkite/main-bootstrap.yml"
        - ".buildkite/scripts/buildkite-handoff.ts"
        - ".buildkite/scripts/ci-changed.ts"
        - ".buildkite/scripts/migration-core.ts"
        - ".buildkite/scripts/prepare-ci-changed-base.ts"
        - ".buildkite/scripts/read-buildkite-handoff.ts"
        - ".buildkite/scripts/select-main-pipeline.ts"
        - ".buildkite/scripts/upload-pipeline.sh"
        - ".buildkite/secret-grants.json"
        - ".buildkite/secret-grants.schema.json"
        - "bun.lock"
        - "bunfig.toml"
        - "package.json"
        - "patches/**"
        - "turbo.json"
        - "packages/homelab/scripts/tofu-stack.ts"
        - "packages/homelab/src/tofu/**"
        - "scripts/lib/run.ts"
        - "scripts/lib/transient.ts"
    depends_on: verify
    cancel_on_build_failing: true
    command: |
      . .buildkite/scripts/toolchain.sh
      export TF_PLUGIN_CACHE_DIR=/buildkite/tofu-plugin-cache
      flock -x /buildkite/tofu-plugin-cache/.lock \
        bun --no-install packages/homelab/scripts/tofu-stack.ts seaweedfs plan
    plugins:
      - kubernetes:
          <<: *pod_tofu_kubernetes
          metadata:
            labels:
              ci.sjer.red/step-key: tofu-plan-seaweedfs
          podSpecPatch:
            <<: *pod_tofu_pod_spec
            containers:
              - *checkout_container
              - <<: *pod_tofu_container
                env:
                  - *env_buildkite_shell
                  - *grant_github_download
                  - *grant_seaweedfs_state_access
                  - *grant_seaweedfs_state_secret
                  - *grant_seaweedfs_deploy_access
                  - *grant_seaweedfs_deploy_secret

  - label: ":terraform: OpenTofu plan — Tailscale"
    key: tofu-plan-tailscale
