<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the shell pads itself by the safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The canvas color of each theme, from src/client/styles/tokens.css. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f3f5ee"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#141918"
    />
    <meta
      name="description"
      content="Your household's films, series, and requests in one place."
    />
    <title>Media · Your next watch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
