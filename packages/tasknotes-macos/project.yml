# XcodeGen spec for the Facet macOS app.

name: TaskNotes

options:
  bundleIdPrefix: red.sjer.tasknotes
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  minimumXcodeGenVersion: "2.46.0"
  generateEmptyDirectories: true

packages:
  TaskNotesPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_MEMORY_SAFETY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_WEAK: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_NO_COMMON_BLOCKS: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ONLY_ACTIVE_ARCH: NO

targets:
  TaskNotes:
    type: application
    platform: macOS

    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/macos/ThirdPartyNotices.txt
        buildPhase: resources
      - path: Resources/macos/FirstPartyLicense.txt
        buildPhase: resources
      - path: Resources/macos/native-license-inventory.json
        buildPhase: resources

    dependencies:
      - package: TaskNotesPackage
        product: TaskNotesMac

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: red.sjer.tasknotes.mac
        PRODUCT_NAME: TaskNotes
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        CODE_SIGN_ENTITLEMENTS: App/TaskNotes.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

    info:
      path: App/Info.plist
      properties:
        CFBundleName: Facet
        CFBundleDisplayName: Facet
        CFBundleIconFile: AppIcon
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: false
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleURLTypes:
          - CFBundleURLName: red.sjer.tasknotes.mac
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - tasknotes

  TaskNotesUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        excludes:
          - "Info.plist"
    dependencies:
      - target: TaskNotes
      - package: TaskNotesPackage
        product: TaskNotesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: red.sjer.tasknotes.mac.uitests
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "$(TASKNOTES_UITEST_IDENTITY:default=-)"
    info:
      path: UITests/Info.plist
      properties:
        CFBundleName: TaskNotesUITests
        CFBundlePackageType: BNDL

schemes:
  TaskNotes:
    build:
      targets:
        TaskNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TaskNotesUITests
      gatherCoverageData: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
