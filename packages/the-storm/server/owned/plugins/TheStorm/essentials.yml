# Essentials: spawn, teleports, homes, kits, the rules book and AFK.
# Owned by the repository; the plugin never writes it. Every key is required,
# unknown keys are errors, and durations are ISO-8601 (PT3S, PT10M, PT1H).

# Where /spawn leads, where new players arrive, and where players without a bed
# or respawn anchor respawn. The entrance of the existing windmill. The module
# refuses to start unless this is a safe spot (solid block underfoot, two open
# blocks above, no hazards) in a loaded world.
spawn:
  world: world
  x: 68.5
  y: 69.0
  z: 66.5
  yaw: 90.0
  pitch: 0.0

teleports:
  # Stand still this long before a teleport; moving a block or taking damage
  # cancels it.
  warmup: PT3S
  # How long a /tpa or /tpahere request stays open.
  tpaTimeout: PT1M
  # The least time between two requests from one player.
  tpaInterval: PT10S
  # How many places /back remembers (teleports and deaths).
  backHistorySize: 5
  # Each command has its own price and cooldown. The cooldown starts on arrival.
  # A cancelled or failed trip records nothing. RTP is free for rtpFreeFor and
  # still waits out its cooldown. Elytra, happy ghasts and paths cost nothing.
  pricing:
    rtpFreeFor: P7D
    prices:
      spawn:
        cost: 10
        cooldown: PT30S
      home:
        cost: 25
        cooldown: PT1M
      tpa:
        cost: 25
        cooldown: PT1M
      back:
        cost: 25
        cooldown: PT1M
      warp:
        cost: 15
        cooldown: PT30S
      rtp:
        cost: 25
        cooldown: PT1M

# How many homes each player may set.
homeLimit: 3

# Idle time before a player is marked AFK.
afkTimeout: PT5M

kits:
  # Given once to every new player on their first join.
  starter: starter
  kits:
    starter:
      once: true
      cooldown: PT0S
      items:
        - material: IRON_SWORD
          amount: 1
          name: null
          enchantments: {}
        - material: IRON_PICKAXE
          amount: 1
          name: null
          enchantments: {}
        - material: IRON_AXE
          amount: 1
          name: null
          enchantments: {}
        - material: IRON_SHOVEL
          amount: 1
          name: null
          enchantments: {}
        - material: IRON_HOE
          amount: 1
          name: null
          enchantments: {}
        - material: WHITE_BED
          amount: 1
          name: null
          enchantments: {}
        - material: COOKED_PORKCHOP
          amount: 16
          name: null
          enchantments: {}
      books:
        - title: Welcome to The Storm
          author: The Storm
          pages:
            - |-
              <dark_aqua><b>The Storm</b></dark_aqua>

              Pick a biome with your
              compass. Gather wood
              and build a shelter.

              /sethome saves a home.
              /home takes you back.

              /bal: 500 starter crystals.
            - |-
              <dark_aqua><b>Protect your home</b></dark_aqua>

              Read /rules. No griefing.

              /camp is your first home.
              A shelter can start one.

              /claim protects a chunk.
              /camp help explains it.

              Governor I can graduate
              a camp into a town.

              PvP is on outside spawn.
              /pvp off opts out.
            - |-
              <dark_aqua><b>Explore and help</b></dark_aqua>

              /quests: your journal
              /graves: lost gear
              /ticket <message>: help

              Guide and Discord:
              <click:open_url:'https://docs.ts-mc.net/'>docs.ts-mc.net</click>

              /guide reopens this book.

# The book /rules opens. MiniMessage; at most 100 pages. The server's official
# rules, as given by the owner.
rules:
  title: The Storm Rules
  author: The Storm Staff
  pages:
    - |-
      <dark_aqua><b>The Storm Rules</b></dark_aqua>

      <dark_aqua>1. No griefing.</dark_aqua> Build on your own land or with permission. Staff can roll griefing back.

      <dark_aqua>2. Lock what you love.</dark_aqua> Unlocked chests are fair game; locked containers are off-limits.
    - |-
      <dark_aqua>3. Spare the animals.</dark_aqua> Don't kill other players' animals, pets or villagers.

      <dark_aqua>4. No harassment.</dark_aqua> Not in chat, and no following, trapping or spamming anyone.

      <dark_aqua>5. PvP is on.</dark_aqua> Spawn is PvP-free. /pvp switches yours off or on, once a week.
    - |-
      <dark_aqua>6. No hacks or bug exploits.</dark_aqua>

      Arguing? Take it to War chat with <click:run_command:'/war'><u>/war</u></click>. <click:run_command:'/channels'><u>/channels</u></click> lists every channel.

      What you type to NPCs may be sent to an AI provider to write their replies.
