# Package selection for the headless "agent-host" profile (see
# .chezmoi.toml.tmpl). `.Brewfile_darwin` stays the generated dump of the full
# workstation; dot_Brewfile.tmpl filters it for agent hosts instead of keeping a
# second hand-maintained list. Every tap, formula, go, uv, and npm entry is kept.
# Only these casks survive, and VS Code extensions are dropped. The
# "assistant-host" profile filters the same dump through assistant-host.yaml.
# scripts/brewfile-allowlists.test.ts checks both lists against the dump.
agentHost:
  casks:
    - 1password-cli
    - anthropics/tap/ant
    # Coding-agent CLIs that Brim and the Herdr worktree dialog start there
    # (Kimi is the kimi-code formula, which agent hosts keep with every formula).
    - antigravity-cli
    - claude-code@latest
    - codex
    - gcloud-cli
    # Provides the xterm-ghostty terminfo for sessions opened from Ghostty.
    - ghostty
    # PinchTab drives Canary as its dedicated automation browser
    # (run_once_after_install-pinchtab-daemon.sh).
    - google-chrome@canary
    - grok-build
    - muse-code
    - orbstack
